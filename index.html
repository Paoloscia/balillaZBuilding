<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ============================================================

// ============================================================
const SUPABASE_URL = "https://gtxeacrydiullkyqanpu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_G7n7aUW5IhECINFT3T2ybw_JrquwZq7";
// ============================================================

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- ELO ----------
const K = 32;
const HANDICAP = 0.25;     // quanto pesa lo sbilanciamento interno della coppia
const NO_SCORE_BASE = 0.5; // valore di una partita senza punteggio (10-9 ≈ 0.7)
const SUGGESTED_BOOST = 1.4;  // le partite consigliate del giorno
const LINEUP_BOOST = 1.25;    // i tavoli di "Chi c'e' oggi", se portano incroci nuovi

const expectedScore = (ra, rb) => 1 / (1 + Math.pow(10, (rb - ra) / 400));

const movMultiplier = (goalDiff, winnerElo, loserElo) =>
  Math.log(goalDiff + 1) * (2.2 / ((winnerElo - loserElo) * 0.001 + 2.2));

// Reset di fine stagione a scaglioni: il vantaggio si conserva ma compresso,
// cosi' il piu' forte non riparte alla pari e non prosciuga gli altri.
function seasonStartElo(elo) {
  if (elo >= 1250) return 1150;
  if (elo >= 1150) return 1100;
  if (elo >= 1050) return 1050;
  if (elo >= 950) return 1000;
  if (elo >= 850) return 950;
  if (elo >= 750) return 900;
  return 850;
}

function teamRating(ids) {
  if (ids.length === 1) return byId(ids[0]).elo;
  const [r1, r2] = ids.map((id) => byId(id).elo);
  return (r1 + r2) / 2 - HANDICAP * Math.abs(r1 - r2);
}

function computeMatch(idsA, idsB, scoreA, scoreB, winnerSide, refDate = null, boost = 1) {
  const size = idsA.length;
  const ratingA = teamRating(idsA);
  const ratingB = teamRating(idsB);
  const noScore = scoreA == null || scoreB == null;
  const aWins = noScore ? winnerSide === "A" : scoreA > scoreB;

  const winnerElo = aWins ? ratingA : ratingB;
  const loserElo = aWins ? ratingB : ratingA;
  const mov = noScore
    ? NO_SCORE_BASE * (2.2 / ((winnerElo - loserElo) * 0.001 + 2.2))
    : movMultiplier(Math.abs(scoreA - scoreB), winnerElo, loserElo);

  const expA = expectedScore(ratingA, ratingB);
  const totalA = K * mov * ((aWins ? 1 : 0) - expA) * size
    * repetitionFactor(idsA, idsB, refDate ?? Date.now())
    * boost;

  const deltas = {};
  const assign = (ids, total, winning) => {
    if (ids.length === 1) { deltas[ids[0]] = Math.round(total); return; }
    const [i, j] = ids;
    const ri = byId(i).elo, rj = byId(j).elo;
    const shareI = winning ? rj / (ri + rj) : ri / (ri + rj);
    deltas[i] = Math.round(total * shareI);
    deltas[j] = Math.round(total * (1 - shareI));
  };
  assign(idsA, totalA, aWins);
  assign(idsB, -totalA, !aWins);

  const winners = aWins ? idsA : idsB;
  const pre = {};
  [...idsA, ...idsB].forEach((id) => (pre[id] = byId(id).elo));

  return { deltas, winners, pre };
}

// ---------- Tornei: tabellone ----------
function bracketOrder(size) {
  let arr = [0];
  while (arr.length < size) {
    const m = arr.length * 2;
    const next = [];
    for (const x of arr) { next.push(x); next.push(m - 1 - x); }
    arr = next;
  }
  return arr;
}

function advance(rounds, r, i, teamIdx) {
  if (r + 1 >= rounds.length) return;
  const nm = rounds[r + 1][Math.floor(i / 2)];
  if (i % 2 === 0) nm.a = teamIdx; else nm.b = teamIdx;
}

function buildBracket(teamCount) {
  let size = 1;
  while (size < teamCount) size *= 2;
  const slots = bracketOrder(size).map((s) => (s < teamCount ? s : null));
  const rounds = [];
  const first = [];
  for (let i = 0; i < slots.length; i += 2)
    first.push({ a: slots[i], b: slots[i + 1], winner: null, score: null });
  rounds.push(first);
  let n = first.length;
  while (n > 1) {
    n = Math.floor(n / 2);
    rounds.push(Array.from({ length: n }, () => ({ a: null, b: null, winner: null, score: null })));
  }
  // bye del primo turno: passa il turno automaticamente
  rounds[0].forEach((m, i) => {
    if (m.a != null && m.b == null) { m.winner = m.a; advance(rounds, 0, i, m.a); }
    else if (m.b != null && m.a == null) { m.winner = m.b; advance(rounds, 0, i, m.b); }
  });
  return rounds;
}

const ROUND_NAMES = ["FINALE", "SEMIFINALI", "QUARTI", "OTTAVI", "SEDICESIMI"];
const roundName = (r, total) => ROUND_NAMES[total - 1 - r] ?? `TURNO ${r + 1}`;

// ---------- Stato ----------
const state = {

  seasons: [],
  results: {},        // season_id -> righe season_results ordinate per rank
  matches: [],        // confermate, ultime 200
  pending: [],
  tournaments: [],
  tab: "classifica",
  historySeason: "all",
  tPairs: [["", ""], ["", ""]],
  tName: "",
  tFormat: "elim",
  profileId: null,
  present: [],
  suggestedList: [], // formazioni consigliate usate, col relativo bonus
  mode: "1v1",
  noScore: false,
  winnerSide: null,
  teamA: ["", ""],

  scoreB: 0,

  session: null,
};

const isAdmin = () => !!state.session;
const activeSeason = () => state.seasons.find((s) => s.active) ?? null;
const plannedSeasons = () => state.seasons.filter((s) => !s.active && !s.ended_at);
const closedSeasons = () => state.seasons.filter((s) => !s.active && s.ended_at);

const TABS = [
  ["classifica", "Classifica"],
  ["partita", "Partita"],
  ["storico", "Storico"],
  ["tornei", "Tornei"],
  ["stagioni", "Stagioni"],

const ROLE_LABEL = { difensore: "🛡️ Difensore", attaccante: "⚽ Attaccante", ibrido: "🔁 Ibrido" };
const roleOf = (p) => p.role ?? "ibrido";

const esc = (s) =>
  String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const byId = (id) => state.players.find((p) => p.id === id);
const nameOf = (id) => byId(id)?.name ?? "?";
const seasonById = (id) => state.seasons.find((s) => s.id === id);
const seasonName = (id) => seasonById(id)?.name ?? "?";
const fmtDate = (iso, withTime = true) =>
  new Date(iso).toLocaleDateString("it-IT", {
    day: "numeric", month: "short",
    ...(withTime ? { hour: "2-digit", minute: "2-digit" } : { year: "numeric" }),
  });

// ---------- Dati ----------
async function loadAll() {
  const [pRes, sRes, rRes, mRes, pendRes, tRes] = await Promise.all([
    sb.from("players").select("*").order("elo", { ascending: false }),
    sb.from("seasons").select("*").order("created_at", { ascending: false }),
    sb.from("season_results").select("*").order("rank", { ascending: true }),
    sb.from("matches").select("*").eq("status", "confirmed")
      .order("confirmed_at", { ascending: false }).limit(200),
    sb.from("matches").select("*").eq("status", "pending")
      .order("created_at", { ascending: true }),
    sb.from("tournaments").select("*").order("created_at", { ascending: false }),
  ]);
  if (pRes.error || sRes.error || rRes.error || mRes.error || pendRes.error || tRes.error) {
    toast("Errore di connessione: controlla configurazione e script SQL", false);
    return;
  }
  state.players = pRes.data;
  state.seasons = sRes.data;
  state.matches = mRes.data;
  state.pending = pendRes.data;
  state.tournaments = tRes.data;

  state.results = {};
  for (const r of rRes.data) (state.results[r.season_id] ??= []).push(r);

  if (state.historySeason !== "all" && !state.seasons.some((s) => s.id === state.historySeason))
    state.historySeason = "all";
}

async function setRole(id, role) {

}

async function applyDeltas(deltas, winners, sign = 1) {
  const updates = Object.keys(deltas).map((id) => {
    const p = byId(id);
    if (!p) return Promise.resolve({});
    const won = winners.includes(id);
    return sb.from("players").update({
      elo: p.elo + sign * deltas[id],
      wins: p.wins + sign * (won ? 1 : 0),
      losses: p.losses + sign * (won ? 0 : 1),
    }).eq("id", id);
  });
  const results = await Promise.all(updates);
  return !results.some((r) => r.error);
}

// crea una partita confermata (usata dal form e dai tornei)
async function insertConfirmedMatch(idsA, idsB, scoreA, scoreB, winnerSide, seasonId, boost = 1) {
  const { deltas, winners, pre } = computeMatch(idsA, idsB, scoreA, scoreB, winnerSide, null, boost);
  const ok = await applyDeltas(deltas, winners);
  const ins = await sb.from("matches").insert({
    mode: idsA.length === 1 ? "1v1" : "2v2",
    team_a: idsA, team_b: idsB,
    score_a: scoreA, score_b: scoreB,
    winner_side: winnerSide,
    season_id: seasonId,
    deltas, pre, winners, boost,
    status: "confirmed",
    confirmed_at: new Date().toISOString(),
  });
  return ok && !ins.error;
}

const teamSetEq = (x, y) => [...x].sort().join() === [...y].sort().join();

function suggestionBoostFor(a, b) {
  for (let i = 0; i < state.suggestedList.length; i++) {
    const s = state.suggestedList[i];
    if ((teamSetEq(a, s.a) && teamSetEq(b, s.b)) || (teamSetEq(a, s.b) && teamSetEq(b, s.a)))
      return { boost: s.boost, index: i };
  }
  return null;
}

function currentSuggestion() {
  if (state.mode !== "2v2") return null;
  const a = state.teamA.slice(0, 2), b = state.teamB.slice(0, 2);
  if (a.some((x) => !x) || b.some((x) => !x)) return null;
  return suggestionBoostFor(a, b);
}

async function recordMatch() {
  const season = activeSeason();
  if (!season) { toast("Nessuna stagione attiva", false); return; }
  const size = state.mode === "1v1" ? 1 : 2;
  const idsA = state.teamA.slice(0, size);
  const idsB = state.teamB.slice(0, size);
  const noScore = state.noScore;
  const sa = noScore ? null : state.scoreA;
  const sbv = noScore ? null : state.scoreB;
  const ws = noScore ? state.winnerSide : null;
  const sugg = currentSuggestion();
  const boost = sugg?.boost ?? 1;

  if (isAdmin()) {
    const ok = await insertConfirmedMatch(idsA, idsB, sa, sbv, ws, season.id, boost);
    if (!ok) { toast("Errore di salvataggio, ricarica la pagina", false); return; }
    toast("Partita registrata");
    state.tab = "classifica";
  } else {
    const ins = await sb.from("matches").insert({
      mode: state.mode,
      team_a: idsA, team_b: idsB,
      score_a: sa, score_b: sbv,
      winner_side: ws,
      season_id: season.id,
      boost,
      status: "pending",
    });
    if (ins.error) { toast("Errore di invio, riprova", false); return; }
    toast("Partita inviata: conterà dopo la conferma di un admin");
    state.tab = "storico";
  }

  state.teamA = ["", ""];
  state.teamB = ["", ""];
  state.scoreA = 0;
  state.scoreB = 0;
  state.winnerSide = null;
  if (sugg) state.suggestedList.splice(sugg.index, 1);
}

async function confirmMatch(id) {
  const m = state.pending.find((x) => x.id === id);
  if (!m) return;
  if (!seasonById(m.season_id)?.active) {
    toast("La stagione di questa partita è chiusa: rifiutala", false);
    return;
  }
  const ids = [...m.team_a, ...m.team_b];
  if (ids.some((pid) => !byId(pid))) {
    toast("Giocatore non trovato, impossibile confermare", false);
    return;
  }
  const { deltas, winners, pre } = computeMatch(
    m.team_a, m.team_b, m.score_a, m.score_b, m.winner_side, m.created_at, m.boost ?? (m.boosted ? 1.25 : 1)
  );
  const ok = await applyDeltas(deltas, winners);
  const upd = await sb.from("matches").update({
    deltas, pre, winners,
    status: "confirmed",
    confirmed_at: new Date().toISOString(),
  }).eq("id", id);
  if (!ok || upd.error) { toast("Errore nella conferma, ricarica la pagina", false); return; }
  toast("Partita confermata");
}

async function rejectMatch(id) {
  const del = await sb.from("matches").delete().eq("id", id);
  if (del.error) { toast("Errore, riprova", false); return; }
  toast("Partita rifiutata");
}

async function undoLast() {
  const last = state.matches[0];
  if (!last) return;
  // i delta sono interi: sottrarli ripristina esattamente i rating
  const ok = await applyDeltas(last.deltas, last.winners, -1);
  const del = await sb.from("matches").delete().eq("id", last.id);
  if (!ok || del.error) { toast("Errore, ricarica la pagina", false); return; }
  toast("Ultima partita annullata");
}

async function closeSeason() {
  const season = activeSeason();
  if (!season) return;

  // 1) snapshot nell'albo d'oro
  const ranked = [...state.players].sort((a, b) => b.elo - a.elo);
  const rows = ranked.map((p, i) => ({
    season_id: season.id,
    player_id: p.id,
    name: p.name,
    elo: p.elo,
    wins: p.wins,
    losses: p.losses,
    rank: i + 1,
  }));
  const r1 = await sb.from("season_results").insert(rows);
  if (r1.error) { toast("Errore nello snapshot della stagione", false); return; }

  // 2) chiudi la corrente
  const r2 = await sb.from("seasons")
    .update({ active: false, ended_at: new Date().toISOString() })
    .eq("id", season.id);

  // 3) reset del rank a scaglioni
  const resets = await Promise.all(state.players.map((p) =>
    sb.from("players")
      .update({ elo: seasonStartElo(p.elo), wins: 0, losses: 0 })
      .eq("id", p.id)
  ));
  const r3 = { error: resets.find((r) => r.error)?.error ?? null };

  // 4) avvia la pianificata più vecchia, se c'è
  const next = plannedSeasons().sort((a, b) => new Date(a.created_at) - new Date(b.created_at))[0];
  let r4 = { error: null };
  if (next) {
    r4 = await sb.from("seasons")
      .update({ active: true, created_at: new Date().toISOString() })
      .eq("id", next.id);
  }

  if (r2.error || r3.error || r4.error) {
    toast("Errore nella chiusura, controlla il pannello Supabase", false);
    return;
  }
  toast(next ? `Stagione chiusa. Al via "${next.name}"!` : "Stagione chiusa e archiviata");
}

// ---------- Tornei ----------
function pairRating(pair) {
  const [a, b] = pair.map((id) => byId(id).elo);
  return (a + b) / 2 - HANDICAP * Math.abs(a - b);
}

async function createTournament() {
  const season = activeSeason();
  if (!season) { toast("Serve una stagione attiva", false); return; }
  const name = state.tName.trim();
  if (!name) { toast("Dai un nome al torneo", false); return; }
  const pairs = state.tPairs.filter((p) => p[0] && p[1]);
  const flat = pairs.flat();
  if (pairs.length < 2 || pairs.length !== state.tPairs.length) {
    toast("Completa tutte le coppie (minimo 2)", false); return;
  }
  if (new Set(flat).size !== flat.length) {
    toast("Un giocatore è in più coppie", false); return;
  }
  // teste di serie: coppie ordinate per rating
  const sorted = [...pairs].sort((x, y) => pairRating(y) - pairRating(x));
  const teams = sorted.map(([p1, p2]) => ({ p1, p2 }));
  let bracket;
  if (state.tFormat === "girone") {
    const fixtures = [];
    for (let i = 0; i < teams.length; i++)
      for (let j = i + 1; j < teams.length; j++)
        fixtures.push({ a: i, b: j, winner: null, score: null });
    bracket = [fixtures];
  } else {
    bracket = buildBracket(teams.length);
  }

  const { error } = await sb.from("tournaments").insert({
    name, season_id: season.id, teams, bracket, format: state.tFormat,
  });
  if (error) { toast("Errore nella creazione del torneo", false); return; }
  state.tName = "";
  state.tPairs = [["", ""], ["", ""]];
  toast(`Torneo "${name}" creato`);
}

async function recordTournamentMatch(tid, r, i, sa, sbv) {
  const t = state.tournaments.find((x) => x.id === tid);
  if (!t || t.status !== "open") return;
  if (!seasonById(t.season_id)?.active) {
    toast("La stagione del torneo è chiusa", false); return;
  }
  const bracket = t.bracket;
  const m = bracket[r]?.[i];
  if (!m || m.a == null || m.b == null || m.winner != null) return;
  if (!Number.isInteger(sa) || !Number.isInteger(sbv) || sa < 0 || sbv < 0 || sa === sbv) {
    toast("Punteggio non valido", false); return;
  }
  const tA = t.teams[m.a], tB = t.teams[m.b];
  const idsA = [tA.p1, tA.p2], idsB = [tB.p1, tB.p2];
  if ([...idsA, ...idsB].some((id) => !byId(id))) {
    toast("Giocatore non trovato", false); return;
  }

  const ok = await insertConfirmedMatch(idsA, idsB, sa, sbv, null, t.season_id);
  if (!ok) { toast("Errore nel salvataggio della partita", false); return; }

  m.winner = sa > sbv ? m.a : m.b;
  m.score = [sa, sbv];
  const fmt = t.format ?? "elim";
  let status = "open";
  if (fmt === "girone") {
    if (bracket[0].every((f) => f.winner != null)) status = "done";
  } else {
    advance(bracket, r, i, m.winner);
    if (bracket[bracket.length - 1][0].winner != null) status = "done";
  }

  const upd = await sb.from("tournaments").update({ bracket, status }).eq("id", tid);
  if (upd.error) { toast("Partita salvata ma tabellone non aggiornato: ricarica", false); return; }
  if (status === "done") {
    const winIdx = fmt === "girone" ? gironeStandings(t)[0].i : m.winner;
    toast(`Torneo concluso! Vince ${teamLabel(t, winIdx)} 🏆`);
  } else {
    toast("Risultato registrato");
  }
}

const teamLabel = (t, idx) =>
  idx == null ? "—" : `${nameOf(t.teams[idx].p1)} + ${nameOf(t.teams[idx].p2)}`;

function gironeStandings(t) {
  const st = t.teams.map((_, i) => ({ i, w: 0, l: 0, gf: 0, gs: 0 }));
  for (const f of t.bracket[0]) {
    if (f.winner == null || !f.score) continue;
    st[f.a].gf += f.score[0]; st[f.a].gs += f.score[1];
    st[f.b].gf += f.score[1]; st[f.b].gs += f.score[0];
    if (f.winner === f.a) { st[f.a].w++; st[f.b].l++; } else { st[f.b].w++; st[f.a].l++; }
  }
  st.sort((x, y) => y.w - x.w || (y.gf - y.gs) - (x.gf - x.gs) || y.gf - x.gf);
  return st;
}

function gironeHTML(t, canRecord) {
  const st = gironeStandings(t);
  const fixtures = t.bracket[0];
  const played = fixtures.filter((f) => f.winner != null).length;
  let out = `<div class="section-label">CLASSIFICA GIRONE</div>`;
  out += st.map((row, pos) =>
    `<div class="b-team ${pos === 0 && played ? "winner" : ""}" style="padding:4px 0">
      <span style="width:22px;font-family:var(--font-display)">${pos + 1}</span>
      ${esc(teamLabel(t, row.i))}
      <span class="b-score" style="font-size:13px">${row.w}V–${row.l}S · ${row.gf - row.gs >= 0 ? "+" : ""}${row.gf - row.gs}</span>
    </div>`).join("");
  out += `<div class="section-label">PARTITE (${played}/${fixtures.length})</div>`;
  fixtures.forEach((m, i) => {
    const recordUI = canRecord && m.winner == null
      ? `<div class="b-record">
          <input class="ts-input" type="number" min="0" id="ts-${t.id}-0-${i}-a" placeholder="0">
          <span style="opacity:0.6">–</span>
          <input class="ts-input" type="number" min="0" id="ts-${t.id}-0-${i}-b" placeholder="0">
          <button data-trecord="${t.id}|0|${i}">OK</button>
        </div>` : "";
    out += `<div class="b-match">
      <div class="b-team ${m.winner === m.a ? "winner" : ""}">${esc(teamLabel(t, m.a))}${m.score ? `<span class="b-score">${m.score[0]}</span>` : ""}</div>
      <div class="b-team ${m.winner === m.b ? "winner" : ""}">${esc(teamLabel(t, m.b))}${m.score ? `<span class="b-score">${m.score[1]}</span>` : ""}</div>
      ${recordUI}
    </div>`;
  });
  return out;
}

// ---------- Storico incroci, consigliate e formazioni ----------
const PAIRINGS = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
const pairKey = (a, b) => (a < b ? a + "|" + b : b + "|" + a);

function historyMaps() {
  const games = {}, last = {}, faced = {}, teamed = {};
  for (const m of state.matches) {
    const dt = new Date(m.created_at).getTime();
    for (const id of [...m.team_a, ...m.team_b]) {
      games[id] = (games[id] ?? 0) + 1;
      if (!last[id] || dt > last[id]) last[id] = dt;
    }
    for (const a of m.team_a) for (const b of m.team_b) {
      const k = pairKey(a, b);
      faced[k] = (faced[k] ?? 0) + 1;
    }
    if (m.team_a.length === 2) { const k = pairKey(m.team_a[0], m.team_a[1]); teamed[k] = (teamed[k] ?? 0) + 1; }
    if (m.team_b.length === 2) { const k = pairKey(m.team_b[0], m.team_b[1]); teamed[k] = (teamed[k] ?? 0) + 1; }
  }
  return { games, last, faced, teamed };
}

// Dalla terza partita dello stesso giorno tra le stesse squadre il delta si dimezza:
// le maratone contano, ma non spostano montagne di punti.
function repetitionFactor(idsA, idsB, refDate) {
  const day = new Date(refDate).toDateString();
  const mk = (a, b) => {
    const ta = [...a].sort().join(",");
    const tb = [...b].sort().join(",");
    return ta < tb ? ta + "|" + tb : tb + "|" + ta;
  };
  const k = mk(idsA, idsB);
  const prior = state.matches.filter((m) =>
    new Date(m.created_at).toDateString() === day && mk(m.team_a, m.team_b) === k
  ).length;
  return prior >= 2 ? 0.5 : 1;
}

function scorePairing(A, B, maps, opts = {}) {
  const { requireNew = true, balanceWeight = 0.1, activityWeight = 1, ignoreRoles = false } = opts;
  const { games, faced, teamed } = maps;
  if (!ignoreRoles) {
    const doubleAttack = (T) => roleOf(T[0]) === "attaccante" && roleOf(T[1]) === "attaccante";
    if (doubleAttack(A) || doubleAttack(B)) return null;
  }
  const compl = [A, B].filter((T) => {
    const r = T.map(roleOf);
    return r.includes("attaccante") && r.includes("difensore");
  }).length;
  const cross = [[A[0], B[0]], [A[0], B[1]], [A[1], B[0]], [A[1], B[1]]];
  const newFaced = cross.filter(([x, y]) => !faced[pairKey(x.id, y.id)]).length;
  const newTeams =
    (teamed[pairKey(A[0].id, A[1].id)] ? 0 : 1) +
    (teamed[pairKey(B[0].id, B[1].id)] ? 0 : 1);
  if (requireNew && newFaced === 0 && newTeams === 0) return null;
  const habit =
    (teamed[pairKey(A[0].id, A[1].id)] ?? 0) +
    (teamed[pairKey(B[0].id, B[1].id)] ?? 0);
  const activity = [...A, ...B].reduce((s, p) => s + (games[p.id] ?? 0), 0);
  const r2 = (a, b) => (a.elo + b.elo) / 2 - HANDICAP * Math.abs(a.elo - b.elo);
  const gap = Math.abs(r2(A[0], A[1]) - r2(B[0], B[1]));
  const score =
    newFaced * 30 + newTeams * 20 + compl * 8
    - Math.min(habit, 10) * 6
    + Math.min(activity, 40) * activityWeight
    - gap * balanceWeight;
  return { A, B, newFaced, newTeams, gap, score };
}

function suggestedMatches() {
  const now = Date.now();
  const MAX_AGE = 60 * 24 * 3600 * 1000;
  const maps = historyMaps();
  const active = state.players.filter((p) => maps.last[p.id] && now - maps.last[p.id] <= MAX_AGE);
  if (active.length < 4) return [];
  const cands = [];
  for (let i = 0; i < active.length; i++)
    for (let j = i + 1; j < active.length; j++)
      for (let k = j + 1; k < active.length; k++)
        for (let l = k + 1; l < active.length; l++) {
          const q = [active[i], active[j], active[k], active[l]];
          for (const [[a1, a2], [b1, b2]] of PAIRINGS) {
            const c = scorePairing([q[a1], q[a2]], [q[b1], q[b2]], maps);
            if (c) cands.push(c);
          }
        }
  cands.sort((x, y) => y.score - x.score);
  const out = [];
  for (const c of cands) {
    const ids = new Set([...c.A, ...c.B].map((p) => p.id));
    const overlap = out.some((o) => [...o.A, ...o.B].filter((p) => ids.has(p.id)).length >= 3);
    if (!overlap) out.push(c);
    if (out.length === 3) break;
  }
  return out;
}

// Le due coppie migliori tra i presenti: equilibrio prima di tutto,
// precedenza a chi ha giocato meno, ruoli rispettati quando possibile.
function bestLineup(ids) {
  const ps = ids.map(byId).filter(Boolean);
  if (ps.length < 4) return null;
  const maps = historyMaps();
  const evalAll = (ignoreRoles) => {
    let best = null;
    for (let i = 0; i < ps.length; i++)
      for (let j = i + 1; j < ps.length; j++)
        for (let k = j + 1; k < ps.length; k++)
          for (let l = k + 1; l < ps.length; l++) {
            const q = [ps[i], ps[j], ps[k], ps[l]];
            for (const [[a1, a2], [b1, b2]] of PAIRINGS) {
              const c = scorePairing([q[a1], q[a2]], [q[b1], q[b2]], maps,
                { requireNew: false, balanceWeight: 0.6, activityWeight: -0.6, ignoreRoles });
              if (c && (!best || c.score > best.score)) best = c;
            }
          }
    return best;
  };
  let best = evalAll(false);
  let ignoredRoles = false;
  if (!best) { best = evalAll(true); ignoredRoles = true; }
  return best ? { ...best, ignoredRoles } : null;
}

// Requisiti per comparire in classifica (stagione corrente).
const QUAL = { games: 10, opps: 6, mates: 3 };
function qualification(p) {
  const sid = activeSeason()?.id;
  const opps = new Set(), mates = new Set();
  for (const m of state.matches) {
    if (sid && m.season_id !== sid) continue;
    const inA = m.team_a.includes(p.id), inB = m.team_b.includes(p.id);
    if (!inA && !inB) continue;
    for (const o of (inA ? m.team_b : m.team_a)) opps.add(o);
    for (const mt of (inA ? m.team_a : m.team_b)) if (mt !== p.id) mates.add(mt);
  }
  const games = p.wins + p.losses;
  return {
    games, opps: opps.size, mates: mates.size,
    ok: games >= QUAL.games && opps.size >= QUAL.opps && mates.size >= QUAL.mates,
  };
}

function formOf(pid, seasonId = null) {
  return state.matches
    .filter((m) =>
      (seasonId == null || m.season_id === seasonId) &&
      (m.team_a.includes(pid) || m.team_b.includes(pid)))
    .slice(0, 5)
    .map((m) => m.winners.includes(pid));
}

function streakOf(form) {
  if (form.length < 2) return "";
  let n = 1;
  while (n < form.length && form[n] === form[0]) n++;
  if (n < 2) return "";
  return `<span class="streak">${n}${form[0] ? "V" : "S"} di fila</span>`;
}

// ---------- Profilo giocatore ----------
function profileData(pid) {
  const ms = state.matches
    .filter((m) => m.team_a.includes(pid) || m.team_b.includes(pid))
    .slice().reverse(); // cronologico
  const curve = [];
  for (const m of ms) if (m.pre && m.pre[pid] != null) curve.push(m.pre[pid]);
  const p = byId(pid);
  if (p) curve.push(p.elo);
  const vs = {}, mate = {};
  let bestWin = null, bestStreak = 0, cur = 0;
  for (const m of ms) {
    const inA = m.team_a.includes(pid);
    const won = m.winners.includes(pid);
    const opps = inA ? m.team_b : m.team_a;
    const mates = (inA ? m.team_a : m.team_b).filter((x) => x !== pid);
    for (const o of opps) { (vs[o] ??= { w: 0, l: 0 }); won ? vs[o].w++ : vs[o].l++; }
    for (const mt of mates) { (mate[mt] ??= { w: 0, l: 0 }); won ? mate[mt].w++ : mate[mt].l++; }
    if (won) { cur++; bestStreak = Math.max(bestStreak, cur); } else cur = 0;
    if (won && m.score_a != null) {
      const diff = Math.abs(m.score_a - m.score_b);
      if (!bestWin || diff > bestWin.diff) bestWin = { diff, m };
    }
  }
  const pick = (obj, key, min) => {
    let best = null;
    for (const id of Object.keys(obj)) {
      const r = obj[id];
      if (r.w + r.l < min) continue;
      const v = key(r);
      if (!best || v > best.v) best = { id, r, v };
    }
    return best;
  };
  const nem = pick(vs, (r) => r.l * 2 - r.w, 2);
  const vit = pick(vs, (r) => r.w * 2 - r.l, 2);
  return {
    ms, curve,
    nemesi: nem && nem.r.l >= 2 ? nem : null,
    vittima: vit && vit.r.w >= 2 ? vit : null,
    oro: pick(mate, (r) => r.w / (r.w + r.l), 2),
    bestWin, bestStreak,
  };
}

function badgesOf(pid, d) {
  const out = [];
  const cappotti = d.ms.filter((m) => m.winners.includes(pid) && m.score_a != null &&
    Math.min(m.score_a, m.score_b) === 0 && Math.max(m.score_a, m.score_b) >= 8).length;
  if (cappotti) out.push({ icon: "🧹", label: `Cappotto ×${cappotti}` });
  const giganti = d.ms.filter((m) => {
    if (!m.winners.includes(pid) || !m.pre) return false;
    const inA = m.team_a.includes(pid);
    const avg = (ids) => ids.reduce((s, id) => s + (m.pre[id] ?? 1000), 0) / ids.length;
    return avg(inA ? m.team_b : m.team_a) - avg(inA ? m.team_a : m.team_b) >= 120;
  }).length;
  if (giganti) out.push({ icon: "⚔️", label: `Ammazzagiganti ×${giganti}` });
  if (d.bestStreak >= 5) out.push({ icon: "🔥", label: `Striscia da ${d.bestStreak}V` });
  let titoli = 0, cucchiai = 0;
  for (const sid of Object.keys(state.results)) {
    const res = state.results[sid];
    const mine = res.find((r) => r.player_id === pid);
    if (!mine) continue;
    if (mine.rank === 1) titoli++;
    if (mine.rank === res.length && res.length > 1) cucchiai++;
  }
  if (titoli) out.push({ icon: "👑", label: `Stagioni vinte ×${titoli}` });
  if (cucchiai) out.push({ icon: "🥄", label: `Cucchiaio di legno ×${cucchiai}` });
  const tornei = state.tournaments.filter((t) => {
    if (t.status !== "done") return false;
    const fmt = t.format ?? "elim";
    const winIdx = fmt === "girone"
      ? gironeStandings(t)[0]?.i
      : t.bracket[t.bracket.length - 1][0].winner;
    const team = t.teams[winIdx];
    return team && (team.p1 === pid || team.p2 === pid);
  }).length;
  if (tornei) out.push({ icon: "🏆", label: `Tornei vinti ×${tornei}` });
  return out;
}

function sparklineSVG(curve) {
  if (curve.length < 2) return "";
  const W = 480, H = 90, PAD = 6;
  const min = Math.min(...curve), max = Math.max(...curve);
  const span = Math.max(max - min, 10);
  const x = (i) => PAD + (i / (curve.length - 1)) * (W - 2 * PAD);
  const y = (v) => H - PAD - ((v - min) / span) * (H - 2 * PAD);
  const pts = curve.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <polyline points="${pts}" fill="none" stroke="#E8B341" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
  <div class="meta" style="display:flex;justify-content:space-between"><span>min ${min}</span><span>max ${max}</span></div>`;
}

function renderProfile(pid) {
  const p = byId(pid);
  if (!p) return `<div class="empty">Giocatore non trovato.</div>`;
  const d = profileData(pid);
  const tot = p.wins + p.losses;
  const pct = tot ? Math.round((p.wins / tot) * 100) : 0;
  const badges = badgesOf(pid, d);
  const chips = badges.length
    ? badges.map((b) => `<span class="chip">${b.icon} ${esc(b.label)}</span>`).join("")
    : `<span class="meta">Ancora nessun trofeo. C'è tempo.</span>`;
  const line = (label, val) => `<p><span style="opacity:0.7">${label}:</span> ${val}</p>`;
  let stats = "";
  if (d.nemesi) stats += line("Nemesi", `<b>${esc(nameOf(d.nemesi.id))}</b> (${d.nemesi.r.l}S–${d.nemesi.r.w}V contro)`);
  if (d.vittima) stats += line("Vittima preferita", `<b>${esc(nameOf(d.vittima.id))}</b> (${d.vittima.r.w}V–${d.vittima.r.l}S contro)`);
  if (d.oro) {
    const wr = Math.round((d.oro.r.w / (d.oro.r.w + d.oro.r.l)) * 100);
    stats += line("Compagno d'oro", `<b>${esc(nameOf(d.oro.id))}</b> (${wr}% di vittorie insieme)`);
  }
  if (d.bestWin) stats += line("Miglior vittoria", `<b>${Math.max(d.bestWin.m.score_a, d.bestWin.m.score_b)}–${Math.min(d.bestWin.m.score_a, d.bestWin.m.score_b)}</b> il ${fmtDate(d.bestWin.m.created_at, false)}`);
  if (d.bestStreak >= 2) stats += line("Miglior striscia", `<b>${d.bestStreak} vittorie</b> di fila`);
  if (!stats) stats = `<p class="meta">Servono un po' di partite per le statistiche.</p>`;

  return `
    <button class="undo" id="profile-back">← Torna alla classifica</button>
    <div class="info-card">
      <h3>${esc(p.name).toUpperCase()}</h3>
      <p style="font-family:var(--font-display);font-size:30px;margin:4px 0">${p.elo}</p>
      <p class="meta">${ROLE_LABEL[roleOf(p)]} · ${p.wins}V – ${p.losses}S${tot ? ` · ${pct}% vittorie` : ""} · ${d.ms.length} partite recenti</p>
    </div>
    ${d.curve.length >= 2 ? `<div class="info-card"><h3>ANDAMENTO ELO</h3>${sparklineSVG(d.curve)}</div>` : ""}
    <div class="info-card"><h3>BACHECA</h3>${chips}</div>
    <div class="info-card"><h3>STATISTICHE</h3>${stats}</div>`;
}

function render() {
  renderNav();

  // ---------- CLASSIFICA ----------

      app.innerHTML = renderProfile(state.profileId);

      app.innerHTML = `<div class="empty">Nessun giocatore in rosa. Aggiungi i primi nella scheda Giocatori.</div>`;

    }

    const quals = new Map(sorted.map((p) => [p.id, qualification(p)]));
    const ranked = sorted.filter((p) => quals.get(p.id).ok);
    const unranked = sorted.filter((p) => !quals.get(p.id).ok);

    const rowHTML = (p, i, q) => {
      const tot = p.wins + p.losses;
      const pct = tot ? Math.round((p.wins / tot) * 100) : 0;
      const form = formOf(p.id, season?.id ?? null);
      const dots = form.map((w) => `<span class="dot ${w ? "w" : "l"}"></span>`).join("");
      const streak = streakOf(form);
      const missing = q
        ? `<div class="meta">${q.games}/${QUAL.games} partite · ${q.opps}/${QUAL.opps} avversari · ${q.mates}/${QUAL.mates} compagni</div>`
        : "";
      return `<div class="row ${i === 0 ? "first" : ""}" data-profile="${p.id}" style="cursor:pointer${q ? ";opacity:0.7" : ""}">
        <div class="rank ${i === 0 ? "gold" : ""}">${q ? "–" : i + 1}</div>
        <div style="flex:1">
          <div class="player-name">${esc(p.name)}</div>
          <div class="meta">${p.wins}V – ${p.losses}S${tot ? ` · ${pct}%` : ""}${streak ? " · " + streak : ""}</div>
          ${missing}
          ${form.length ? `<div style="margin-top:4px">${dots}</div>` : ""}
        </div>
        <div class="elo">${q ? "~" : ""}${p.elo}</div>
      </div>`;
    };

    let out = ranked.map((p, i) => rowHTML(p, i, null)).join("");
    if (!ranked.length)
      out += `<div class="empty">Nessuno si è ancora qualificato: servono ${QUAL.games} partite, ${QUAL.opps} avversari e ${QUAL.mates} compagni diversi.</div>`;
    if (unranked.length) {
      out += `<div class="section-label" style="margin-top:18px">NON CLASSIFICATI</div>

      out += unranked.map((p) => rowHTML(p, -1, quals.get(p.id))).join("");
    }
    app.innerHTML = out;
    return;
  }

  // ---------- PARTITA ----------
  if (tab === "partita") {
    if (!season) {
      app.innerHTML = `<div class="empty">Nessuna stagione attiva: ${isAdmin() ? "creane una dalla scheda Stagioni." : "chiedi a un admin di aprirne una."}</div>`;
      return;
    }

      app.innerHTML = `<div class="empty">Servono almeno 2 giocatori in rosa.</div>`;
      return;
    }
    const size = state.mode === "1v1" ? 1 : 2;
    const selected = [...state.teamA.slice(0, size), ...state.teamB.slice(0, size)].filter(Boolean);
    const playersOk =
      selected.length === size * 2 && new Set(selected).size === size * 2;
    const valid = playersOk &&
      (state.noScore ? !!state.winnerSide : state.scoreA !== state.scoreB);

    const teamCard = (team, cls, label, score, side) => {
      const taken = new Set([...state.teamA, ...state.teamB].filter(Boolean));

          const sel = team[i] === p.id ? "selected" : "";

    if (playersOk) {
      const fIdsA = state.teamA.slice(0, size);
      const fIdsB = state.teamB.slice(0, size);

          fIdsA, fIdsB,

        <button data-scoremode="noscore" class="${state.noScore ? "active" : ""}" style="font-size:12px">Solo chi ha vinto</button>
      </div>
      <div class="teams">
        ${teamCard(state.teamA, "red", "ROSSI", state.scoreA, "A")}
        <div class="vs">VS</div>
        ${teamCard(state.teamB, "blue", "BLU", state.scoreB, "B")}
      </div>
      ${forecast}
      <div class="hint">${hint}</div>
      <button class="cta${isSugg ? " cta-boost" : ""}" id="save-match" ${valid && !state.busy ? "" : "disabled"}>
        ${isAdmin() ? "Registra partita" : "Invia partita"}${isSugg ? " · ⭐ ×" + boostVal : ""}
      </button>
      ${whoHTML}
      ${suggHTML}`;
    return;
  }

  // ---------- STORICO ----------
  if (tab === "storico") {
    const filterRow = state.seasons.length > 1
      ? `<div class="view-row">
          <button data-histseason="all" class="${state.historySeason === "all" ? "active" : ""}">Tutte</button>
          ${state.seasons.filter((s) => s.active || s.ended_at).map((s) =>
            `<button data-histseason="${s.id}" class="${state.historySeason === s.id ? "active" : ""}">${esc(s.name)}${s.active ? "" : " 🔒"}</button>`
          ).join("")}
        </div>`
      : "";

    const inFilter = (m) => state.historySeason === "all" || m.season_id === state.historySeason;
    const pend = pending.filter(inFilter);
    const conf = matches.filter(inFilter);
    const showSeason = state.historySeason === "all" && state.seasons.length > 1;

    if (!pend.length && !conf.length) {
      app.innerHTML = `${filterRow}<div class="empty">Nessuna partita qui.</div>`;
      return;
    }
    let html = filterRow;
    if (pend.length) {
      html += `<div class="section-label">DA CONFERMARE (${pend.length})</div>`;
      html += pend.map((m) => matchRowHTML(m, { pending: true, actions: isAdmin(), showSeason })).join("");
    }
    if (conf.length) {
      html += `<div class="section-label">PARTITE</div>`;
      if (isAdmin() && state.matches.length)
        html += `<button class="undo" id="undo">Annulla ultima partita</button>`;
      html += conf.map((m) => matchRowHTML(m, { showSeason })).join("");
    }
    app.innerHTML = html;
    return;
  }

  // ---------- TORNEI ----------
  if (tab === "tornei") {
    let html = "";

    if (isAdmin()) {
      if (!season) {
        html += `<div class="empty">Serve una stagione attiva per creare un torneo.</div>`;
      } else {
        const usedIds = new Set(state.tPairs.flat().filter(Boolean));
        const pairRows = state.tPairs.map((pair, pi) => {
          const sel = (slot) => {
            const opts = players.map((p) => {
              const dis = usedIds.has(p.id) && pair[slot] !== p.id ? "disabled" : "";
              const s = pair[slot] === p.id ? "selected" : "";
              return `<option value="${p.id}" ${dis} ${s}>${esc(p.name)} (${p.elo})</option>`;
            }).join("");
            return `<select data-tpair="${pi}" data-tslot="${slot}">
              <option value="">— giocatore —</option>${opts}</select>`;
          };
          const del = state.tPairs.length > 2
            ? `<button class="del-btn" data-tremovepair="${pi}">✕</button>` : "";
          return `<div class="pair-row">${sel(0)}${sel(1)}${del}</div>`;
        }).join("");

        html += `
          <div class="auth-box" style="margin-top:0;margin-bottom:18px">
            <div class="meta" style="margin-bottom:4px">Nuovo torneo a coppie fisse: tabellone a eliminazione o girone all'italiana.</div>
            <div class="mode-row" style="margin-bottom:0">
              <button data-tformat="elim" class="${state.tFormat === "elim" ? "active" : ""}" style="font-size:12px">Eliminazione</button>
              <button data-tformat="girone" class="${state.tFormat === "girone" ? "active" : ""}" style="font-size:12px">Girone</button>
            </div>
            <input id="t-name" placeholder="Nome torneo" maxlength="40" value="${esc(state.tName)}">
            ${pairRows}
            <button class="undo" id="t-addpair" style="margin-bottom:0">+ Aggiungi coppia</button>
            <button class="cta" id="create-tournament" style="font-size:14px;padding:11px 0">Crea torneo</button>
          </div>`;
      }
    }

    if (!state.tournaments.length) {
      html += `<div class="empty">Nessun torneo${isAdmin() ? "" : ", per ora"}.</div>`;
      app.innerHTML = html;
      return;
    }

    const openT = state.tournaments.filter((t) => t.status === "open");
    const doneT = state.tournaments.filter((t) => t.status === "done");

    if (openT.length) html += `<div class="section-label">IN CORSO</div>`;
    for (const t of openT) {
      const rounds = t.bracket;
      const total = rounds.length;
      const canRecord = isAdmin() && seasonById(t.season_id)?.active;
      const fmt = t.format ?? "elim";

      let bracketHTML = "";
      if (fmt === "girone") {
        bracketHTML = gironeHTML(t, canRecord);
      } else
      rounds.forEach((round, r) => {
        bracketHTML += `<div class="b-round"><div class="section-label">${roundName(r, total)}</div>`;
        round.forEach((m, i) => {
          const teamRow = (idx, other) => {
            const won = m.winner != null && m.winner === idx;
            const tbd = idx == null;
            const score = m.score
              ? `<span class="b-score">${idx === m.a ? m.score[0] : m.score[1]}</span>` : "";
            return `<div class="b-team ${won ? "winner" : ""} ${tbd ? "tbd" : ""}">
              ${won ? "🏆 " : ""}${esc(teamLabel(t, idx))}${score}
            </div>`;
          };
          const recordUI = canRecord && m.a != null && m.b != null && m.winner == null
            ? `<div class="b-record">
                <input class="ts-input" type="number" min="0" id="ts-${t.id}-${r}-${i}-a" placeholder="R">
                <span style="opacity:0.6">–</span>
                <input class="ts-input" type="number" min="0" id="ts-${t.id}-${r}-${i}-b" placeholder="B">
                <button data-trecord="${t.id}|${r}|${i}">OK</button>
              </div>` : "";
          bracketHTML += `<div class="b-match">${teamRow(m.a)}${teamRow(m.b)}${recordUI}</div>`;
        });
        bracketHTML += `</div>`;
      });

      html += `<div class="info-card">
        <h3>${esc(t.name).toUpperCase()}</h3>
        <p class="meta" style="margin-bottom:10px">${esc(seasonName(t.season_id))} · ${fmtDate(t.created_at, false)} · ${t.teams.length} coppie · ${fmt === "girone" ? "girone" : "eliminazione"}</p>
        ${bracketHTML}
      </div>`;
    }

    if (doneT.length) {
      html += `<div class="section-label" style="margin-top:22px">ALBO TORNEI</div>`;
      for (const t of doneT) {
        const fmt = t.format ?? "elim";
        let winIdx, detail;
        if (fmt === "girone") {
          const st = gironeStandings(t);
          winIdx = st[0].i;
          detail = st[1] ? `Girone all'italiana · secondi: ${esc(teamLabel(t, st[1].i))} (${st[1].w}V)` : "Girone all'italiana";
        } else {
          const finale = t.bracket[t.bracket.length - 1][0];
          winIdx = finale.winner;
          const loserIdx = finale.winner === finale.a ? finale.b : finale.a;
          const finalScore = finale.score
            ? (finale.winner === finale.a
                ? `${finale.score[0]}–${finale.score[1]}`
                : `${finale.score[1]}–${finale.score[0]}`)
            : "";
          detail = `Finale: battuta ${esc(teamLabel(t, loserIdx))}${finalScore ? " " + finalScore : ""}`;
        }
        html += `<div class="info-card">
          <h3>${esc(t.name).toUpperCase()}</h3>
          <p class="meta" style="margin-bottom:8px">${esc(seasonName(t.season_id))} · ${fmtDate(t.created_at, false)} · ${t.teams.length} coppie</p>
          <div class="podium-row">
            <span class="medal">🏆</span>
            <span class="player-name" style="font-size:15px">${esc(teamLabel(t, winIdx))}</span>
          </div>
          <p class="meta" style="margin-top:6px">${detail}</p>
        </div>`;
      }
    }
    app.innerHTML = html;
    return;
  }

  // ---------- STAGIONI ----------
  if (tab === "stagioni") {
    let html = "";

    if (isAdmin()) {
      html += `
        <div class="auth-box" style="margin-top:0;margin-bottom:18px">
          <div class="meta" style="margin-bottom:4px">${season ? "Pianifica la prossima stagione: partirà alla chiusura di quella in corso." : "Crea una stagione: partirà subito."}</div>
          <input id="new-season-name" placeholder="Nome stagione" maxlength="40">
          <button class="cta" id="create-season" style="font-size:14px;padding:11px 0">${season ? "Pianifica stagione" : "Crea e avvia stagione"}</button>
        </div>`;
    }

    if (season) {
      const ranked = [...players].sort((a, b) => b.elo - a.elo);
      const leader = ranked[0];
      const pendCount = pending.filter((m) => m.season_id === season.id).length;
      html += `<div class="section-label">IN CORSO</div>
        <div class="info-card">
          <h3>${esc(season.name).toUpperCase()}</h3>
          <p class="meta" style="margin-bottom:8px">dal ${fmtDate(season.created_at, false)}${pendCount ? ` · ${pendCount} partite in attesa` : ""}</p>
          ${leader ? `<p>In testa: <b>${esc(leader.name)}</b> (${leader.elo})</p>` : "<p>Nessun giocatore.</p>"}
          ${isAdmin() ? `<button class="close-btn" id="close-season">Chiudi stagione</button>
          <button class="close-btn" data-renameseason="${season.id}" style="margin-left:6px">✏️ Rinomina</button>` : ""}
        </div>`;
    } else {
      html += `<div class="empty">Nessuna stagione in corso.</div>`;
    }

    const planned = plannedSeasons();
    if (planned.length) {
      html += `<div class="section-label">PIANIFICATE</div>`;
      html += planned.map((s) =>
        `<div class="row">
          <div class="player-name" style="flex:1">${esc(s.name)}</div>
          <div class="meta">in coda</div>
          ${isAdmin() ? `<button class="edit-btn" data-renameseason="${s.id}" title="Rinomina">✏️</button>
          <button class="del-btn" data-delseason="${s.id}">✕</button>` : ""}
        </div>`).join("");
    }

    const past = closedSeasons();
    if (past.length) {
      html += `<div class="section-label" style="margin-top:22px">ALBO D'ORO</div>`;
      html += past.map((s) => {
        const res = state.results[s.id] ?? [];
        const medals = ["🥇", "🥈", "🥉"];
        const podium = res.slice(0, 3).map((r, i) =>
          `<div class="podium-row">
            <span class="medal">${medals[i]}</span>
            <span class="player-name" style="font-size:15px">${esc(r.name)}</span>
            <span class="meta" style="margin-top:0">${r.wins}V–${r.losses}S</span>
            <span class="elo-small">${r.elo}</span>
          </div>`
        ).join("");
        const others = res.length > 3 ? `<div class="meta" style="margin-top:6px">e altri ${res.length - 3} giocatori</div>` : "";
        const dates = `${fmtDate(s.created_at, false)} → ${s.ended_at ? fmtDate(s.ended_at, false) : "?"}`;
        return `<div class="info-card">
          <h3>${esc(s.name).toUpperCase()} ${isAdmin() ? `<button class="edit-btn" data-renameseason="${s.id}" title="Rinomina" style="float:right">✏️</button>` : ""}</h3>
          <p class="meta" style="margin-bottom:10px">${dates}</p>
          ${podium || `<p class="meta">Nessun risultato archiviato.</p>`}
          ${others}
        </div>`;
      }).join("");
    }
    app.innerHTML = html;
    return;
  }

  // ---------- ELO ----------
  if (tab === "elo") {
    app.innerHTML = `
      <div class="info-card">
        <h3>LE BASI</h3>
        <p>Tutti partono da <b>1000 punti</b>. Dopo ogni partita il vincitore prende punti e il perdente li perde: quello che guadagna una squadra è esattamente quello che perde l'altra. Il rating non misura quante partite hai vinto, ma <b>quanto sei forte rispetto agli altri</b>.</p>
        <p>Le partite proposte dai giocatori entrano in classifica solo dopo la <b>conferma di un admin</b>, e i punti si calcolano con i rating al momento della conferma. Le partite dei tornei sono partite a tutti gli effetti: muovono l'ELO come le altre.</p>
      </div>

      <div class="info-card">
        <h3>QUANTO VALE UNA VITTORIA</h3>
        <p>Dipende da tre cose.</p>
        <p><b>1. Chi hai battuto.</b> Prima della partita il sistema calcola la probabilità di vittoria dal divario di rating:</p>
        <div class="formula">attesa = 1 / (1 + 10^((eloAvv − eloTuo) / 400))</div>
        <p>Battere un avversario molto più forte vale tanto, battere l'ultimo in classifica vale poco. Perdere da favorito costa caro, perdere da sfavorito costa quasi niente.</p>
        <p><b>2. Il punteggio.</b> Il delta viene moltiplicato per un fattore che cresce col divario di gol:</p>
        <div class="formula">mov = ln(diffGol + 1) × 2.2 / (diffElo × 0.001 + 2.2)</div>
        <p>Un 10-9 vale circa <b>0.7×</b> il valore base, un 10-0 circa <b>2.4×</b>. La seconda parte della formula smorza i cappotti del favorito e amplifica quelli dello sfavorito, così i più forti non gonfiano il rating massacrando gli ultimi.</p>
        <p>Se il punteggio non ve lo ricordate, si può registrare solo chi ha vinto: la partita vale <b>0.5×</b>, meno di una vittoria di misura, perché senza il punteggio il sistema ha meno informazione ed è prudente.</p>
        <p><b>3. Il tuo compagno</b> (solo 2v2, vedi sotto).</p>
        <p>Al delta finale si applicano poi bonus e malus: vedi la tabella qui sotto.</p>
      </div>

      <div class="info-card">
        <h3>BONUS E MALUS: TUTTI I MOLTIPLICATORI</h3>
        <p>Oltre al punteggio, il delta di ogni partita viene moltiplicato da questi fattori:</p>
        <table class="example-table">
          <tr><td>⭐ Partita consigliata del giorno</td><td class="pos">×1.4</td></tr>
          <tr><td>⭐ Tavolo consigliato da "Chi c'è oggi"</td><td class="pos">×1.25</td></tr>
          <tr><td>Partita senza punteggio (solo chi ha vinto)</td><td class="neg">×0.5</td></tr>
          <tr><td>Dalla 3ª partita dello stesso giorno tra le stesse squadre</td><td class="neg">×0.5</td></tr>
        </table>
        <p style="margin-top:8px">Le <b>partite consigliate</b> sono 2v2 suggeriti nella scheda Partita tra chi sta giocando in questo periodo: <b>coppie mescolate e sfide mai giocate</b>, perché l'ELO diventa più preciso quando tutti giocano con e contro tutti, mentre le coppie fisse rendono i rating confrontabili solo tra loro. Chi non gioca da più di due mesi non viene proposto, e l'algoritmo rispetta i ruoli: <b>mai due attaccanti nella stessa coppia</b>, con preferenza per attaccante+difensore.</p>
        <p>I bonus ⭐ valgono solo giocando la <b>formazione esatta</b> accettata con "Usa": cambi anche un solo giocatore e il bonus decade. Da 8 presenti in su l'app propone <b>due tavoli con persone distinte</b>: il <b>Tavolo 1</b>, la partita con più senso tra i presenti, vale <b>sempre ×1.25</b>; il Tavolo 2 solo se porta incroci o coppie mai viste. Sotto gli 8 presenti, il tavolo singolo prende il bonus solo se porta qualcosa di nuovo.</p>
        <p>I fattori si <b>moltiplicano tra loro</b>: una consigliata vinta 10-0 vale 2.4 × 1.4 ≈ <b>3.4 volte</b> una vittoria base, mentre la quinta rivincita della serata contro la stessa coppia, per giunta senza punteggio, vale 0.5 × 0.5 = <b>un quarto</b>. Il perché è sempre lo stesso: il sistema premia le partite che gli dicono qualcosa di nuovo e sconta quelle che ripetono informazione già nota.</p>
      </div>

      <div class="info-card">
        <h3>IL 2v2, IL COMPAGNO E LA COPPIA SBILANCIATA</h3>
        <p>Il rating di squadra parte dalla <b>media</b> dei due giocatori, ma una coppia sbilanciata vale meno della sua media: al balilla l'anello debole pesa più di quanto il forte possa compensare. Quindi:</p>
        <div class="formula">ratingSquadra = media − 0.25 × |elo1 − elo2|</div>
        <p>Una coppia 1300+700 non vale 1000 ma <b>850</b>: parte sfavorita contro due da 1000. Questo protegge il giocatore forte con un compagno molto scarso: se perdete, la sconfitta era già messa in conto e i punti persi sono pochi. Se vincete, valgono di più.</p>
        <p>Il bottino viene poi diviso in base ai rating individuali: se vinci, <b>il più debole della coppia prende la fetta più grande</b> (ha sovraperformato). Se perdete, <b>il più forte perde di più</b>, ma su un totale già ridotto dallo sbilanciamento.</p>
      </div>

      <div class="info-card">
        <h3>ESEMPIO CONCRETO</h3>
        <p>Marco (1100) e Luca (900) battono 10-3 una coppia da 1000 e 1000. La media sarebbe pari, ma con la correzione la coppia vale 950 e parte sfavorita (43%). Vittoria larga da sfavoriti: montepremi di circa 78 punti.</p>
        <table class="example-table">
          <tr><td>Luca (900, il più debole)</td><td class="pos">+43</td></tr>
          <tr><td>Marco (1100, il più forte)</td><td class="pos">+35</td></tr>
          <tr><td>Avversario 1 (1000)</td><td class="neg">−39</td></tr>
          <tr><td>Avversario 2 (1000)</td><td class="neg">−39</td></tr>
        </table>
        <p style="margin-top:8px">Stessa partita finita 10-9: montepremi di circa 26 punti. E se Marco e Luca avessero perso, avrebbero pagato poco: partivano sfavoriti.</p>
      </div>

      <div class="info-card">
        <h3>LE STAGIONI</h3>
        <p>Quando l'admin chiude una stagione, la classifica finale viene <b>archiviata nell'albo d'oro</b> e si riparte <b>a scaglioni</b>: chi ha chiuso in alto conserva un vantaggio compresso, così il sistema ricorda chi è più forte e non gli regala punti facili contro chi è ripartito da meno.</p>
        <div class="formula">1250+ → 1150 · 1150+ → 1100 · 1050+ → 1050<br>950+ → 1000 · 850+ → 950 · 750+ → 900 · sotto → 850</div>
        <p>Le stagioni si possono <b>pianificare in anticipo</b>: alla chiusura di quella in corso, parte automaticamente la prossima in coda. Ogni stagione è un campionato a sé: vincerla conta più del rating assoluto.</p>
      </div>

      <div class="info-card">
        <h3>CHI ENTRA IN CLASSIFICA</h3>
        <p>Per comparire in classifica servono, nella stagione: <b>10 partite</b>, <b>6 avversari diversi</b> e <b>3 compagni diversi</b>. Chi non ci arriva è tra i "non classificati" con un ELO provvisorio: poche partite, o sempre contro le stesse persone, producono un rating non confrontabile con gli altri.</p>
      </div>

      <div class="info-card">
        <h3>IN PRATICA</h3>
        <p>Vuoi salire in fretta? Sfida chi sta sopra di te, gioca in coppia col più scarso e vinci largo. Vuoi difendere il primo posto? Non ti conviene nasconderti: contro i deboli hai poco da guadagnare e tanto da perdere.</p>
      </div>`;
    return;
  }

  // ---------- GIOCATORI ----------
  if (tab === "rosa") {
    const rows = players.map((p) => {
      const role = roleOf(p);
      const roleUI = isAdmin()
        ? `<select class="role-select" data-roleplayer="${p.id}">
            ${["difensore", "attaccante", "ibrido"].map((r) =>
              `<option value="${r}" ${r === role ? "selected" : ""}>${ROLE_LABEL[r]}</option>`).join("")}
          </select>`
        : `<span class="meta" style="margin-top:0;white-space:nowrap">${ROLE_LABEL[role]}</span>`;
      return `<div class="row">
        <div style="flex:1;min-width:0">
          <div class="player-name">${esc(p.name)}</div>
          <div class="meta">ELO ${p.elo} · ${p.wins}V–${p.losses}S</div>
        </div>
        ${roleUI}
        ${isAdmin() ? `<button class="edit-btn" data-rename="${p.id}" title="Rinomina">✏️</button>` : ""}
      </div>`;
    }).join("");

    const addForm = isAdmin()
      ? `<div class="add-row">
          <input id="new-name" placeholder="Nome giocatore" maxlength="30">
          <button id="add-player">Aggiungi</button>
        </div>`
      : "";

    const authBox = isAdmin()
      ? `<div class="auth-box">
          <div class="meta" style="margin-bottom:8px">Admin: ${esc(state.session.user.email)}</div>
          <button class="undo" id="logout" style="margin-bottom:0">Esci</button>
        </div>`
      : `<div class="auth-box">
          <div class="meta" style="margin-bottom:8px">Accesso admin</div>
          <input id="login-email" type="email" placeholder="Email" autocomplete="username">
          <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
          <button class="cta" id="login" style="font-size:14px;padding:11px 0">Accedi</button>
        </div>`;

    app.innerHTML = `
      ${addForm}
      ${rows || `<div class="empty">Nessun giocatore in rosa.</div>`}
      ${authBox}
      <div class="foot-note">Chiunque può vedere tutto e proporre partite; solo gli admin confermano, gestiscono rosa, stagioni e tornei.</div>`;
  }
}

// ---------- Realtime ----------
let rtTimer;
function subscribeRealtime() {
  sb.channel("db-changes")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(rtTimer);
      rtTimer = setTimeout(async () => {
        if (state.busy) return;
        await loadAll();
        render();
      }, 500);
    })
    .subscribe();
}

// ---------- Eventi ----------
async function withBusy(fn) {
  if (state.busy) return;
  state.busy = true;
  render();
  await fn();
  await loadAll();
  state.busy = false;
  render();
}

document.addEventListener("click", async (e) => {
  const t = e.target;

  if (t.dataset.tab) {
    state.tab = t.dataset.tab;
    state.profileId = null;
    await loadAll();
    render();
    return;
  }
  if (t.id === "profile-back") {
    state.profileId = null;
    render();
    return;
  }
  const profEl = e.target.closest?.("[data-profile]");
  if (profEl && !e.target.closest("button")) {
    state.profileId = profEl.dataset.profile;
    render();
    return;
  }
  if (t.dataset.tformat) {
    state.tFormat = t.dataset.tformat;
    render();
    return;
  }
  if (t.dataset.histseason) {
    state.historySeason = t.dataset.histseason;
    render();
    return;
  }
  if (t.dataset.mode) {
    state.mode = t.dataset.mode;
    state.teamA = ["", ""];
    state.teamB = ["", ""];
    render();
    return;
  }
  if (t.dataset.scoremode) {
    state.noScore = t.dataset.scoremode === "noscore";
    state.winnerSide = null;
    render();
    return;
  }
  if (t.dataset.winner) {
    state.winnerSide = t.dataset.winner;
    render();
    return;
  }
  if (t.dataset.present) {
    const id = t.dataset.present;
    const idx = state.present.indexOf(id);
    if (idx >= 0) state.present.splice(idx, 1); else state.present.push(id);
    render();
    return;
  }
  if (t.dataset.score) {
    const key = t.dataset.score === "A" ? "scoreA" : "scoreB";
    state[key] = Math.max(0, state[key] + Number(t.dataset.dir));
    render();
    return;
  }
  if (t.dataset.suggest) {
    const [a1, a2, b1, b2] = t.dataset.suggest.split("|");
    state.mode = "2v2";
    state.noScore = false;
    state.winnerSide = null;
    state.teamA = [a1, a2];
    state.teamB = [b1, b2];
    const bv = parseFloat(t.dataset.boostval ?? "1");
    if (bv > 1) {
      state.suggestedList = state.suggestedList.filter((s) =>
        !((teamSetEq(s.a, [a1, a2]) && teamSetEq(s.b, [b1, b2])) ||
          (teamSetEq(s.a, [b1, b2]) && teamSetEq(s.b, [a1, a2]))));
      state.suggestedList.push({ a: [a1, a2], b: [b1, b2], boost: bv });
    }
    state.scoreA = 0;
    state.scoreB = 0;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (t.id === "save-match") return withBusy(recordMatch);
  if (t.dataset.confirm) return withBusy(() => confirmMatch(t.dataset.confirm));
  if (t.dataset.reject) {
    if (!confirm("Rifiutare questa partita? Verrà eliminata.")) return;
    return withBusy(() => rejectMatch(t.dataset.reject));
  }
  if (t.id === "undo") {
    if (!confirm("Annullare l'ultima partita confermata?")) return;
    return withBusy(undoLast);
  }
  if (t.id === "create-season") {
    const name = document.getElementById("new-season-name").value.trim();
    if (!name) { toast("Dai un nome alla stagione", false); return; }
    return withBusy(() => createSeason(name));
  }
  if (t.id === "close-season") {
    const s = activeSeason();
    if (!s) return;
    const next = plannedSeasons().sort((a, b) => new Date(a.created_at) - new Date(b.created_at))[0];
    const pendCount = state.pending.filter((m) => m.season_id === s.id).length;
    const warn = pendCount ? `\n\nAttenzione: ${pendCount} partite in attesa resteranno non conteggiate.` : "";
    const after = next ? `Partirà subito "${next.name}".` : "Non partirà nessuna stagione finché non ne crei una.";
    if (!confirm(`Chiudere "${s.name}"?\nLa classifica va nell'albo d'oro e si riparte a scaglioni in base al rating finale.\n${after}${warn}`)) return;
    return withBusy(closeSeason);
  }
  if (t.dataset.renameseason) {
    const s = seasonById(t.dataset.renameseason);
    if (!s) return;
    const newName = prompt(`Nuovo nome per "${s.name}":`, s.name);
    if (newName == null) return;
    const clean = newName.trim().slice(0, 40);
    if (!clean || clean === s.name) return;
    return withBusy(() => renameSeason(s.id, clean));
  }
  if (t.dataset.delseason) {
    const s = seasonById(t.dataset.delseason);
    if (!s || s.active || s.ended_at) return;
    if (!confirm(`Eliminare la stagione pianificata "${s.name}"?`)) return;
    return withBusy(() => deletePlannedSeason(s.id));
  }
  if (t.id === "t-addpair") {
    state.tPairs.push(["", ""]);
    render();
    return;
  }
  if (t.dataset.tremovepair != null) {
    state.tPairs.splice(Number(t.dataset.tremovepair), 1);
    render();
    return;
  }
  if (t.id === "create-tournament") {
    return withBusy(createTournament);
  }
  if (t.dataset.trecord) {
    const [tid, r, i] = t.dataset.trecord.split("|");
    const sa = parseInt(document.getElementById(`ts-${tid}-${r}-${i}-a`)?.value, 10);
    const sbv = parseInt(document.getElementById(`ts-${tid}-${r}-${i}-b`)?.value, 10);
    if (Number.isNaN(sa) || Number.isNaN(sbv)) { toast("Inserisci entrambi i punteggi", false); return; }
    return withBusy(() => recordTournamentMatch(tid, Number(r), Number(i), sa, sbv));
  }
  if (t.dataset.rename) {
    const p = byId(t.dataset.rename);
    if (!p) return;
    const newName = prompt(`Nuovo nome per "${p.name}":`, p.name);
    if (newName == null) return;
    const clean = newName.trim().slice(0, 30);
    if (!clean || clean === p.name) return;
    return withBusy(() => renamePlayer(p.id, clean));
  }
  if (t.id === "add-player") {
    const name = document.getElementById("new-name").value.trim();
    if (!name) return;
    return withBusy(() => addPlayer(name));
  }
  if (t.id === "login") {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-pass").value;
    if (!email || !password) return;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { toast("Credenziali non valide", false); return; }
    toast("Accesso effettuato");
    return;
  }
  if (t.id === "logout") {
    await sb.auth.signOut();
    toast("Sei uscito");
    return;
  }
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.team) {
    const team = t.dataset.team === "red" ? state.teamA : state.teamB;
    team[Number(t.dataset.slot)] = t.value;
    render();
    return;
  }
  if (t.dataset.tpair != null) {
    state.tPairs[Number(t.dataset.tpair)][Number(t.dataset.tslot)] = t.value;
    render();
    return;
  }
  if (t.dataset.roleplayer) {
    withBusy(() => setRole(t.dataset.roleplayer, t.value));
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "t-name") state.tName = e.target.value;
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "new-name") document.getElementById("add-player")?.click();
  if (e.target.id === "login-email" || e.target.id === "login-pass") document.getElementById("login")?.click();
  if (e.target.id === "new-season-name") document.getElementById("create-season")?.click();
});

// ---------- Avvio ----------
const { data: sessionData } = await sb.auth.getSession();
state.session = sessionData.session;
sb.auth.onAuthStateChange((_event, session) => {
  state.session = session;
  render();
});

await loadAll();
render();
subscribeRealtime();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
