<body>
<div class="container">

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ============================================================
// CONFIGURAZIONE
// ============================================================
const SUPABASE_URL = "https://gtxeacrydiullkyqanpu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_G7n7aUW5IhECINFT3T2ybw_JrquwZq7";
// ============================================================

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- ELO ----------
const K = 32;
const HANDICAP = 0.25;     // quanto pesa lo sbilanciamento interno della coppia
const NO_SCORE_BASE = 0.5; // valore di una partita senza punteggio (10-9 ≈ 0.7)

const expectedScore = (ra, rb) => 1 / (1 + Math.pow(10, (rb - ra) / 400));

const movMultiplier = (goalDiff, winnerElo, loserElo) =>
  Math.log(goalDiff + 1) * (2.2 / ((winnerElo - loserElo) * 0.001 + 2.2));

function teamRating(ids) {
  if (ids.length === 1) return byId(ids[0]).elo;
  const [r1, r2] = ids.map((id) => byId(id).elo);
  return (r1 + r2) / 2 - HANDICAP * Math.abs(r1 - r2);
}

function computeMatch(idsA, idsB, scoreA, scoreB, winnerSide) {
  const size = idsA.length;
  const ratingA = teamRating(idsA);
  const ratingB = teamRating(idsB);
  const noScore = scoreA == null || scoreB == null;
  const aWins = noScore ? winnerSide === "A" : scoreA > scoreB;

  const winnerElo = aWins ? ratingA : ratingB;
  const loserElo = aWins ? ratingB : ratingA;
  const mov = noScore
    ? NO_SCORE_BASE * (2.2 / ((winnerElo - loserElo) * 0.001 + 2.2))
    : movMultiplier(Math.abs(scoreA - scoreB), winnerElo, loserElo);

  const expA = expectedScore(ratingA, ratingB);
  const totalA = K * mov * ((aWins ? 1 : 0) - expA) * size;

  const deltas = {};
  const assign = (ids, total, winning) => {
    if (ids.length === 1) { deltas[ids[0]] = Math.round(total); return; }
    const [i, j] = ids;
    const ri = byId(i).elo, rj = byId(j).elo;
    const shareI = winning ? rj / (ri + rj) : ri / (ri + rj);
    deltas[i] = Math.round(total * shareI);
    deltas[j] = Math.round(total * (1 - shareI));
  };
  assign(idsA, totalA, aWins);
  assign(idsB, -totalA, !aWins);

  const winners = aWins ? idsA : idsB;
  const pre = {};
  [...idsA, ...idsB].forEach((id) => (pre[id] = byId(id).elo));

  return { deltas, winners, pre };
}

// ---------- Tornei: tabellone ----------
function bracketOrder(size) {
  let arr = [0];
  while (arr.length < size) {
    const m = arr.length * 2;
    const next = [];
    for (const x of arr) { next.push(x); next.push(m - 1 - x); }
    arr = next;
  }
  return arr;
}

function advance(rounds, r, i, teamIdx) {
  if (r + 1 >= rounds.length) return;
  const nm = rounds[r + 1][Math.floor(i / 2)];
  if (i % 2 === 0) nm.a = teamIdx; else nm.b = teamIdx;
}

function buildBracket(teamCount) {
  let size = 1;
  while (size < teamCount) size *= 2;
  const slots = bracketOrder(size).map((s) => (s < teamCount ? s : null));
  const rounds = [];
  const first = [];
  for (let i = 0; i < slots.length; i += 2)
    first.push({ a: slots[i], b: slots[i + 1], winner: null, score: null });
  rounds.push(first);
  let n = first.length;
  while (n > 1) {
    n = Math.floor(n / 2);
    rounds.push(Array.from({ length: n }, () => ({ a: null, b: null, winner: null, score: null })));
  }
  // bye del primo turno: passa il turno automaticamente
  rounds[0].forEach((m, i) => {
    if (m.a != null && m.b == null) { m.winner = m.a; advance(rounds, 0, i, m.a); }
    else if (m.b != null && m.a == null) { m.winner = m.b; advance(rounds, 0, i, m.b); }
  });
  return rounds;
}

const ROUND_NAMES = ["FINALE", "SEMIFINALI", "QUARTI", "OTTAVI", "SEDICESIMI"];
const roundName = (r, total) => ROUND_NAMES[total - 1 - r] ?? `TURNO ${r + 1}`;

// ---------- Stato ----------
const state = {
  players: [],
  seasons: [],
  results: {},        // season_id -> righe season_results ordinate per rank
  matches: [],        // confermate, ultime 200
  pending: [],
  tournaments: [],
  tab: "classifica",
  historySeason: "all",
  tPairs: [["", ""], ["", ""]],
  tName: "",
  mode: "1v1",
  noScore: false,
  winnerSide: null,
  teamA: ["", ""],
  teamB: ["", ""],
  scoreA: 0,
  scoreB: 0,
  busy: false,
  session: null,
};

const isAdmin = () => !!state.session;
const activeSeason = () => state.seasons.find((s) => s.active) ?? null;
const plannedSeasons = () => state.seasons.filter((s) => !s.active && !s.ended_at);
const closedSeasons = () => state.seasons.filter((s) => !s.active && s.ended_at);

const TABS = [
  ["classifica", "Classifica"],
  ["partita", "Partita"],
  ["storico", "Storico"],
  ["tornei", "Tornei"],
  ["stagioni", "Stagioni"],
  ["rosa", "Giocatori"],
  ["elo", "ELO"],
];

const esc = (s) =>
  String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const byId = (id) => state.players.find((p) => p.id === id);
const nameOf = (id) => byId(id)?.name ?? "?";
const seasonById = (id) => state.seasons.find((s) => s.id === id);
const seasonName = (id) => seasonById(id)?.name ?? "?";
const fmtDate = (iso, withTime = true) =>
  new Date(iso).toLocaleDateString("it-IT", {
    day: "numeric", month: "short",
    ...(withTime ? { hour: "2-digit", minute: "2-digit" } : { year: "numeric" }),
  });

// ---------- Dati ----------
async function loadAll() {
  const [pRes, sRes, rRes, mRes, pendRes, tRes] = await Promise.all([
    sb.from("players").select("*").order("elo", { ascending: false }),
    sb.from("seasons").select("*").order("created_at", { ascending: false }),
    sb.from("season_results").select("*").order("rank", { ascending: true }),
    sb.from("matches").select("*").eq("status", "confirmed")
      .order("confirmed_at", { ascending: false }).limit(200),
    sb.from("matches").select("*").eq("status", "pending")
      .order("created_at", { ascending: true }),
    sb.from("tournaments").select("*").order("created_at", { ascending: false }),
  ]);
  if (pRes.error || sRes.error || rRes.error || mRes.error || pendRes.error || tRes.error) {
    toast("Errore di connessione: controlla configurazione e script SQL", false);
    return;
  }
  state.players = pRes.data;
  state.seasons = sRes.data;
  state.matches = mRes.data;
  state.pending = pendRes.data;
  state.tournaments = tRes.data;

  state.results = {};
  for (const r of rRes.data) (state.results[r.season_id] ??= []).push(r);

  if (state.historySeason !== "all" && !state.seasons.some((s) => s.id === state.historySeason))
    state.historySeason = "all";
}

async function addPlayer(name) {
  const { error } = await sb.from("players").insert({ name });
  if (error) {
    toast(error.code === "23505" ? "Giocatore già presente" : "Errore di salvataggio", false);
    return false;
  }
  toast(`${name} aggiunto alla rosa`);
  return true;
}

async function renamePlayer(id, newName) {
  const { error } = await sb.from("players").update({ name: newName }).eq("id", id);
  if (error) {
    toast(error.code === "23505" ? "Esiste già un giocatore con questo nome" : "Errore di salvataggio", false);
    return;
  }
  // aggiorna anche l'albo d'oro
  await sb.from("season_results").update({ name: newName }).eq("player_id", id);
  toast("Nome aggiornato");
}

async function applyDeltas(deltas, winners, sign = 1) {
  const updates = Object.keys(deltas).map((id) => {
    const p = byId(id);
    if (!p) return Promise.resolve({});
    const won = winners.includes(id);
    return sb.from("players").update({
      elo: p.elo + sign * deltas[id],
      wins: p.wins + sign * (won ? 1 : 0),
      losses: p.losses + sign * (won ? 0 : 1),
    }).eq("id", id);
  });
  const results = await Promise.all(updates);
  return !results.some((r) => r.error);
}

// crea una partita confermata (usata dal form e dai tornei)
async function insertConfirmedMatch(idsA, idsB, scoreA, scoreB, winnerSide, seasonId) {
  const { deltas, winners, pre } = computeMatch(idsA, idsB, scoreA, scoreB, winnerSide);
  const ok = await applyDeltas(deltas, winners);
  const ins = await sb.from("matches").insert({
    mode: idsA.length === 1 ? "1v1" : "2v2",
    team_a: idsA, team_b: idsB,
    score_a: scoreA, score_b: scoreB,
    winner_side: winnerSide,
    season_id: seasonId,
    deltas, pre, winners,
    status: "confirmed",
    confirmed_at: new Date().toISOString(),
  });
  return ok && !ins.error;
}

async function recordMatch() {
  const season = activeSeason();
  if (!season) { toast("Nessuna stagione attiva", false); return; }
  const size = state.mode === "1v1" ? 1 : 2;
  const idsA = state.teamA.slice(0, size);
  const idsB = state.teamB.slice(0, size);
  const noScore = state.noScore;
  const sa = noScore ? null : state.scoreA;
  const sbv = noScore ? null : state.scoreB;
  const ws = noScore ? state.winnerSide : null;

  if (isAdmin()) {
    const ok = await insertConfirmedMatch(idsA, idsB, sa, sbv, ws, season.id);
    if (!ok) { toast("Errore di salvataggio, ricarica la pagina", false); return; }
    toast("Partita registrata");
    state.tab = "classifica";
  } else {
    const ins = await sb.from("matches").insert({
      mode: state.mode,
      team_a: idsA, team_b: idsB,
      score_a: sa, score_b: sbv,
      winner_side: ws,
      season_id: season.id,
      status: "pending",
    });
    if (ins.error) { toast("Errore di invio, riprova", false); return; }
    toast("Partita inviata: conterà dopo la conferma di un admin");
    state.tab = "storico";
  }

  state.teamA = ["", ""];
  state.teamB = ["", ""];
  state.scoreA = 0;
  state.scoreB = 0;
  state.winnerSide = null;
}

async function confirmMatch(id) {
  const m = state.pending.find((x) => x.id === id);
  if (!m) return;
  if (!seasonById(m.season_id)?.active) {
    toast("La stagione di questa partita è chiusa: rifiutala", false);
    return;
  }
  const ids = [...m.team_a, ...m.team_b];
  if (ids.some((pid) => !byId(pid))) {
    toast("Giocatore non trovato, impossibile confermare", false);
    return;
  }
  const { deltas, winners, pre } = computeMatch(
    m.team_a, m.team_b, m.score_a, m.score_b, m.winner_side
  );
  const ok = await applyDeltas(deltas, winners);
  const upd = await sb.from("matches").update({
    deltas, pre, winners,
    status: "confirmed",
    confirmed_at: new Date().toISOString(),
  }).eq("id", id);
  if (!ok || upd.error) { toast("Errore nella conferma, ricarica la pagina", false); return; }
  toast("Partita confermata");
}

async function rejectMatch(id) {
  const del = await sb.from("matches").delete().eq("id", id);
  if (del.error) { toast("Errore, riprova", false); return; }
  toast("Partita rifiutata");
}

async function undoLast() {
  const last = state.matches[0];
  if (!last) return;
  // i delta sono interi: sottrarli ripristina esattamente i rating
  const ok = await applyDeltas(last.deltas, last.winners, -1);
  const del = await sb.from("matches").delete().eq("id", last.id);
  if (!ok || del.error) { toast("Errore, ricarica la pagina", false); return; }
  toast("Ultima partita annullata");
}

// ---------- Stagioni ----------
async function createSeason(name) {
  const startNow = !activeSeason();
  const { error } = await sb.from("seasons").insert({ name, active: startNow });
  if (error) { toast("Errore nella creazione", false); return; }
  toast(startNow ? `Stagione "${name}" avviata` : `Stagione "${name}" pianificata`);
}

async function deletePlannedSeason(id) {
  const { error } = await sb.from("seasons").delete().eq("id", id);
  if (error) { toast("Errore nell'eliminazione", false); return; }
  toast("Stagione pianificata eliminata");
}

async function closeSeason() {
  const season = activeSeason();
  if (!season) return;

  // 1) snapshot nell'albo d'oro
  const ranked = [...state.players].sort((a, b) => b.elo - a.elo);
  const rows = ranked.map((p, i) => ({
    season_id: season.id,
    player_id: p.id,
    name: p.name,
    elo: p.elo,
    wins: p.wins,
    losses: p.losses,
    rank: i + 1,
  }));
  const r1 = await sb.from("season_results").insert(rows);
  if (r1.error) { toast("Errore nello snapshot della stagione", false); return; }

  // 2) chiudi la corrente
  const r2 = await sb.from("seasons")
    .update({ active: false, ended_at: new Date().toISOString() })
    .eq("id", season.id);

  // 3) reset del rank
  const r3 = await sb.from("players")
    .update({ elo: 1000, wins: 0, losses: 0 })
    .gte("wins", 0);

  // 4) avvia la pianificata più vecchia, se c'è
  const next = plannedSeasons().sort((a, b) => new Date(a.created_at) - new Date(b.created_at))[0];
  let r4 = { error: null };
  if (next) {
    r4 = await sb.from("seasons")
      .update({ active: true, created_at: new Date().toISOString() })
      .eq("id", next.id);
  }

  if (r2.error || r3.error || r4.error) {
    toast("Errore nella chiusura, controlla il pannello Supabase", false);
    return;
  }
  toast(next ? `Stagione chiusa. Al via "${next.name}"!` : "Stagione chiusa e archiviata");
}

// ---------- Tornei ----------
function pairRating(pair) {
  const [a, b] = pair.map((id) => byId(id).elo);
  return (a + b) / 2 - HANDICAP * Math.abs(a - b);
}

async function createTournament() {
  const season = activeSeason();
  if (!season) { toast("Serve una stagione attiva", false); return; }
  const name = state.tName.trim();
  if (!name) { toast("Dai un nome al torneo", false); return; }
  const pairs = state.tPairs.filter((p) => p[0] && p[1]);
  const flat = pairs.flat();
  if (pairs.length < 2 || pairs.length !== state.tPairs.length) {
    toast("Completa tutte le coppie (minimo 2)", false); return;
  }
  if (new Set(flat).size !== flat.length) {
    toast("Un giocatore è in più coppie", false); return;
  }
  // teste di serie: coppie ordinate per rating
  const sorted = [...pairs].sort((x, y) => pairRating(y) - pairRating(x));
  const teams = sorted.map(([p1, p2]) => ({ p1, p2 }));
  const bracket = buildBracket(teams.length);

  const { error } = await sb.from("tournaments").insert({
    name, season_id: season.id, teams, bracket,
  });
  if (error) { toast("Errore nella creazione del torneo", false); return; }
  state.tName = "";
  state.tPairs = [["", ""], ["", ""]];
  toast(`Torneo "${name}" creato`);
}

async function recordTournamentMatch(tid, r, i, sa, sbv) {
  const t = state.tournaments.find((x) => x.id === tid);
  if (!t || t.status !== "open") return;
  if (!seasonById(t.season_id)?.active) {
    toast("La stagione del torneo è chiusa", false); return;
  }
  const bracket = t.bracket;
  const m = bracket[r]?.[i];
  if (!m || m.a == null || m.b == null || m.winner != null) return;
  if (!Number.isInteger(sa) || !Number.isInteger(sbv) || sa < 0 || sbv < 0 || sa === sbv) {
    toast("Punteggio non valido", false); return;
  }
  const tA = t.teams[m.a], tB = t.teams[m.b];
  const idsA = [tA.p1, tA.p2], idsB = [tB.p1, tB.p2];
  if ([...idsA, ...idsB].some((id) => !byId(id))) {
    toast("Giocatore non trovato", false); return;
  }

  const ok = await insertConfirmedMatch(idsA, idsB, sa, sbv, null, t.season_id);
  if (!ok) { toast("Errore nel salvataggio della partita", false); return; }

  m.winner = sa > sbv ? m.a : m.b;
  m.score = [sa, sbv];
  advance(bracket, r, i, m.winner);
  const finale = bracket[bracket.length - 1][0];
  const status = finale.winner != null ? "done" : "open";

  const upd = await sb.from("tournaments").update({ bracket, status }).eq("id", tid);
  if (upd.error) { toast("Partita salvata ma tabellone non aggiornato: ricarica", false); return; }
  toast(status === "done"
    ? `Torneo concluso! Vince ${teamLabel(t, m.winner)} 🏆`
    : "Risultato registrato");
}

const teamLabel = (t, idx) =>
  idx == null ? "—" : `${nameOf(t.teams[idx].p1)} + ${nameOf(t.teams[idx].p2)}`;

// ---------- Partite consigliate ----------
function suggestedMatches() {
  const faced = new Set();
  const games = {};
  for (const m of state.matches) {
    for (const id of [...m.team_a, ...m.team_b]) games[id] = (games[id] ?? 0) + 1;
    for (const a of m.team_a) for (const b of m.team_b)
      faced.add(a < b ? a + "|" + b : b + "|" + a);
  }
  const out = [];
  const ps = state.players;
  for (let i = 0; i < ps.length; i++) {
    for (let j = i + 1; j < ps.length; j++) {
      const a = ps[i], b = ps[j];
      const key = a.id < b.id ? a.id + "|" + b.id : b.id + "|" + a.id;
      if (faced.has(key)) continue;
      const g = (games[a.id] ?? 0) + (games[b.id] ?? 0);
      const gap = Math.abs(a.elo - b.elo);
      // priorità: pochi precedenti in assoluto, poi rating vicini
      out.push({ a, b, score: g * 25 + gap });
    }
  }
  out.sort((x, y) => x.score - y.score);
  return out.slice(0, 3);
}

// ---------- UI ----------
let toastTimer;
function toast(text, ok = true) {
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="toast ${ok ? "ok" : "err"}">${esc(text)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.innerHTML = ""), 3500);
}

function renderNav() {
  document.getElementById("nav").innerHTML = TABS.map(([key, label]) => {
    const badge = key === "storico" && state.pending.length && isAdmin()
      ? `<span class="badge">${state.pending.length}</span>` : "";
    return `<button data-tab="${key}" class="${state.tab === key ? "active" : ""}">${label}${badge}</button>`;
  }).join("");
  document.getElementById("season-eyebrow").textContent =
    activeSeason()?.name.toUpperCase() ?? "TRA AMICI";
}

function formOf(pid, seasonId = null) {
  return state.matches
    .filter((m) =>
      (seasonId == null || m.season_id === seasonId) &&
      (m.team_a.includes(pid) || m.team_b.includes(pid)))
    .slice(0, 5)
    .map((m) => m.winners.includes(pid));
}

function streakOf(form) {
  if (form.length < 2) return "";
  let n = 1;
  while (n < form.length && form[n] === form[0]) n++;
  if (n < 2) return "";
  return `<span class="streak">${n}${form[0] ? "V" : "S"} di fila</span>`;
}

function matchRowHTML(m, { pending = false, actions = false, showSeason = false } = {}) {
  const noScore = m.score_a == null || m.score_b == null;
  const aWon = noScore ? m.winner_side === "A" : m.score_a > m.score_b;
  const deltaStr = !pending && m.deltas
    ? [...m.team_a, ...m.team_b]
        .map((id) => `${esc(nameOf(id))} ${m.deltas[id] >= 0 ? "+" : ""}${m.deltas[id]}`)
        .join(" · ")
    : "in attesa di conferma";
  const btns = actions
    ? `<div class="confirm-actions">
        <button class="btn-confirm" data-confirm="${m.id}">Conferma</button>
        <button class="btn-reject" data-reject="${m.id}">Rifiuta</button>
      </div>` : "";
  const scoreHTML = noScore
    ? `<span class="${aWon ? "win" : ""}">${aWon ? "V" : "S"}</span>
       <span style="opacity:0.5"> – </span>
       <span class="${!aWon ? "win" : ""}">${!aWon ? "V" : "S"}</span>`
    : `<span class="${aWon ? "win" : ""}">${m.score_a}</span>
       <span style="opacity:0.5"> – </span>
       <span class="${!aWon ? "win" : ""}">${m.score_b}</span>`;
  const seasonTag = showSeason ? ` · ${esc(seasonName(m.season_id))}` : "";
  return `<div class="match-row ${pending ? "pending" : ""}">
    <div style="flex:1">
      <span class="team-a">${m.team_a.map((id) => esc(nameOf(id))).join(" + ")}</span>
      <span style="opacity:0.7"> vs </span>
      <span class="team-b">${m.team_b.map((id) => esc(nameOf(id))).join(" + ")}</span>
      <div class="meta">${fmtDate(m.created_at)} · ${m.mode}${noScore ? " · senza punteggio" : ""}${seasonTag}</div>
      <div class="meta">${deltaStr}</div>
      ${btns}
    </div>
    <div class="match-score">${scoreHTML}</div>
  </div>`;
}

function render() {
  renderNav();
  const app = document.getElementById("app");
  const { players, matches, pending, tab } = state;
  const season = activeSeason();

  // ---------- CLASSIFICA ----------
  if (tab === "classifica") {
    if (players.length === 0) {
      app.innerHTML = `<div class="empty">Nessun giocatore in rosa. Aggiungi i primi nella scheda Giocatori.</div>`;
      return;
    }
    const ranked = [...players].sort((a, b) => b.elo - a.elo);
    app.innerHTML = ranked.map((p, i) => {
      const tot = p.wins + p.losses;
      const pct = tot ? Math.round((p.wins / tot) * 100) : 0;
      const form = formOf(p.id, season?.id ?? null);
      const dots = form.map((w) => `<span class="dot ${w ? "w" : "l"}"></span>`).join("");
      const streak = streakOf(form);
      return `<div class="row ${i === 0 ? "first" : ""}">
        <div class="rank ${i === 0 ? "gold" : ""}">${i + 1}</div>
        <div style="flex:1">
          <div class="player-name">${esc(p.name)}</div>
          <div class="meta">${p.wins}V – ${p.losses}S${tot ? ` · ${pct}%` : ""}${streak ? " · " + streak : ""}</div>
          ${form.length ? `<div style="margin-top:4px">${dots}</div>` : ""}
        </div>
        <div class="elo">${p.elo}</div>
      </div>`;
    }).join("");
    return;
  }

  // ---------- PARTITA ----------
  if (tab === "partita") {
    if (!season) {
      app.innerHTML = `<div class="empty">Nessuna stagione attiva: ${isAdmin() ? "creane una dalla scheda Stagioni." : "chiedi a un admin di aprirne una."}</div>`;
      return;
    }
    if (players.length < 2) {
      app.innerHTML = `<div class="empty">Servono almeno 2 giocatori in rosa.</div>`;
      return;
    }
    const size = state.mode === "1v1" ? 1 : 2;
    const selected = [...state.teamA.slice(0, size), ...state.teamB.slice(0, size)].filter(Boolean);
    const playersOk =
      selected.length === size * 2 && new Set(selected).size === size * 2;
    const valid = playersOk &&
      (state.noScore ? !!state.winnerSide : state.scoreA !== state.scoreB);

    const teamCard = (team, cls, label, score, side) => {
      const taken = new Set([...state.teamA, ...state.teamB].filter(Boolean));
      const selects = Array.from({ length: size }).map((_, i) => {
        const opts = players.map((p) => {
          const dis = taken.has(p.id) && team[i] !== p.id ? "disabled" : "";
          const sel = team[i] === p.id ? "selected" : "";
          return `<option value="${p.id}" ${dis} ${sel}>${esc(p.name)} (${p.elo})</option>`;
        }).join("");
        return `<select data-team="${cls}" data-slot="${i}">
          <option value="">— giocatore —</option>${opts}
        </select>`;
      }).join("");
      const resultCtrl = state.noScore
        ? `<button class="win-btn ${state.winnerSide === side ? "active" : ""}" data-winner="${side}">
            ${state.winnerSide === side ? "🏆 VITTORIA" : "Vittoria"}
          </button>`
        : `<div class="score-ctrl">
            <button data-score="${side}" data-dir="-1">−</button>
            <div class="score-num">${score}</div>
            <button data-score="${side}" data-dir="1">+</button>
          </div>`;
      return `<div class="team-card ${cls}">
        <div class="team-label">${label}</div>
        ${selects}
        ${resultCtrl}
      </div>`;
    };

    let hint;
    if (state.noScore) {
      hint = "Senza punteggio la partita vale circa la metà di una vittoria di misura.";
    } else if (state.scoreA === state.scoreB && playersOk) {
      hint = "Il pareggio non esiste al balilla: si gioca la palla decisiva.";
    } else if (isAdmin()) {
      hint = "Il divario di gol pesa sul delta: un 10-0 vale molto più di un 10-9.";
    } else {
      hint = "La partita verrà conteggiata dopo la conferma di un admin.";
    }

    const sugg = suggestedMatches();
    const suggHTML = sugg.length
      ? `<div class="section-label" style="margin-top:26px">PARTITE CONSIGLIATE</div>
         <div class="meta" style="margin-bottom:8px">Sfide mai giocate: aiutano a calcolare meglio i rank.</div>` +
        sugg.map(({ a, b }) =>
          `<div class="row">
            <div style="flex:1">
              <div class="player-name" style="font-size:14px">${esc(a.name)} <span style="opacity:0.6">vs</span> ${esc(b.name)}</div>
              <div class="meta">${a.elo} vs ${b.elo} · mai affrontati</div>
            </div>
            <button class="use-btn" data-suggest="${a.id}|${b.id}">Usa</button>
          </div>`).join("")
      : "";

    app.innerHTML = `
      <div class="mode-row">
        <button data-mode="1v1" class="${state.mode === "1v1" ? "active" : ""}">1v1</button>
        <button data-mode="2v2" class="${state.mode === "2v2" ? "active" : ""}">2v2</button>
      </div>
      <div class="mode-row" style="margin-top:-10px">
        <button data-scoremode="score" class="${!state.noScore ? "active" : ""}" style="font-size:12px">Con punteggio</button>
        <button data-scoremode="noscore" class="${state.noScore ? "active" : ""}" style="font-size:12px">Solo chi ha vinto</button>
      </div>
      <div class="teams">
        ${teamCard(state.teamA, "red", "ROSSI", state.scoreA, "A")}
        <div class="vs">VS</div>
        ${teamCard(state.teamB, "blue", "BLU", state.scoreB, "B")}
      </div>
      <div class="hint">${hint}</div>
      <button class="cta" id="save-match" ${valid && !state.busy ? "" : "disabled"}>
        ${isAdmin() ? "Registra partita" : "Invia partita"}
      </button>
      ${suggHTML}`;
    return;
  }

  // ---------- STORICO ----------
  if (tab === "storico") {
    const filterRow = state.seasons.length > 1
      ? `<div class="view-row">
          <button data-histseason="all" class="${state.historySeason === "all" ? "active" : ""}">Tutte</button>
          ${state.seasons.filter((s) => s.active || s.ended_at).map((s) =>
            `<button data-histseason="${s.id}" class="${state.historySeason === s.id ? "active" : ""}">${esc(s.name)}${s.active ? "" : " 🔒"}</button>`
          ).join("")}
        </div>`
      : "";

    const inFilter = (m) => state.historySeason === "all" || m.season_id === state.historySeason;
    const pend = pending.filter(inFilter);
    const conf = matches.filter(inFilter);
    const showSeason = state.historySeason === "all" && state.seasons.length > 1;

    if (!pend.length && !conf.length) {
      app.innerHTML = `${filterRow}<div class="empty">Nessuna partita qui.</div>`;
      return;
    }
    let html = filterRow;
    if (pend.length) {
      html += `<div class="section-label">DA CONFERMARE (${pend.length})</div>`;
      html += pend.map((m) => matchRowHTML(m, { pending: true, actions: isAdmin(), showSeason })).join("");
    }
    if (conf.length) {
      html += `<div class="section-label">PARTITE</div>`;
      if (isAdmin() && state.matches.length)
        html += `<button class="undo" id="undo">Annulla ultima partita</button>`;
      html += conf.map((m) => matchRowHTML(m, { showSeason })).join("");
    }
    app.innerHTML = html;
    return;
  }

  // ---------- TORNEI ----------
  if (tab === "tornei") {
    let html = "";

    if (isAdmin()) {
      if (!season) {
        html += `<div class="empty">Serve una stagione attiva per creare un torneo.</div>`;
      } else {
        const usedIds = new Set(state.tPairs.flat().filter(Boolean));
        const pairRows = state.tPairs.map((pair, pi) => {
          const sel = (slot) => {
            const opts = players.map((p) => {
              const dis = usedIds.has(p.id) && pair[slot] !== p.id ? "disabled" : "";
              const s = pair[slot] === p.id ? "selected" : "";
              return `<option value="${p.id}" ${dis} ${s}>${esc(p.name)} (${p.elo})</option>`;
            }).join("");
            return `<select data-tpair="${pi}" data-tslot="${slot}">
              <option value="">— giocatore —</option>${opts}</select>`;
          };
          const del = state.tPairs.length > 2
            ? `<button class="del-btn" data-tremovepair="${pi}">✕</button>` : "";
          return `<div class="pair-row">${sel(0)}${sel(1)}${del}</div>`;
        }).join("");

        html += `
          <div class="auth-box" style="margin-top:0;margin-bottom:18px">
            <div class="meta" style="margin-bottom:4px">Nuovo torneo a eliminazione diretta (coppie fisse, teste di serie per ELO).</div>
            <input id="t-name" placeholder="Nome torneo" maxlength="40" value="${esc(state.tName)}">
            ${pairRows}
            <button class="undo" id="t-addpair" style="margin-bottom:0">+ Aggiungi coppia</button>
            <button class="cta" id="create-tournament" style="font-size:14px;padding:11px 0">Crea torneo</button>
          </div>`;
      }
    }

    if (!state.tournaments.length) {
      html += `<div class="empty">Nessun torneo${isAdmin() ? "" : ", per ora"}.</div>`;
      app.innerHTML = html;
      return;
    }

    for (const t of state.tournaments) {
      const rounds = t.bracket;
      const total = rounds.length;
      const done = t.status === "done";
      const finale = rounds[total - 1][0];
      const canRecord = isAdmin() && !done && seasonById(t.season_id)?.active;

      let bracketHTML = "";
      rounds.forEach((round, r) => {
        bracketHTML += `<div class="b-round"><div class="section-label">${roundName(r, total)}</div>`;
        round.forEach((m, i) => {
          const teamRow = (idx, other) => {
            const won = m.winner != null && m.winner === idx;
            const tbd = idx == null;
            const score = m.score
              ? `<span class="b-score">${idx === m.a ? m.score[0] : m.score[1]}</span>` : "";
            return `<div class="b-team ${won ? "winner" : ""} ${tbd ? "tbd" : ""}">
              ${won ? "🏆 " : ""}${esc(teamLabel(t, idx))}${score}
            </div>`;
          };
          const recordUI = canRecord && m.a != null && m.b != null && m.winner == null
            ? `<div class="b-record">
                <input class="ts-input" type="number" min="0" id="ts-${t.id}-${r}-${i}-a" placeholder="R">
                <span style="opacity:0.6">–</span>
                <input class="ts-input" type="number" min="0" id="ts-${t.id}-${r}-${i}-b" placeholder="B">
                <button data-trecord="${t.id}|${r}|${i}">OK</button>
              </div>` : "";
          bracketHTML += `<div class="b-match">${teamRow(m.a)}${teamRow(m.b)}${recordUI}</div>`;
        });
        bracketHTML += `</div>`;
      });

      html += `<div class="info-card">
        <h3>${esc(t.name).toUpperCase()} ${done ? "· CONCLUSO" : ""}</h3>
        <p class="meta" style="margin-bottom:10px">${esc(seasonName(t.season_id))} · ${fmtDate(t.created_at, false)} · ${t.teams.length} coppie</p>
        ${done ? `<p>🏆 Vincitori: <b>${esc(teamLabel(t, finale.winner))}</b></p>` : ""}
        ${bracketHTML}
      </div>`;
    }
    app.innerHTML = html;
    return;
  }

  // ---------- STAGIONI ----------
  if (tab === "stagioni") {
    let html = "";

    if (isAdmin()) {
      html += `
        <div class="auth-box" style="margin-top:0;margin-bottom:18px">
          <div class="meta" style="margin-bottom:4px">${season ? "Pianifica la prossima stagione: partirà alla chiusura di quella in corso." : "Crea una stagione: partirà subito."}</div>
          <input id="new-season-name" placeholder="Nome stagione" maxlength="40">
          <button class="cta" id="create-season" style="font-size:14px;padding:11px 0">${season ? "Pianifica stagione" : "Crea e avvia stagione"}</button>
        </div>`;
    }

    if (season) {
      const ranked = [...players].sort((a, b) => b.elo - a.elo);
      const leader = ranked[0];
      const pendCount = pending.filter((m) => m.season_id === season.id).length;
      html += `<div class="section-label">IN CORSO</div>
        <div class="info-card">
          <h3>${esc(season.name).toUpperCase()}</h3>
          <p class="meta" style="margin-bottom:8px">dal ${fmtDate(season.created_at, false)}${pendCount ? ` · ${pendCount} partite in attesa` : ""}</p>
          ${leader ? `<p>In testa: <b>${esc(leader.name)}</b> (${leader.elo})</p>` : "<p>Nessun giocatore.</p>"}
          ${isAdmin() ? `<button class="close-btn" id="close-season">Chiudi stagione</button>` : ""}
        </div>`;
    } else {
      html += `<div class="empty">Nessuna stagione in corso.</div>`;
    }

    const planned = plannedSeasons();
    if (planned.length) {
      html += `<div class="section-label">PIANIFICATE</div>`;
      html += planned.map((s) =>
        `<div class="row">
          <div class="player-name" style="flex:1">${esc(s.name)}</div>
          <div class="meta">in coda</div>
          ${isAdmin() ? `<button class="del-btn" data-delseason="${s.id}">✕</button>` : ""}
        </div>`).join("");
    }

    const past = closedSeasons();
    if (past.length) {
      html += `<div class="section-label" style="margin-top:22px">ALBO D'ORO</div>`;
      html += past.map((s) => {
        const res = state.results[s.id] ?? [];
        const medals = ["🥇", "🥈", "🥉"];
        const podium = res.slice(0, 3).map((r, i) =>
          `<div class="podium-row">
            <span class="medal">${medals[i]}</span>
            <span class="player-name" style="font-size:15px">${esc(r.name)}</span>
            <span class="meta" style="margin-top:0">${r.wins}V–${r.losses}S</span>
            <span class="elo-small">${r.elo}</span>
          </div>`
        ).join("");
        const others = res.length > 3 ? `<div class="meta" style="margin-top:6px">e altri ${res.length - 3} giocatori</div>` : "";
        const dates = `${fmtDate(s.created_at, false)} → ${s.ended_at ? fmtDate(s.ended_at, false) : "?"}`;
        return `<div class="info-card">
          <h3>${esc(s.name).toUpperCase()}</h3>
          <p class="meta" style="margin-bottom:10px">${dates}</p>
          ${podium || `<p class="meta">Nessun risultato archiviato.</p>`}
          ${others}
        </div>`;
      }).join("");
    }
    app.innerHTML = html;
    return;
  }

  // ---------- ELO ----------
  if (tab === "elo") {
    app.innerHTML = `
      <div class="info-card">
        <h3>LE BASI</h3>
        <p>Tutti partono da <b>1000 punti</b>. Dopo ogni partita il vincitore prende punti e il perdente li perde: quello che guadagna una squadra è esattamente quello che perde l'altra. Il rating non misura quante partite hai vinto, ma <b>quanto sei forte rispetto agli altri</b>.</p>
        <p>Le partite proposte dai giocatori entrano in classifica solo dopo la <b>conferma di un admin</b>, e i punti si calcolano con i rating al momento della conferma. Le partite dei tornei sono partite a tutti gli effetti: muovono l'ELO come le altre.</p>
      </div>

      <div class="info-card">
        <h3>QUANTO VALE UNA VITTORIA</h3>
        <p>Dipende da tre cose.</p>
        <p><b>1. Chi hai battuto.</b> Prima della partita il sistema calcola la probabilità di vittoria dal divario di rating:</p>
        <div class="formula">attesa = 1 / (1 + 10^((eloAvv − eloTuo) / 400))</div>
        <p>Battere un avversario molto più forte vale tanto, battere l'ultimo in classifica vale poco. Perdere da favorito costa caro, perdere da sfavorito costa quasi niente.</p>
        <p><b>2. Il punteggio.</b> Il delta viene moltiplicato per un fattore che cresce col divario di gol:</p>
        <div class="formula">mov = ln(diffGol + 1) × 2.2 / (diffElo × 0.001 + 2.2)</div>
        <p>Un 10-9 vale circa <b>0.7×</b> il valore base, un 10-0 circa <b>2.4×</b>. La seconda parte della formula smorza i cappotti del favorito e amplifica quelli dello sfavorito, così i più forti non gonfiano il rating massacrando gli ultimi.</p>
        <p>Se il punteggio non ve lo ricordate, si può registrare solo chi ha vinto: la partita vale <b>0.5×</b>, meno di una vittoria di misura, perché senza il punteggio il sistema ha meno informazione ed è prudente.</p>
        <p><b>3. Il tuo compagno</b> (solo 2v2, vedi sotto).</p>
      </div>

      <div class="info-card">
        <h3>IL 2v2, IL COMPAGNO E LA COPPIA SBILANCIATA</h3>
        <p>Il rating di squadra parte dalla <b>media</b> dei due giocatori, ma una coppia sbilanciata vale meno della sua media: al balilla l'anello debole pesa più di quanto il forte possa compensare. Quindi:</p>
        <div class="formula">ratingSquadra = media − 0.25 × |elo1 − elo2|</div>
        <p>Una coppia 1300+700 non vale 1000 ma <b>850</b>: parte sfavorita contro due da 1000. Questo protegge il giocatore forte con un compagno molto scarso: se perdete, la sconfitta era già messa in conto e i punti persi sono pochi. Se vincete, valgono di più.</p>
        <p>Il bottino viene poi diviso in base ai rating individuali: se vinci, <b>il più debole della coppia prende la fetta più grande</b> (ha sovraperformato). Se perdete, <b>il più forte perde di più</b>, ma su un totale già ridotto dallo sbilanciamento.</p>
      </div>

      <div class="info-card">
        <h3>ESEMPIO CONCRETO</h3>
        <p>Marco (1100) e Luca (900) battono 10-3 una coppia da 1000 e 1000. La media sarebbe pari, ma con la correzione la coppia vale 950 e parte sfavorita (43%). Vittoria larga da sfavoriti: montepremi di circa 78 punti.</p>
        <table class="example-table">
          <tr><td>Luca (900, il più debole)</td><td class="pos">+43</td></tr>
          <tr><td>Marco (1100, il più forte)</td><td class="pos">+35</td></tr>
          <tr><td>Avversario 1 (1000)</td><td class="neg">−39</td></tr>
          <tr><td>Avversario 2 (1000)</td><td class="neg">−39</td></tr>
        </table>
        <p style="margin-top:8px">Stessa partita finita 10-9: montepremi di circa 26 punti. E se Marco e Luca avessero perso, avrebbero pagato poco: partivano sfavoriti.</p>
      </div>

      <div class="info-card">
        <h3>LE STAGIONI</h3>
        <p>Quando l'admin chiude una stagione, la classifica finale viene <b>archiviata nell'albo d'oro</b> e tutti ripartono da 1000. Le stagioni si possono <b>pianificare in anticipo</b>: alla chiusura di quella in corso, parte automaticamente la prossima in coda. Ogni stagione è un campionato a sé: vincerla conta più del rating assoluto.</p>
      </div>

      <div class="info-card">
        <h3>PARTITE CONSIGLIATE</h3>
        <p>Nella scheda Partita trovi sfide suggerite tra chi <b>non si è mai affrontato</b>. L'ELO diventa più preciso quando tutti giocano contro tutti: se sfidi sempre le stesse persone, il tuo rating è confrontabile solo con il loro.</p>
      </div>

      <div class="info-card">
        <h3>IN PRATICA</h3>
        <p>Vuoi salire in fretta? Sfida chi sta sopra di te, gioca in coppia col più scarso e vinci largo. Vuoi difendere il primo posto? Non ti conviene nasconderti: contro i deboli hai poco da guadagnare e tanto da perdere.</p>
      </div>`;
    return;
  }

  // ---------- GIOCATORI ----------
  if (tab === "rosa") {
    const rows = players.map((p) =>
      `<div class="row">
        <div class="player-name" style="flex:1">${esc(p.name)}</div>
        <div class="meta">ELO ${p.elo} · ${p.wins}V–${p.losses}S</div>
        ${isAdmin() ? `<button class="edit-btn" data-rename="${p.id}" title="Rinomina">✏️</button>` : ""}
      </div>`
    ).join("");

    const addForm = isAdmin()
      ? `<div class="add-row">
          <input id="new-name" placeholder="Nome giocatore" maxlength="30">
          <button id="add-player">Aggiungi</button>
        </div>`
      : "";

    const authBox = isAdmin()
      ? `<div class="auth-box">
          <div class="meta" style="margin-bottom:8px">Admin: ${esc(state.session.user.email)}</div>
          <button class="undo" id="logout" style="margin-bottom:0">Esci</button>
        </div>`
      : `<div class="auth-box">
          <div class="meta" style="margin-bottom:8px">Accesso admin</div>
          <input id="login-email" type="email" placeholder="Email" autocomplete="username">
          <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
          <button class="cta" id="login" style="font-size:14px;padding:11px 0">Accedi</button>
        </div>`;

    app.innerHTML = `
      ${addForm}
      ${rows || `<div class="empty">Nessun giocatore in rosa.</div>`}
      ${authBox}
      <div class="foot-note">Chiunque può vedere tutto e proporre partite; solo gli admin confermano, gestiscono rosa, stagioni e tornei.</div>`;
  }
}

// ---------- Eventi ----------
async function withBusy(fn) {
  if (state.busy) return;
  state.busy = true;
  render();
  await fn();
  await loadAll();
  state.busy = false;
  render();
}

document.addEventListener("click", async (e) => {
  const t = e.target;

  if (t.dataset.tab) {
    state.tab = t.dataset.tab;
    await loadAll();
    render();
    return;
  }
  if (t.dataset.histseason) {
    state.historySeason = t.dataset.histseason;
    render();
    return;
  }
  if (t.dataset.mode) {
    state.mode = t.dataset.mode;
    state.teamA = ["", ""];
    state.teamB = ["", ""];
    render();
    return;
  }
  if (t.dataset.scoremode) {
    state.noScore = t.dataset.scoremode === "noscore";
    state.winnerSide = null;
    render();
    return;
  }
  if (t.dataset.winner) {
    state.winnerSide = t.dataset.winner;
    render();
    return;
  }
  if (t.dataset.score) {
    const key = t.dataset.score === "A" ? "scoreA" : "scoreB";
    state[key] = Math.max(0, state[key] + Number(t.dataset.dir));
    render();
    return;
  }
  if (t.dataset.suggest) {
    const [a, b] = t.dataset.suggest.split("|");
    state.mode = "1v1";
    state.noScore = false;
    state.winnerSide = null;
    state.teamA = [a, ""];
    state.teamB = [b, ""];
    state.scoreA = 0;
    state.scoreB = 0;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (t.id === "save-match") return withBusy(recordMatch);
  if (t.dataset.confirm) return withBusy(() => confirmMatch(t.dataset.confirm));
  if (t.dataset.reject) {
    if (!confirm("Rifiutare questa partita? Verrà eliminata.")) return;
    return withBusy(() => rejectMatch(t.dataset.reject));
  }
  if (t.id === "undo") {
    if (!confirm("Annullare l'ultima partita confermata?")) return;
    return withBusy(undoLast);
  }
  if (t.id === "create-season") {
    const name = document.getElementById("new-season-name").value.trim();
    if (!name) { toast("Dai un nome alla stagione", false); return; }
    return withBusy(() => createSeason(name));
  }
  if (t.id === "close-season") {
    const s = activeSeason();
    if (!s) return;
    const next = plannedSeasons().sort((a, b) => new Date(a.created_at) - new Date(b.created_at))[0];
    const pendCount = state.pending.filter((m) => m.season_id === s.id).length;
    const warn = pendCount ? `\n\nAttenzione: ${pendCount} partite in attesa resteranno non conteggiate.` : "";
    const after = next ? `Partirà subito "${next.name}".` : "Non partirà nessuna stagione finché non ne crei una.";
    if (!confirm(`Chiudere "${s.name}"?\nLa classifica va nell'albo d'oro e tutti ripartono da 1000.\n${after}${warn}`)) return;
    return withBusy(closeSeason);
  }
  if (t.dataset.delseason) {
    const s = seasonById(t.dataset.delseason);
    if (!s || s.active || s.ended_at) return;
    if (!confirm(`Eliminare la stagione pianificata "${s.name}"?`)) return;
    return withBusy(() => deletePlannedSeason(s.id));
  }
  if (t.id === "t-addpair") {
    state.tPairs.push(["", ""]);
    render();
    return;
  }
  if (t.dataset.tremovepair != null) {
    state.tPairs.splice(Number(t.dataset.tremovepair), 1);
    render();
    return;
  }
  if (t.id === "create-tournament") {
    return withBusy(createTournament);
  }
  if (t.dataset.trecord) {
    const [tid, r, i] = t.dataset.trecord.split("|");
    const sa = parseInt(document.getElementById(`ts-${tid}-${r}-${i}-a`)?.value, 10);
    const sbv = parseInt(document.getElementById(`ts-${tid}-${r}-${i}-b`)?.value, 10);
    if (Number.isNaN(sa) || Number.isNaN(sbv)) { toast("Inserisci entrambi i punteggi", false); return; }
    return withBusy(() => recordTournamentMatch(tid, Number(r), Number(i), sa, sbv));
  }
  if (t.dataset.rename) {
    const p = byId(t.dataset.rename);
    if (!p) return;
    const newName = prompt(`Nuovo nome per "${p.name}":`, p.name);
    if (newName == null) return;
    const clean = newName.trim().slice(0, 30);
    if (!clean || clean === p.name) return;
    return withBusy(() => renamePlayer(p.id, clean));
  }
  if (t.id === "add-player") {
    const name = document.getElementById("new-name").value.trim();
    if (!name) return;
    return withBusy(() => addPlayer(name));
  }
  if (t.id === "login") {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-pass").value;
    if (!email || !password) return;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { toast("Credenziali non valide", false); return; }
    toast("Accesso effettuato");
    return;
  }
  if (t.id === "logout") {
    await sb.auth.signOut();
    toast("Sei uscito");
    return;
  }
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.team) {
    const team = t.dataset.team === "red" ? state.teamA : state.teamB;
    team[Number(t.dataset.slot)] = t.value;
    render();
    return;
  }
  if (t.dataset.tpair != null) {
    state.tPairs[Number(t.dataset.tpair)][Number(t.dataset.tslot)] = t.value;
    render();
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "t-name") state.tName = e.target.value;
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "new-name") document.getElementById("add-player")?.click();
  if (e.target.id === "login-email" || e.target.id === "login-pass") document.getElementById("login")?.click();
  if (e.target.id === "new-season-name") document.getElementById("create-season")?.click();
});

// ---------- Avvio ----------
const { data: sessionData } = await sb.auth.getSession();
state.session = sessionData.session;
sb.auth.onAuthStateChange((_event, session) => {
  state.session = session;
  render();
});

await loadAll();
render();
</script>
</body>
</html>
