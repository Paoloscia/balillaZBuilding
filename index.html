<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ============================================================
// CONFIGURAZIONE
// ============================================================
const SUPABASE_URL = "https://gtxeacrydiullkyqanpu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_G7n7aUW5IhECINFT3T2ybw_JrquwZq7";
// ============================================================

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Modalita' TV: apri la pagina con ?tv=1 per la sola classifica a caratteri
// grandi, senza menu, con aggiornamento realtime. Perfetta per un monitor.
const TV = new URLSearchParams(location.search).has("tv");

// ---------- ELO ----------
const K = 32;
const HANDICAP = 0.25;     // quanto pesa lo sbilanciamento interno della coppia
const NO_SCORE_BASE = 0.5; // valore di una partita senza punteggio (10-9 ≈ 0.7)
const LINEUP_BOOST = 1.25; // i tavoli di "Chi c'e' oggi", se meritano il bonus
const PAIR_QUAL = { games: 10, opps: 6 }; // requisiti coppia: partite insieme e COPPIE avversarie diverse affrontate
const INACTIVE_DAYS = 21;  // giorni senza partite dopo cui compare l'etichetta "inattivo" (nessun effetto su ELO o classifica)

const expectedScore = (ra, rb) => 1 / (1 + Math.pow(10, (rb - ra) / 400));

const movMultiplier = (goalDiff, winnerElo, loserElo) =>
  Math.log(goalDiff + 1) * (2.2 / ((winnerElo - loserElo) * 0.001 + 2.2));

// Reset di fine stagione a scaglioni: il vantaggio si conserva ma compresso,
// cosi' il piu' forte non riparte alla pari e non prosciuga gli altri.
function seasonStartElo(elo) {
  if (elo >= 1250) return 1150;
  if (elo >= 1150) return 1100;
  if (elo >= 1050) return 1050;
  if (elo >= 950) return 1000;
  if (elo >= 850) return 950;
  if (elo >= 750) return 900;
  return 850;
}

function teamRating(ids) {
  if (ids.length === 1) return byId(ids[0]).elo;
  const [r1, r2] = ids.map((id) => byId(id).elo);
  return (r1 + r2) / 2 - HANDICAP * Math.abs(r1 - r2);
}

function computeMatch(idsA, idsB, scoreA, scoreB, winnerSide, refDate = null, boost = 1) {
  const size = idsA.length;
  const ratingA = teamRating(idsA);
  const ratingB = teamRating(idsB);
  const noScore = scoreA == null || scoreB == null;
  const aWins = noScore ? winnerSide === "A" : scoreA > scoreB;

  const winnerElo = aWins ? ratingA : ratingB;
  const loserElo = aWins ? ratingB : ratingA;
  const mov = noScore
    ? NO_SCORE_BASE * (2.2 / ((winnerElo - loserElo) * 0.001 + 2.2))
    : movMultiplier(Math.abs(scoreA - scoreB), winnerElo, loserElo);

  const expA = expectedScore(ratingA, ratingB);
  const totalA = K * mov * ((aWins ? 1 : 0) - expA) * size
    * repetitionFactor(idsA, idsB, refDate ?? Date.now())
    * boost;

  const deltas = {};
  const assign = (ids, total, winning) => {
    if (ids.length === 1) { deltas[ids[0]] = Math.round(total); return; }
    const [i, j] = ids;
    const ri = byId(i).elo, rj = byId(j).elo;
    const shareI = winning ? rj / (ri + rj) : ri / (ri + rj);
    deltas[i] = Math.round(total * shareI);
    deltas[j] = Math.round(total * (1 - shareI));
  };
  assign(idsA, totalA, aWins);
  assign(idsB, -totalA, !aWins);

  const winners = aWins ? idsA : idsB;
  const pre = {};
  [...idsA, ...idsB].forEach((id) => (pre[id] = byId(id).elo));

  return { deltas, winners, pre };
}

// ---------- Tornei: tabellone ----------
function bracketOrder(size) {
  let arr = [0];
  while (arr.length < size) {
    const m = arr.length * 2;
    const next = [];
    for (const x of arr) { next.push(x); next.push(m - 1 - x); }
    arr = next;
  }
  return arr;
}

function advance(rounds, r, i, teamIdx) {
  if (r + 1 >= rounds.length) return;
  const nm = rounds[r + 1][Math.floor(i / 2)];
  if (i % 2 === 0) nm.a = teamIdx; else nm.b = teamIdx;
}

function buildBracket(teamCount) {
  let size = 1;
  while (size < teamCount) size *= 2;
  const slots = bracketOrder(size).map((s) => (s < teamCount ? s : null));
  const rounds = [];
  const first = [];
  for (let i = 0; i < slots.length; i += 2)
    first.push({ a: slots[i], b: slots[i + 1], winner: null, score: null });
  rounds.push(first);
  let n = first.length;
  while (n > 1) {
    n = Math.floor(n / 2);
    rounds.push(Array.from({ length: n }, () => ({ a: null, b: null, winner: null, score: null })));
  }
  // bye del primo turno: passa il turno automaticamente
  rounds[0].forEach((m, i) => {
    if (m.a != null && m.b == null) { m.winner = m.a; advance(rounds, 0, i, m.a); }
    else if (m.b != null && m.a == null) { m.winner = m.b; advance(rounds, 0, i, m.b); }
  });
  return rounds;
}

const ROUND_NAMES = ["FINALE", "SEMIFINALI", "QUARTI", "OTTAVI", "SEDICESIMI"];
const roundName = (r, total) => ROUND_NAMES[total - 1 - r] ?? `TURNO ${r + 1}`;

const FMT_LABEL = {
  elim: "eliminazione",
  doppia: "doppia eliminazione",
  girone: "girone",
  gironefinale: "girone + finale",
};

// Doppia eliminazione: tabellone vincenti + ripescaggio + finalissima.
// Richiede un numero di coppie potenza di 2 (4, 8, 16), niente bye,
// niente reset del bracket alla finalissima (una partita secca).
function buildDoubleElim(teamCount) {
  const w = buildBracket(teamCount);
  const k = Math.log2(teamCount);
  const sizes = [];
  let s = teamCount / 4;
  for (let r = 0; r < 2 * k - 2; r++) {
    sizes.push(Math.max(1, s));
    if (r % 2 === 1) s = Math.floor(s / 2) || 1;
  }
  const l = sizes.map((n) => Array.from({ length: n }, () => ({ a: null, b: null, winner: null, score: null })));
  const gf = [{ a: null, b: null, winner: null, score: null }];
  return { w, l, gf };
}

function buildBracketFor(fmt, teams) {
  if (fmt === "girone" || fmt === "gironefinale") {
    const fixtures = [];
    for (let i = 0; i < teams.length; i++)
      for (let j = i + 1; j < teams.length; j++)
        fixtures.push({ a: i, b: j, winner: null, score: null });
    return fmt === "girone"
      ? [fixtures]
      : [fixtures, [{ a: null, b: null, winner: null, score: null }]];
  }
  if (fmt === "doppia") return buildDoubleElim(teams.length);
  return buildBracket(teams.length);
}

// Vincitore di un torneo concluso, qualunque sia il formato.
function tournamentWinnerIdx(t) {
  const fmt = t.format ?? "elim";
  if (fmt === "finale4") return null; // il campione si legge con finaleChampion(t)
  if (fmt === "girone") return gironeStandings(t)[0]?.i ?? null;
  if (fmt === "gironefinale") return t.bracket[1]?.[0]?.winner ?? null;
  if (fmt === "doppia") return t.bracket.gf?.[0]?.winner ?? null;
  return t.bracket[t.bracket.length - 1][0].winner;
}

function deadlineInfo(s) {
  if (!s?.ends_at) return null;
  const end = new Date(s.ends_at);
  const days = Math.ceil((end - Date.now()) / 86400000);
  const dateTxt = end.toLocaleDateString("it-IT", { day: "numeric", month: "short" });
  if (days > 1) return { text: `La stagione finisce il ${dateTxt} · tra ${days} giorni`, urgent: days <= 7, overdue: false };
  if (days === 1) return { text: `La stagione finisce domani (${dateTxt})`, urgent: true, overdue: false };
  if (days === 0) return { text: "La stagione finisce oggi!", urgent: true, overdue: false };
  return { text: `Stagione scaduta il ${dateTxt}: in attesa di chiusura`, urgent: true, overdue: true };
}

async function loadAll() {
  const [pRes, sRes, rRes, mRes, pendRes, tRes, reqRes, totRes, chRes] = await Promise.all([
    sb.from("players").select("*").order("elo", { ascending: false }),
    sb.from("seasons").select("*").order("created_at", { ascending: false }),
    sb.from("season_results").select("*").order("rank", { ascending: true }),
    sb.from("matches").select("*").eq("status", "confirmed")
      .order("confirmed_at", { ascending: false }).limit(600),
    sb.from("matches").select("*").eq("status", "pending")
      .order("created_at", { ascending: true }),
    sb.from("tournaments").select("*").order("created_at", { ascending: false }),
    sb.from("player_requests").select("*").order("created_at", { ascending: true }),
    sb.from("player_totals").select("*"),
    sb.from("challenges").select("*").order("created_at", { ascending: false }),
  ]);
  // Tabelle indispensabili: senza queste l'app non funziona.
  const core = { players: pRes, seasons: sRes, season_results: rRes, matches: mRes, pending: pendRes, tournaments: tRes };
  const broken = Object.entries(core).filter(([, r]) => r.error);
  if (broken.length) {
    const msg = broken.map(([name, r]) => `${name}: ${r.error.message}`).join(" · ");
    document.getElementById("app").innerHTML =
      `<div class="empty">Errore nel caricamento dei dati.<br><br><span style="font-style:normal;font-size:12px;opacity:0.8">${esc(msg)}</span></div>`;
    throw new Error("loadAll: " + msg);
  }
  state.players = pRes.data;
  state.seasons = sRes.data;
  state.matches = mRes.data;
  state.pending = pendRes.data;
  state.tournaments = tRes.data;

  // Tabelle aggiunte dopo: se mancano l'app funziona lo stesso, ma avvisa
  // quale script SQL va eseguito.
  if (reqRes.error) {
    state.requests = [];
    toast("Manca la tabella player_requests: esegui supabase-richieste-giocatori.sql", false);
  } else {
    state.requests = reqRes.data;
  }
  if (totRes.error) {
    state.totals = {};
    toast("Manca la vista player_totals: esegui supabase-totali.sql", false);
  } else {
    state.totals = Object.fromEntries(totRes.data.map((r) => [r.player_id, r]));
  }
  // Sfide dirette: tabella opzionale, se manca la sezione si nasconde da sola.
  if (chRes.error) {
    state.challenges = [];
    state.challengesOk = false;
  } else {
    state.challenges = chRes.data;
    state.challengesOk = true;
  }

  state.results = {};
  for (const r of rRes.data) (state.results[r.season_id] ??= []).push(r);

  if (state.historySeason !== "all" && !state.seasons.some((s) => s.id === state.historySeason))
    state.historySeason = "all";
  if (state.historyPlayer !== "all" && !state.players.some((p) => p.id === state.historyPlayer))
    state.historyPlayer = "all";
}

async function applyDeltas(deltas, winners, sign = 1) {
  const updates = Object.keys(deltas).map((id) => {
    const p = byId(id);
    if (!p) return Promise.resolve({});
    const won = winners.includes(id);
    return sb.from("players").update({
      elo: p.elo + sign * deltas[id],
      wins: p.wins + sign * (won ? 1 : 0),
      losses: p.losses + sign * (won ? 0 : 1),
    }).eq("id", id);
  });
  const results = await Promise.all(updates);
  return !results.some((r) => r.error);
}

// crea una partita confermata (usata dal form e dai tornei)
async function insertConfirmedMatch(idsA, idsB, scoreA, scoreB, winnerSide, seasonId, boost = 1) {
  const { deltas, winners, pre } = computeMatch(idsA, idsB, scoreA, scoreB, winnerSide, null, boost);
  const ok = await applyDeltas(deltas, winners);
  const ins = await sb.from("matches").insert({
    mode: idsA.length === 1 ? "1v1" : "2v2",
    team_a: idsA, team_b: idsB,
    score_a: scoreA, score_b: scoreB,
    winner_side: winnerSide,
    season_id: seasonId,
    deltas, pre, winners, boost,
    status: "confirmed",
    confirmed_at: new Date().toISOString(),
  });
  return ok && !ins.error;
}

const teamSetEq = (x, y) => [...x].sort().join() === [...y].sort().join();

function suggestionBoostFor(a, b) {
  for (let i = 0; i < state.suggestedList.length; i++) {
    const s = state.suggestedList[i];
    if ((teamSetEq(a, s.a) && teamSetEq(b, s.b)) || (teamSetEq(a, s.b) && teamSetEq(b, s.a)))
      return { boost: s.boost, index: i };
  }
  return null;
}

function currentSuggestion() {
  if (state.mode !== "2v2") return null;
  const a = state.teamA.slice(0, 2), b = state.teamB.slice(0, 2);
  if (a.some((x) => !x) || b.some((x) => !x)) return null;
  return suggestionBoostFor(a, b);
}

async function recordMatch() {
  const season = activeSeason();
  if (!season) { toast("Nessuna stagione attiva", false); return; }
  const size = state.mode === "1v1" ? 1 : 2;
  const idsA = state.teamA.slice(0, size);
  const idsB = state.teamB.slice(0, size);
  const noScore = state.noScore;
  const sa = noScore ? null : state.scoreA;
  const sbv = noScore ? null : state.scoreB;
  const ws = noScore ? state.winnerSide : null;
  const sugg = currentSuggestion();
  const boost = sugg?.boost ?? 1;

  if (isAdmin()) {
    const ok = await insertConfirmedMatch(idsA, idsB, sa, sbv, ws, season.id, boost);
    if (!ok) { toast("Errore di salvataggio, ricarica la pagina", false); return; }
    toast("Partita registrata");
    state.tab = "classifica";
  } else {
    const ins = await sb.from("matches").insert({
      mode: state.mode,
      team_a: idsA, team_b: idsB,
      score_a: sa, score_b: sbv,
      winner_side: ws,
      season_id: season.id,
      boost,
      status: "pending",
    });
    if (ins.error) { toast("Errore di invio, riprova", false); return; }
    toast("Partita inviata: conterà dopo la conferma di un admin");
    state.tab = "storico";
  }

  state.teamA = ["", ""];
  state.teamB = ["", ""];
  state.scoreA = 0;
  state.scoreB = 0;
  state.winnerSide = null;
  if (sugg) state.suggestedList.splice(sugg.index, 1);
}

async function confirmMatch(id) {
  const m = state.pending.find((x) => x.id === id);
  if (!m) return;
  if (!seasonById(m.season_id)?.active) {
    toast("La stagione di questa partita è chiusa: rifiutala", false);
    return;
  }
  const ids = [...m.team_a, ...m.team_b];
  if (ids.some((pid) => !byId(pid))) {
    toast("Giocatore non trovato, impossibile confermare", false);
    return;
  }
  const { deltas, winners, pre } = computeMatch(
    m.team_a, m.team_b, m.score_a, m.score_b, m.winner_side, m.created_at, m.boost ?? (m.boosted ? 1.25 : 1)
  );
  const ok = await applyDeltas(deltas, winners);
  const upd = await sb.from("matches").update({
    deltas, pre, winners,
    status: "confirmed",
    confirmed_at: new Date().toISOString(),
  }).eq("id", id);
  if (!ok || upd.error) { toast("Errore nella conferma, ricarica la pagina", false); return; }
  toast("Partita confermata");
}

function findMatch(id) {
  return state.matches.find((x) => x.id === id)
    ?? state.pending.find((x) => x.id === id)
    ?? state.profileMatches?.find((x) => x.id === id)
    ?? null;
}

// Correzione formazioni da parte dell'admin. Per le pending basta aggiornare
// le squadre (i delta si calcolano alla conferma). Per le confermate si
// aggiornano squadre e winners e poi si ricalcola TUTTA la stagione, perche'
// cambiare i giocatori di una partita passata invalida tutti i delta successivi.
async function saveMatchEdit() {
  const em = state.editMatch;
  if (!em) return;
  const m = findMatch(em.id);
  if (!m) { state.editMatch = null; return; }
  const size = m.team_a.length;
  const a = em.a.slice(0, size);
  const b = em.b.slice(0, size);
  const all = [...a, ...b];
  if (all.some((x) => !x) || new Set(all).size !== all.length) {
    toast("Formazioni non valide: slot vuoti o giocatori duplicati", false);
    return;
  }
  if (m.status === "confirmed" && !seasonById(m.season_id)?.active) {
    toast("La stagione di questa partita è chiusa: non si può correggere", false);
    return;
  }
  let sa = null, sbv = null, ws = null;
  if (em.noScore) {
    ws = em.ws;
    if (ws !== "A" && ws !== "B") { toast("Scegli chi ha vinto", false); return; }
  } else {
    sa = parseInt(em.sa, 10);
    sbv = parseInt(em.sb, 10);
    if (!Number.isInteger(sa) || !Number.isInteger(sbv) || sa < 0 || sbv < 0 || sa === sbv) {
      toast("Punteggio non valido", false); return;
    }
  }
  const aWins = em.noScore ? ws === "A" : sa > sbv;
  const patch = { team_a: a, team_b: b, score_a: sa, score_b: sbv, winner_side: ws };
  if (m.status === "confirmed") patch.winners = aWins ? a : b;
  const { error } = await sb.from("matches").update(patch).eq("id", em.id);
  if (error) { toast("Errore nel salvataggio della correzione", false); return; }
  state.editMatch = null;
  if (m.status === "confirmed") {
    await loadAll();
    if (state.profileId) state.profileMatches = null;
    await recalcSeason();
  } else {
    toast("Formazioni aggiornate");
  }
}

// Eliminazione di una qualsiasi partita dal pannello di modifica.
// Pending: si cancella e basta. Confermata: si cancella e si ricalcola
// la stagione, che riassorbe i delta della partita sparita.

  const em = state.editMatch;

  const m = findMatch(em.id);

  if (m.status === "confirmed" && !seasonById(m.season_id)?.active) {
    toast("La stagione di questa partita è chiusa: non si può eliminare", false);
    return;
  }
  const { error } = await sb.from("matches").delete().eq("id", em.id);
  if (error) { toast("Errore nell'eliminazione", false); return; }
  state.editMatch = null;
  if (m.status === "confirmed") {
    await loadAll();
    if (state.profileId) state.profileMatches = null;
    await recalcSeason();
  } else {
    toast("Partita eliminata");
  }
}

async function closeSeason() {
  const season = activeSeason();
  if (!season) return;

  // 0) premi di stagione, da TUTTE le partite della stagione
  let awards = null;
  const { data: allSeason } = await sb.from("matches").select("*")
    .eq("season_id", season.id).eq("status", "confirmed")
    .order("confirmed_at", { ascending: true });
  if (allSeason) awards = computeAwards(allSeason);

  // Chiusura ATOMICA lato database (supabase-chiusura-backup.sql):
  // snapshot, chiusura, reset a scaglioni e avvio della prossima in una
  // sola transazione. Se la funzione non esiste, si usa il vecchio
  // percorso a passi qui sotto.
  const rpc = await sb.rpc("close_season", { p_awards: awards });
  if (!rpc.error) {
    toast("Stagione chiusa e archiviata");
    return;
  }

  // 1) snapshot nell'albo d'oro
  const ranked = [...state.players].sort((a, b) => b.elo - a.elo);
  const rows = ranked.map((p, i) => ({
    season_id: season.id,
    player_id: p.id,
    name: p.name,
    elo: p.elo,
    wins: p.wins,
    losses: p.losses,
    rank: i + 1,
  }));
  const r1 = await sb.from("season_results").insert(rows);
  if (r1.error) { toast("Errore nello snapshot della stagione", false); return; }

  // 2) chiudi la corrente
  const r2 = await sb.from("seasons")
    .update({ active: false, ended_at: new Date().toISOString(), awards })
    .eq("id", season.id);

  // 3) reset del rank a scaglioni
  const resets = await Promise.all(state.players.map((p) =>
    sb.from("players")
      .update({ elo: seasonStartElo(p.elo), wins: 0, losses: 0 })
      .eq("id", p.id)
  ));
  const r3 = { error: resets.find((r) => r.error)?.error ?? null };

  // 4) avvia la pianificata più vecchia, se c'è
  const next = plannedSeasons().sort((a, b) => new Date(a.created_at) - new Date(b.created_at))[0];
  let r4 = { error: null };
  if (next) {
    r4 = await sb.from("seasons")
      .update({ active: true, created_at: new Date().toISOString() })
      .eq("id", next.id);
  }

  if (r2.error || r3.error || r4.error) {
    toast("Errore nella chiusura, controlla il pannello Supabase", false);
    return;
  }
  toast(next ? `Stagione chiusa. Al via "${next.name}"!` : "Stagione chiusa e archiviata");
}

// ---------- Tornei ----------
function pairRating(pair) {
  const [a, b] = pair.map((id) => byId(id).elo);
  return (a + b) / 2 - HANDICAP * Math.abs(a - b);
}

async function createTournament() {
  const season = activeSeason();
  if (!season) { toast("Serve una stagione attiva", false); return; }
  const name = state.tName.trim();
  if (!name) { toast("Dai un nome al torneo", false); return; }

  if (state.tSignup) {
    if (state.tPairs.length < 2) { toast("Servono almeno 2 coppie", false); return; }
    const flat = state.tPairs.flat().filter(Boolean);
    if (new Set(flat).size !== flat.length) { toast("Un giocatore è in più coppie", false); return; }
    const teams = state.tPairs.map(([p1, p2]) => ({ p1: p1 || null, p2: p2 || null }));
    if (state.tFormat === "doppia" && ![4, 8, 16].includes(teams.length)) {
      toast("La doppia eliminazione richiede 4, 8 o 16 coppie", false); return;
    }
    const { error } = await sb.from("tournaments").insert({
      name, season_id: season.id, teams, bracket: [],
      format: state.tFormat, rated: state.tRated, status: "signup",
    });
    if (error) { toast("Errore nella creazione del torneo", false); return; }
    state.tName = "";
    state.tPairs = [["", ""], ["", ""]];
    state.tRated = true;
    state.tSignup = false;
    toast(`Torneo "${name}" aperto alle iscrizioni`);
    return;
  }

  let pairs;
  if (state.tAuto) {
    // coppie generate dall'app: il piu' forte col piu' debole, a scendere
    const ids = state.tAutoIds.filter((id) => byId(id));
    if (ids.length < 4 || ids.length % 2 !== 0) {
      toast("Coppie automatiche: seleziona un numero pari di giocatori, almeno 4", false); return;
    }
    const sortedPs = ids.map(byId).sort((a, b) => b.elo - a.elo);
    pairs = [];
    for (let i = 0; i < sortedPs.length / 2; i++)
      pairs.push([sortedPs[i].id, sortedPs[sortedPs.length - 1 - i].id]);
  } else {
    pairs = state.tPairs.filter((p) => p[0] && p[1]);
    const flat = pairs.flat();
    if (pairs.length < 2 || pairs.length !== state.tPairs.length) {
      toast("Completa tutte le coppie (minimo 2)", false); return;
    }
    if (new Set(flat).size !== flat.length) {
      toast("Un giocatore è in più coppie", false); return;
    }
  }
  if (state.tFormat === "doppia" && ![4, 8, 16].includes(pairs.length)) {
    toast("La doppia eliminazione richiede 4, 8 o 16 coppie", false); return;
  }
  // teste di serie: coppie ordinate per rating
  const sorted = [...pairs].sort((x, y) => pairRating(y) - pairRating(x));
  const teams = sorted.map(([p1, p2]) => ({ p1, p2 }));
  const bracket = buildBracketFor(state.tFormat, teams);

  const { error } = await sb.from("tournaments").insert({
    name, season_id: season.id, teams, bracket, format: state.tFormat,
    rated: state.tRated,
  });
  if (error) { toast("Errore nella creazione del torneo", false); return; }
  state.tName = "";
  state.tPairs = [["", ""], ["", ""]];
  state.tRated = true;
  state.tAuto = false;
  state.tAutoIds = [];
  toast(`Torneo "${name}" creato`);
}

async function claimSlot(tid, ti, slot, playerId) {
  const t = state.tournaments.find((x) => x.id === tid);
  if (!t || t.status !== "signup") return;
  const inT = t.teams.flatMap((x) => [x.p1, x.p2]).filter(Boolean);
  if (inT.includes(playerId)) { toast("Giocatore già iscritto a questo torneo", false); return; }
  const key = slot === 0 ? "p1" : "p2";
  if (t.teams[ti][key]) { toast("Posto già occupato, ricarica", false); return; }
  const teams = t.teams.map((x, i) => (i === ti ? { ...x, [key]: playerId } : x));
  const { error } = await sb.from("tournaments").update({ teams }).eq("id", tid);
  if (error) { toast("Errore nell'iscrizione", false); return; }
  toast(`${nameOf(playerId)} iscritto: posto confermato`);
}

async function addSignupPair(tid) {
  const t = state.tournaments.find((x) => x.id === tid);
  if (!t || t.status !== "signup") return;
  const teams = [...t.teams, { p1: null, p2: null }];
  const { error } = await sb.from("tournaments").update({ teams }).eq("id", tid);
  if (error) { toast("Errore", false); return; }
  toast("Coppia aggiunta");
}

async function removeSignupPair(tid, ti) {
  const t = state.tournaments.find((x) => x.id === tid);
  if (!t || t.status !== "signup") return;
  if (t.teams.length <= 2) { toast("Servono almeno 2 coppie", false); return; }
  const teams = t.teams.filter((_, i) => i !== ti);
  const { error } = await sb.from("tournaments").update({ teams }).eq("id", tid);
  if (error) { toast("Errore", false); return; }
  toast("Coppia rimossa");
}

async function setSignupSlot(tid, ti, slot, playerId) {
  const t = state.tournaments.find((x) => x.id === tid);
  if (!t || t.status !== "signup") return;
  const key = slot === 0 ? "p1" : "p2";
  if (playerId) {
    const others = t.teams.flatMap((x, i) =>
      [i === ti && key === "p1" ? null : x.p1, i === ti && key === "p2" ? null : x.p2]).filter(Boolean);
    if (others.includes(playerId)) { toast("Giocatore già iscritto a questo torneo", false); return; }
  }
  const teams = t.teams.map((x, i) => (i === ti ? { ...x, [key]: playerId || null } : x));
  const { error } = await sb.from("tournaments").update({ teams }).eq("id", tid);
  if (error) { toast("Errore nel salvataggio", false); return; }
  toast(playerId ? `Posto assegnato a ${nameOf(playerId)}` : "Posto liberato");
}

async function startTournament(t) {
  if (t.status !== "signup") return;
  if (t.teams.some((x) => !x.p1 || !x.p2)) { toast("Ci sono ancora posti vuoti", false); return; }
  if ((t.format ?? "elim") === "doppia" && ![4, 8, 16].includes(t.teams.length)) {
    toast("La doppia eliminazione richiede 4, 8 o 16 coppie", false); return;
  }
  const sorted = [...t.teams].sort((a, b) =>
    pairRating([b.p1, b.p2]) - pairRating([a.p1, a.p2]));
  const bracket = buildBracketFor(t.format ?? "elim", sorted);
  const { error } = await sb.from("tournaments")
    .update({ teams: sorted, bracket, status: "open" }).eq("id", t.id);
  if (error) { toast("Errore nell'avvio", false); return; }
  toast(`Torneo "${t.name}" avviato!`);
}

async function deleteTournament(id) {
  const { error } = await sb.from("tournaments").delete().eq("id", id);
  if (error) { toast("Errore nell'eliminazione", false); return; }
  toast("Torneo eliminato");
}

// sec: "m" per eliminazione/girone/finale del girone, "w"/"l"/"gf" per la doppia
async function recordTournamentMatch(tid, sec, r, i, sa, sbv) {
  const t = state.tournaments.find((x) => x.id === tid);
  if (!t || t.status !== "open") return;
  // la finale a 4 si gioca a stagione GIA' chiusa e non tocca l'ELO
  if ((t.format ?? "elim") === "finale4") return recordFinale(t, sec, i, sa, sbv);
  if (!seasonById(t.season_id)?.active) {
    toast("La stagione del torneo è chiusa", false); return;
  }
  const bracket = t.bracket;
  const fmt = t.format ?? "elim";
  const m = sec === "gf" ? bracket.gf?.[0]
    : sec === "w" ? bracket.w?.[r]?.[i]
    : sec === "l" ? bracket.l?.[r]?.[i]
    : bracket[r]?.[i];
  if (!m || m.a == null || m.b == null || m.winner != null) return;
  if (!Number.isInteger(sa) || !Number.isInteger(sbv) || sa < 0 || sbv < 0 || sa === sbv) {
    toast("Punteggio non valido", false); return;
  }
  const tA = t.teams[m.a], tB = t.teams[m.b];
  const idsA = [tA.p1, tA.p2], idsB = [tB.p1, tB.p2];
  if ([...idsA, ...idsB].some((id) => !byId(id))) {
    toast("Giocatore non trovato", false); return;
  }

  if (t.rated !== false) {
    const ok = await insertConfirmedMatch(idsA, idsB, sa, sbv, null, t.season_id);
    if (!ok) { toast("Errore nel salvataggio della partita", false); return; }
  }

  m.winner = sa > sbv ? m.a : m.b;
  m.score = [sa, sbv];
  const loser = m.winner === m.a ? m.b : m.a;
  let status = "open";

  if (fmt === "girone") {
    if (bracket[0].every((f) => f.winner != null)) status = "done";
  } else if (fmt === "gironefinale") {
    if (r === 0) {
      // girone: quando finisce, le prime due vanno in finale
      if (bracket[0].every((f) => f.winner != null)) {
        const st = gironeStandings(t);
        bracket[1][0].a = st[0].i;
        bracket[1][0].b = st[1].i;
      }
    } else {
      status = "done";
    }
  } else if (fmt === "doppia") {
    if (sec === "w") {
      if (r === bracket.w.length - 1) {
        // finale dei vincenti: il vincitore va in finalissima,
        // il perdente all'ultimo turno del ripescaggio
        bracket.gf[0].a = m.winner;
        bracket.l[bracket.l.length - 1][0].b = loser;
      } else {
        advance(bracket.w, r, i, m.winner);
        if (r === 0) {
          // i perdenti del primo turno si affrontano tra loro
          const lm = bracket.l[0][Math.floor(i / 2)];
          if (i % 2 === 0) lm.a = loser; else lm.b = loser;
        } else {
          // i perdenti dei turni successivi scendono nel turno "major"
          bracket.l[2 * r - 1][i].b = loser;
        }
      }
    } else if (sec === "l") {
      if (r === bracket.l.length - 1) {
        bracket.gf[0].b = m.winner;
      } else {
        const next = bracket.l[r + 1];
        if (next.length === bracket.l[r].length) {
          next[i].a = m.winner;
        } else {
          const nm = next[Math.floor(i / 2)];
          if (i % 2 === 0) nm.a = m.winner; else nm.b = m.winner;
        }
      }
    } else if (sec === "gf") {
      status = "done";
    }
  } else {
    advance(bracket, r, i, m.winner);
    if (bracket[bracket.length - 1][0].winner != null) status = "done";
  }

  const upd = await sb.from("tournaments").update({ bracket, status }).eq("id", tid);
  if (upd.error) { toast("Partita salvata ma tabellone non aggiornato: ricarica", false); return; }
  if (status === "done") {
    toast(`Torneo concluso! Vince ${teamLabel(t, tournamentWinnerIdx(t))} 🏆`);
  } else {
    toast("Risultato registrato");
  }
}

const teamLabel = (t, idx) =>
  idx == null ? "—" : `${nameOf(t.teams[idx].p1)} + ${nameOf(t.teams[idx].p2)}`;

function gironeStandings(t) {
  const st = t.teams.map((_, i) => ({ i, w: 0, l: 0, gf: 0, gs: 0 }));
  for (const f of t.bracket[0]) {
    if (f.winner == null || !f.score) continue;
    st[f.a].gf += f.score[0]; st[f.a].gs += f.score[1];
    st[f.b].gf += f.score[1]; st[f.b].gs += f.score[0];
    if (f.winner === f.a) { st[f.a].w++; st[f.b].l++; } else { st[f.b].w++; st[f.a].l++; }
  }
  st.sort((x, y) => y.w - x.w || (y.gf - y.gs) - (x.gf - x.gs) || y.gf - x.gf);
  return st;
}

function gironeHTML(t, canRecord) {
  const st = gironeStandings(t);
  const fixtures = t.bracket[0];
  const played = fixtures.filter((f) => f.winner != null).length;
  let out = `<div class="section-label">CLASSIFICA GIRONE</div>`;
  out += st.map((row, pos) =>
    `<div class="b-team ${pos === 0 && played ? "winner" : ""}" style="padding:4px 0">
      <span style="width:22px;font-family:var(--font-display)">${pos + 1}</span>
      ${esc(teamLabel(t, row.i))}
      <span class="b-score" style="font-size:13px">${row.w}V–${row.l}S · ${row.gf - row.gs >= 0 ? "+" : ""}${row.gf - row.gs}</span>
    </div>`).join("");
  out += `<div class="section-label">PARTITE (${played}/${fixtures.length})</div>`;
  fixtures.forEach((m, i) => {
    const recordUI = canRecord && m.winner == null
      ? `<div class="b-record">
          <input class="ts-input" type="number" min="0" id="ts-${t.id}-m-0-${i}-a" placeholder="0">
          <span style="opacity:0.6">–</span>
          <input class="ts-input" type="number" min="0" id="ts-${t.id}-m-0-${i}-b" placeholder="0">
          <button data-trecord="${t.id}|m|0|${i}">OK</button>
        </div>` : "";
    out += `<div class="b-match">
      <div class="b-team ${m.winner === m.a ? "winner" : ""}">${esc(teamLabel(t, m.a))}${m.score ? `<span class="b-score">${m.score[0]}</span>` : ""}</div>
      <div class="b-team ${m.winner === m.b ? "winner" : ""}">${esc(teamLabel(t, m.b))}${m.score ? `<span class="b-score">${m.score[1]}</span>` : ""}</div>
      ${recordUI}
    </div>`;
  });
  return out;
}

// ---------- Storico incroci, consigliate e formazioni ----------
const PAIRINGS = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
const pairKey = (a, b) => (a < b ? a + "|" + b : b + "|" + a);

function historyMaps() {
  const games = {}, last = {}, faced = {}, teamed = {};
  for (const m of state.matches) {
    const dt = new Date(m.created_at).getTime();
    for (const id of [...m.team_a, ...m.team_b]) {
      games[id] = (games[id] ?? 0) + 1;
      if (!last[id] || dt > last[id]) last[id] = dt;
    }
    for (const a of m.team_a) for (const b of m.team_b) {
      const k = pairKey(a, b);
      faced[k] = (faced[k] ?? 0) + 1;
    }
    if (m.team_a.length === 2) { const k = pairKey(m.team_a[0], m.team_a[1]); teamed[k] = (teamed[k] ?? 0) + 1; }
    if (m.team_b.length === 2) { const k = pairKey(m.team_b[0], m.team_b[1]); teamed[k] = (teamed[k] ?? 0) + 1; }
  }
  const rank = {};
  const sorted = [...state.players].sort((a, b) => b.elo - a.elo);
  sorted.forEach((p, i) => { rank[p.id] = sorted.length > 1 ? i / (sorted.length - 1) : 0; });
  return { games, last, faced, teamed, rank };
}

// Dalla terza partita dello stesso giorno tra le stesse squadre il delta si dimezza:
// le maratone contano, ma non spostano montagne di punti.
function repetitionFactor(idsA, idsB, refDate) {
  const day = new Date(refDate).toDateString();
  const mk = (a, b) => {
    const ta = [...a].sort().join(",");
    const tb = [...b].sort().join(",");
    return ta < tb ? ta + "|" + tb : tb + "|" + ta;
  };
  const k = mk(idsA, idsB);
  const prior = state.matches.filter((m) =>
    new Date(m.created_at).toDateString() === day && mk(m.team_a, m.team_b) === k
  ).length;
  return prior >= 2 ? 0.5 : 1;
}

function scorePairing(A, B, maps, opts = {}) {
  const { requireNew = true, balanceWeight = 0.1, activityWeight = 1 } = opts;
  const { games, faced, teamed, rank } = maps;
  // Sinergia di ruoli: SOLO un rompi-pareggi, mai un vincolo. Nessuna
  // coppia e' vietata o penalizzata: due attaccanti e due difensori
  // valgono uguale. A parita' di tutto il resto si preferiscono le coppie
  // che si incastrano, con un filo di vantaggio per l'ibrido che si
  // adatta a chiunque (dichiararsi ibrido non deve mai essere un malus).
  const synergy = (T) => {
    const r = T.map(roleOf);
    const ib = r.filter((x) => x === "ibrido").length;
    if (ib === 2) return 3;    // due ibridi
    if (ib === 1) return 2.5;  // ibrido + specialista
    if (r.includes("attaccante") && r.includes("difensore")) return 2; // coppia classica
    return 0; // due attaccanti o due difensori: legittimi, stesso peso, nessun malus
  };
  const compl = synergy(A) + synergy(B);
  const cross = [[A[0], B[0]], [A[0], B[1]], [A[1], B[0]], [A[1], B[1]]];
  const newFaced = cross.filter(([x, y]) => !faced[pairKey(x.id, y.id)]).length;
  // rompi-pareggi: sfide mai giocate tra ELO vicini valgono di piu',
  // soprattutto in cima alla classifica (ma anche in fondo contano)
  let tieBreak = 0;
  for (const [x, y] of cross) {
    if (faced[pairKey(x.id, y.id)]) continue;
    const prox = Math.max(0, 1 - Math.abs(x.elo - y.elo) / 60);
    const height = 2 - ((rank[x.id] ?? 0.5) + (rank[y.id] ?? 0.5)) / 2;
    tieBreak += prox * height * 12;
  }
  const newTeams =
    (teamed[pairKey(A[0].id, A[1].id)] ? 0 : 1) +
    (teamed[pairKey(B[0].id, B[1].id)] ? 0 : 1);
  if (requireNew && newFaced === 0 && newTeams === 0) return null;
  const habit =
    (teamed[pairKey(A[0].id, A[1].id)] ?? 0) +
    (teamed[pairKey(B[0].id, B[1].id)] ?? 0);
  const activity = [...A, ...B].reduce((s, p) => s + (games[p.id] ?? 0), 0);
  const r2 = (a, b) => (a.elo + b.elo) / 2 - HANDICAP * Math.abs(a.elo - b.elo);
  const gap = Math.abs(r2(A[0], A[1]) - r2(B[0], B[1]));
  const score =
    newFaced * 30 + newTeams * 20 + compl
    + tieBreak
    - Math.min(habit, 10) * 6
    + Math.min(activity, 40) * activityWeight
    - gap * balanceWeight;
  return { A, B, newFaced, newTeams, gap, score };
}

// Le due coppie migliori tra i presenti: equilibrio prima di tutto,
// precedenza a chi ha giocato meno, ruoli usati solo come rompi-pareggi.
function bestLineup(ids) {
  const ps = ids.map(byId).filter(Boolean);
  if (ps.length < 4) return null;
  const maps = historyMaps();
  let best = null;
  for (let i = 0; i < ps.length; i++)
    for (let j = i + 1; j < ps.length; j++)
      for (let k = j + 1; k < ps.length; k++)
        for (let l = k + 1; l < ps.length; l++) {
          const q = [ps[i], ps[j], ps[k], ps[l]];
          for (const [[a1, a2], [b1, b2]] of PAIRINGS) {
            const c = scorePairing([q[a1], q[a2]], [q[b1], q[b2]], maps,
              { requireNew: false, balanceWeight: 0.6, activityWeight: -0.6 });
            if (c && (!best || c.score > best.score)) best = c;
          }
        }
  return best;
}

// Requisiti per comparire in classifica (stagione corrente).
const QUAL = { games: 10, opps: 6, mates: 3 };
function qualification(p) {
  const sid = activeSeason()?.id;
  const opps = new Set(), mates = new Set();
  for (const m of state.matches) {
    if (sid && m.season_id !== sid) continue;
    const inA = m.team_a.includes(p.id), inB = m.team_b.includes(p.id);
    if (!inA && !inB) continue;
    for (const o of (inA ? m.team_b : m.team_a)) opps.add(o);
    for (const mt of (inA ? m.team_a : m.team_b)) if (mt !== p.id) mates.add(mt);
  }
  const games = p.wins + p.losses;
  return {
    games, opps: opps.size, mates: mates.size,
    ok: games >= QUAL.games && opps.size >= QUAL.opps && mates.size >= QUAL.mates,
  };
}

// ---------- Premi di fine stagione ----------
function computeAwards(all) {
  const streakCur = {}, streakBest = {}, startElo = {}, games = {}, winsOf = {};
  const opps = {}, mates = {};
  const pairs = {};
  for (const m of all) {
    const winners = m.winners ?? [];
    for (const id of [...m.team_a, ...m.team_b]) {
      games[id] = (games[id] ?? 0) + 1;
      if (m.pre && m.pre[id] != null && !(id in startElo)) startElo[id] = m.pre[id];
      const own = m.team_a.includes(id) ? m.team_a : m.team_b;
      const other = m.team_a.includes(id) ? m.team_b : m.team_a;
      (opps[id] ??= new Set());
      (mates[id] ??= new Set());
      for (const o of other) opps[id].add(o);
      for (const mt of own) if (mt !== id) mates[id].add(mt);
      if (winners.includes(id)) {
        winsOf[id] = (winsOf[id] ?? 0) + 1;
        streakCur[id] = (streakCur[id] ?? 0) + 1;
        streakBest[id] = Math.max(streakBest[id] ?? 0, streakCur[id]);
      } else streakCur[id] = 0;
    }
    for (const team of [m.team_a, m.team_b]) {
      if (team.length !== 2) continue;
      const other = team === m.team_a ? m.team_b : m.team_a;
      const k = pairKey(team[0], team[1]);
      (pairs[k] ??= { ids: [...team], w: 0, l: 0, opps: new Set() });
      winners.includes(team[0]) ? pairs[k].w++ : pairs[k].l++;
      if (other.length === 2) pairs[k].opps.add(pairKey(other[0], other[1]));
    }
  }
  const top = (obj, val) => {
    let b = null;
    for (const id of Object.keys(obj)) {
      const v = val(id);
      if (v != null && (!b || v > b.v)) b = { id, v };
    }
    return b;
  };
  const st = top(streakBest, (id) => (streakBest[id] >= 3 ? streakBest[id] : null));
  const g = top(games, (id) => games[id]);
  const cl = top(startElo, (id) => (byId(id) ? byId(id).elo - startElo[id] : null));
  // coppia d'oro: stessi requisiti delle "migliori coppie"
  // (almeno PAIR_QUAL.games partite insieme contro PAIR_QUAL.opps coppie avversarie diverse)
  const bp = Object.values(pairs)
    .filter((p) => p.w + p.l >= PAIR_QUAL.games && p.opps.size >= PAIR_QUAL.opps)
    .sort((a, b) => b.w / (b.w + b.l) - a.w / (a.w + a.l) || b.w - a.w)[0] ?? null;
  // miglior win rate tra i CLASSIFICATI (stessi requisiti della classifica)
  let wr = null;
  for (const id of Object.keys(games)) {
    if (games[id] < QUAL.games) continue;
    if ((opps[id]?.size ?? 0) < QUAL.opps || (mates[id]?.size ?? 0) < QUAL.mates) continue;
    const w = winsOf[id] ?? 0;
    const rate = w / games[id];
    if (!wr || rate > wr.rate || (rate === wr.rate && w > wr.w)) {
      wr = { id, rate, w, l: games[id] - w };
    }
  }
  const awards = {};
  if (wr) awards.winrate = { name: nameOf(wr.id), pct: Math.round(wr.rate * 100), w: wr.w, l: wr.l };
  if (st) awards.streak = { name: nameOf(st.id), n: st.v };
  if (g) awards.games = { name: nameOf(g.id), n: g.v };
  if (cl && cl.v > 0) awards.climber = { name: nameOf(cl.id), delta: Math.round(cl.v) };
  if (bp) awards.pair = { names: bp.ids.map(nameOf).join(" + "), w: bp.w, l: bp.l };
  return awards;
}

// ---------- Ricalcolo stagione ----------
// Rigioca tutte le partite confermate della stagione in ordine cronologico
// e riscrive delta, pre e rating. Il rating di partenza di ciascuno e' il
// "pre" della sua prima partita di stagione.
async function recalcSeason() {
  const season = activeSeason();
  if (!season) return;
  const { data: all, error } = await sb.from("matches").select("*")
    .eq("season_id", season.id).eq("status", "confirmed")
    .order("confirmed_at", { ascending: true });
  if (error || !all) { toast("Errore nel caricamento delle partite", false); return; }

  const elo = {}, wins = {}, losses = {};
  for (const m of all)
    for (const id of Object.keys(m.pre ?? {}))
      if (!(id in elo)) elo[id] = m.pre[id];
  for (const p of state.players) if (!(p.id in elo)) elo[p.id] = p.elo;

  const dayCount = {};
  const mk = (a, b) => {
    const ta = [...a].sort().join(","), tb = [...b].sort().join(",");
    return ta < tb ? ta + "|" + tb : tb + "|" + ta;
  };
  const updates = [];
  for (const m of all) {
    const ids = [...m.team_a, ...m.team_b];
    if (ids.some((id) => !(id in elo))) continue;
    const tr = (t) => {
      if (t.length === 1) return elo[t[0]];
      const [r1, r2] = t.map((id) => elo[id]);
      return (r1 + r2) / 2 - HANDICAP * Math.abs(r1 - r2);
    };
    const ratingA = tr(m.team_a), ratingB = tr(m.team_b);
    const noScore = m.score_a == null || m.score_b == null;
    const aWins = noScore ? m.winner_side === "A" : m.score_a > m.score_b;
    const wElo = aWins ? ratingA : ratingB, lElo = aWins ? ratingB : ratingA;
    const mv = noScore
      ? NO_SCORE_BASE * (2.2 / ((wElo - lElo) * 0.001 + 2.2))
      : movMultiplier(Math.abs(m.score_a - m.score_b), wElo, lElo);
    const dayKey = mk(m.team_a, m.team_b) + "@" + new Date(m.created_at).toDateString();
    const prior = dayCount[dayKey] ?? 0;
    dayCount[dayKey] = prior + 1;
    const repF = prior >= 2 ? 0.5 : 1;
    const boost = m.boost ?? (m.boosted ? 1.25 : 1);
    const expA = expectedScore(ratingA, ratingB);
    const totalA = K * mv * ((aWins ? 1 : 0) - expA) * m.team_a.length * repF * boost;
    const deltas = {}, pre = {};
    for (const id of ids) pre[id] = elo[id];
    const assign = (team, total, winning) => {
      if (team.length === 1) { deltas[team[0]] = Math.round(total); return; }
      const [i, j] = team;
      const share = winning ? elo[j] / (elo[i] + elo[j]) : elo[i] / (elo[i] + elo[j]);
      deltas[i] = Math.round(total * share);
      deltas[j] = Math.round(total * (1 - share));
    };
    assign(m.team_a, totalA, aWins);
    assign(m.team_b, -totalA, !aWins);
    const winners = aWins ? m.team_a : m.team_b;
    for (const id of ids) {
      elo[id] += deltas[id];
      if (winners.includes(id)) wins[id] = (wins[id] ?? 0) + 1;
      else losses[id] = (losses[id] ?? 0) + 1;
    }
    updates.push({ id: m.id, deltas, pre, winners });
  }

  for (let i = 0; i < updates.length; i += 20) {
    const res = await Promise.all(updates.slice(i, i + 20).map((u) =>
      sb.from("matches").update({ deltas: u.deltas, pre: u.pre, winners: u.winners }).eq("id", u.id)));
    if (res.some((r) => r.error)) { toast("Errore nel ricalcolo (partite)", false); return; }
  }
  const pres = await Promise.all(state.players.map((p) =>
    sb.from("players").update({
      elo: Math.round(elo[p.id] ?? p.elo),
      wins: wins[p.id] ?? 0,
      losses: losses[p.id] ?? 0,
    }).eq("id", p.id)));
  if (pres.some((r) => r.error)) { toast("Errore nel ricalcolo (giocatori)", false); return; }
  toast(`Stagione ricalcolata: ${updates.length} partite rigiocate`);
}

// ---------- Backup ----------
async function fetchAll(table) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from(table).select("*").range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

async function downloadBackup() {
  try {
    const tables = ["players", "seasons", "season_results", "matches", "tournaments", "player_requests"];
    const dump = { exported_at: new Date().toISOString() };
    for (const tb of tables) dump[tb] = await fetchAll(tb);
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `calcetto-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast("Backup scaricato");
  } catch {

  }
}

// ---------- Sfide dirette ----------
// Lo stato "saldata" non e' salvato: una sfida risulta saldata se, dopo il
// lancio, esiste una partita confermata coi due su sponde opposte.
// una sfida puo' essere 1v1 (from_id vs to_id) o 2v2 (from_id+from2_id vs to_id+to2_id)
function challengeSides(c) {
  return {
    from: [c.from_id, c.from2_id].filter(Boolean),
    to: [c.to_id, c.to2_id].filter(Boolean),
  };
}

function challengeStatus(c) {
  const t0 = new Date(c.created_at);
  const { from, to } = challengeSides(c);
  for (const m of state.matches) {
    if (new Date(m.confirmed_at ?? m.created_at) <= t0) continue;
    const inA = (ids) => ids.every((id) => m.team_a.includes(id));
    const inB = (ids) => ids.every((id) => m.team_b.includes(id));
    if ((inA(from) && inB(to)) || (inB(from) && inA(to))) return { done: true, m };
  }
  return { done: false, m: null };
}

// ---------- Inattivita' (solo etichetta, nessun effetto su ELO o rank) ----------
function lastPlayedOf(pid) {
  for (const m of state.matches)
    if (m.team_a.includes(pid) || m.team_b.includes(pid))
      return new Date(m.created_at).getTime();
  return null;
}

// ---------- Riepilogo della serata ----------
function buildDayRecap() {
  const today = new Date().toDateString();
  const ms = state.matches.filter((m) => new Date(m.created_at).toDateString() === today);
  if (!ms.length) return { html: "", text: "" };
  const gained = {};
  for (const m of ms)
    for (const id of Object.keys(m.deltas ?? {}))
      gained[id] = (gained[id] ?? 0) + m.deltas[id];
  const entries = Object.entries(gained).sort((a, b) => b[1] - a[1]);
  const best = entries[0], worst = entries[entries.length - 1];
  let upset = null;
  for (const m of ms) {
    if (!m.pre) continue;
    const avg = (ids) => ids.reduce((s, id) => s + (m.pre[id] ?? 1000), 0) / ids.length;
    const aWon = (m.winners ?? []).includes(m.team_a[0]);
    const exp = expectedScore(avg(aWon ? m.team_a : m.team_b), avg(aWon ? m.team_b : m.team_a));
    if (!upset || exp < upset.exp) upset = { exp, m };
  }
  let widest = null;
  for (const m of ms) if (m.score_a != null) {
    const diff = Math.abs(m.score_a - m.score_b);
    if (!widest || diff > widest.diff) widest = { diff, m };
  }
  const mLine = (m) => `${m.team_a.map(nameOf).join("+")} ${m.score_a ?? "V"}–${m.score_b ?? "S"} ${m.team_b.map(nameOf).join("+")}`;
  const lines = [];
  if (best && best[1] > 0) lines.push(`In palla: ${nameOf(best[0])} +${best[1]}`);
  if (worst && worst[1] < 0) lines.push(`Serata no: ${nameOf(worst[0])} ${worst[1]}`);
  if (upset && upset.exp < 0.45) lines.push(`Sorpresa: ${mLine(upset.m)} (${Math.round(upset.exp * 100)}% di attesa)`);
  if (widest && widest.diff >= 5) lines.push(`Mano pesante: ${mLine(widest.m)}`);
  const text = [`Serata di oggi: ${ms.length} partite`, ...lines].join("\n");
  const html = `<div class="info-card" style="margin-bottom:12px">
    <h3>LA SERATA DI OGGI</h3>
    <p class="meta">${ms.length} partite registrate oggi.</p>
    ${lines.map((l) => `<p class="meta" style="margin-top:4px">${esc(l)}</p>`).join("")}
    <button class="close-btn" data-copyrecap="1">Copia riepilogo</button>
  </div>`;
  return { html, text };
}

// ---------- Grafico di stagione condiviso ----------
function seasonChartHTML(ranked) {
  const sid = activeSeason()?.id;
  if (!sid || ranked.length < 2) return "";
  const ms = state.matches.filter((m) => m.season_id === sid && m.pre).slice().reverse();
  if (ms.length < 3) return "";
  const PALETTE = ["#E8B341", "#7CD9A0", "#F08A80", "#7FA8F0", "#D9A0F0", "#F0E68C", "#80E8E0", "#F0A050", "#B0F080", "#E080B0"];
  const shown = ranked.slice(0, 10);
  const series = new Map(shown.map((p) => [p.id, []]));
  ms.forEach((m, i) => {
    for (const id of [...m.team_a, ...m.team_b]) {
      const arr = series.get(id);
      if (!arr || m.pre[id] == null) continue;
      if (!arr.length) arr.push([Math.max(0, i - 1), m.pre[id]]);
      arr.push([i, m.pre[id] + (m.deltas?.[id] ?? 0)]);
    }
  });
  let min = Infinity, max = -Infinity;
  for (const arr of series.values())
    for (const [, v] of arr) { min = Math.min(min, v); max = Math.max(max, v); }
  if (!isFinite(min)) return "";
  const span = Math.max(max - min, 20);
  const W = 480, H = 200, PAD = 8;
  const lastX = ms.length - 1 || 1;
  const x = (i) => PAD + (i / lastX) * (W - 2 * PAD);
  const y = (v) => H - PAD - ((v - min) / span) * (H - 2 * PAD);
  let svg = "", legend = "";
  shown.forEach((p, pi) => {
    const arr = series.get(p.id);
    if (!arr || arr.length < 2) return;
    const pts = arr.map(([i, v]) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const col = PALETTE[pi % PALETTE.length];
    svg += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>`;
    legend += `<span class="chip" style="border-color:${col};color:${col}">${esc(p.name)}</span>`;
  });
  if (!svg) return "";
  return `<div class="info-card" style="margin-top:18px">
    <h3>ANDAMENTO STAGIONE</h3>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${svg}</svg>
    <div class="meta" style="display:flex;justify-content:space-between;margin-bottom:6px"><span>min ${Math.round(min)}</span><span>max ${Math.round(max)}</span></div>
    <div>${legend}</div>
  </div>`;
}

// ---------- Record di sempre (scheda Numeri) ----------
async function loadNumeri() {
  setLoading(true);
  try {
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from("matches").select("*").eq("status", "confirmed")
        .order("confirmed_at", { ascending: true }).range(from, from + 999);
      if (error) { toast("Errore nel caricamento dei record", false); return; }
      all.push(...data);
      if (data.length < 1000) break;
    }
    state.numeri = computeNumeri(all);
    render();
  } finally {
    setLoading(false);
  }
}

function computeNumeri(all) {
  let totGol = 0, cappTot = 0;
  const streakCur = {}, streakBest = {}, rival = {}, byDay = {};
  const capp = {}, cappSub = {}, pg = {}, pairs = {};
  for (const m of all) {
    const winners = m.winners ?? [];
    if (m.score_a != null) {
      totGol += m.score_a + m.score_b;
      if (Math.min(m.score_a, m.score_b) === 0 && Math.max(m.score_a, m.score_b) >= 8) {
        cappTot++;
        for (const id of winners) capp[id] = (capp[id] ?? 0) + 1;
        for (const id of [...m.team_a, ...m.team_b])
          if (!winners.includes(id)) cappSub[id] = (cappSub[id] ?? 0) + 1;
      }
    }
    const day = new Date(m.created_at).toDateString();
    byDay[day] = (byDay[day] ?? 0) + 1;
    for (const a of m.team_a) for (const b of m.team_b) {
      const k = pairKey(a, b);
      rival[k] = (rival[k] ?? 0) + 1;
    }
    for (const team of [m.team_a, m.team_b]) if (team.length === 2) {
      const other = team === m.team_a ? m.team_b : m.team_a;
      const k = pairKey(team[0], team[1]);
      (pairs[k] ??= { ids: [...team], w: 0, l: 0, opps: new Set() });
      winners.includes(team[0]) ? pairs[k].w++ : pairs[k].l++;
      if (other.length === 2) pairs[k].opps.add(pairKey(other[0], other[1]));
    }
    for (const id of [...m.team_a, ...m.team_b]) {
      (pg[id] ??= { g: 0, w: 0 });
      pg[id].g++;
      if (winners.includes(id)) {
        pg[id].w++;
        streakCur[id] = (streakCur[id] ?? 0) + 1;
        streakBest[id] = Math.max(streakBest[id] ?? 0, streakCur[id]);
      } else streakCur[id] = 0;
    }
  }
  const topOf = (obj) => {
    let b = null;
    for (const k of Object.keys(obj)) if (!b || obj[k] > obj[b]) b = k;
    return b;
  };
  const st = topOf(streakBest), rv = topOf(rival), dy = topOf(byDay);
  // coppia piu' rodata (piu' partite insieme, di sempre)
  let mate = null;
  for (const p of Object.values(pairs)) {
    const n = p.w + p.l;
    if (!mate || n > mate.n) mate = { ids: p.ids, n };
  }
  // migliori coppie di sempre: TUTTE quelle qualificate
  // (almeno PAIR_QUAL.games partite insieme contro PAIR_QUAL.opps coppie avversarie diverse)
  const pairsBest = Object.values(pairs)
    .filter((p) => p.w + p.l >= PAIR_QUAL.games && p.opps.size >= PAIR_QUAL.opps)
    .sort((a, b) => b.w / (b.w + b.l) - a.w / (a.w + a.l) || b.w - a.w)
    .map(({ ids, w, l }) => ({ ids, w, l }));
  // winrate carriera piu' alto tra chi ha almeno 100 partite
  let wrBest = null;
  for (const [id, s] of Object.entries(pg)) {
    if (s.g < 100) continue;
    const pct = s.w / s.g;
    if (!wrBest || pct > wrBest.pct) wrBest = { id, g: s.g, w: s.w, pct };
  }
  return {
    tot: all.length, totGol, cappTot, capp, cappSub,
    streak: st ? { id: st, n: streakBest[st] } : null,
    rival: rv ? { ids: rv.split("|"), n: rival[rv] } : null,
    mate,
    day: dy ? { day: dy, n: byDay[dy] } : null,
    pairsBest,
    wrBest,
  };
}

// ---------- Finale a 4 (campione di stagione) ----------
// La stagione regolare serve a QUALIFICARSI: a stagione chiusa i primi 4
// dello snapshot giocano 3 partite a coppie rotanti (tutte le combinazioni).
// Campione = piu' VITTORIE nelle 3 partite; a parita' differenza reti,
// poi spareggio 1v1. I gol totali NON sono un criterio (solo mostrati).
// Le partite NON toccano l'ELO e non entrano nello storico:
// vivono nel bracket di un torneo con format "finale4" (teams vuoto).
const F4_PAIRINGS = [
  [[0, 3], [1, 2]],
  [[0, 2], [1, 3]],
  [[0, 1], [2, 3]],
];

function finaleStats(t) {
  const br = t.bracket;
  const stats = br.players.map((id) => ({ id, goals: 0, wins: 0, diff: 0 }));
  let played = 0;
  for (const m of br.matches) {
    if (!m.score) continue;
    played++;
    const [sa, sbv] = m.score;
    for (const pi of m.a) { stats[pi].goals += sa; stats[pi].diff += sa - sbv; if (sa > sbv) stats[pi].wins++; }
    for (const pi of m.b) { stats[pi].goals += sbv; stats[pi].diff += sbv - sa; if (sbv > sa) stats[pi].wins++; }
  }
  const order = [...stats].sort((x, y) => y.wins - x.wins || y.diff - x.diff || y.goals - x.goals);
  return { stats, order, played, total: br.matches.length };
}

function finaleChampion(t) {
  const { order, played, total } = finaleStats(t);
  if (played < total) return { status: "playing" };
  const [a, b] = order;
  const tied = a.wins === b.wins && a.diff === b.diff;
  if (!tied) return { status: "done", id: a.id, wins: a.wins, diff: a.diff };
  const tb = t.bracket.tiebreak;
  if (tb?.score) {
    const winId = tb.score[0] > tb.score[1] ? tb.a : tb.b;
    const ws = order.find((s) => s.id === winId);
    return { status: "done", id: winId, wins: ws?.wins ?? 0, diff: ws?.diff ?? 0 };
  }
  return { status: "tiebreak", ids: [a.id, b.id] };
}

async function createFinale(sid) {
  const res = state.results[sid] ?? [];
  const excl = new Set(state.f4Excl);
  const finalists = res
    .filter((r) => !excl.has(r.player_id) && byId(r.player_id))
    .slice(0, 4)
    .map((r) => r.player_id);
  if (finalists.length < 4) { toast("Servono 4 giocatori disponibili in classifica", false); return; }
  const bracket = {
    players: finalists,
    matches: F4_PAIRINGS.map(([a, b]) => ({ a, b, score: null })),
    tiebreak: null,
  };
  const s = seasonById(sid);
  const ins = await sb.from("tournaments").insert({
    name: `Finale ${s?.name ?? ""}`.trim(),
    season_id: sid,
    teams: [],
    bracket,
    status: "open",
    rated: false,
    format: "finale4",
  });
  if (ins.error) { toast("Errore nella creazione della finale", false); return; }
  state.f4Excl = [];
  toast("Finale a 4 lanciata!");
}

async function recordFinale(t, sec, i, sa, sbv) {
  if (!Number.isInteger(sa) || !Number.isInteger(sbv) || sa < 0 || sbv < 0 || sa === sbv) {
    toast("Punteggio non valido", false); return;
  }
  const br = t.bracket;
  if (sec === "fs") {
    if (!br.tiebreak || br.tiebreak.score) return;
    br.tiebreak.score = [sa, sbv];
  } else {
    const m = br.matches[i];
    if (!m || m.score) return;
    m.score = [sa, sbv];
  }
  let status = "open";
  const ch = finaleChampion(t);
  if (ch.status === "tiebreak" && !br.tiebreak) br.tiebreak = { a: ch.ids[0], b: ch.ids[1], score: null };
  if (ch.status === "done") status = "done";
  const upd = await sb.from("tournaments").update({ bracket: br, status }).eq("id", t.id);
  if (upd.error) { toast("Risultato non salvato: ricarica", false); return; }
  if (status === "done") toast(`👑 ${nameOf(ch.id)} è il campione di stagione!`);
  else if (ch.status === "tiebreak") toast("Parità perfetta: serve lo spareggio 1v1");
  else toast("Risultato registrato");
}

    }
    const badge = count ? `<span class="badge${gold ? " gold" : ""}">${count}</span>` : "";
    return `<button data-tab="${key}" class="${state.tab === key ? "active" : ""}">${label}${badge}</button>`;
  }).join("");
  document.getElementById("season-eyebrow").textContent =
    activeSeason()?.name.toUpperCase() ?? "TRA AMICI";
  const dl = deadlineInfo(activeSeason());
  const dlEl = document.getElementById("season-deadline");
  if (dl) {
    dlEl.textContent = dl.text;
    dlEl.style.color = dl.overdue ? "var(--red-light)" : dl.urgent ? "var(--gold)" : "var(--cream)";
    dlEl.style.display = "";
  } else {
    dlEl.style.display = "none";
  }
}

function formOf(pid, seasonId = null) {
  return state.matches
    .filter((m) =>
      (seasonId == null || m.season_id === seasonId) &&
      (m.team_a.includes(pid) || m.team_b.includes(pid)))
    .slice(0, 5)
    .map((m) => m.winners.includes(pid));
}

function streakOf(form) {
  if (form.length < 2) return "";
  let n = 1;
  while (n < form.length && form[n] === form[0]) n++;
  if (n < 2) return "";
  return `<span class="streak">${n}${form[0] ? "V" : "S"} di fila</span>`;
}

// ---------- Profilo giocatore ----------
function profileData(pid) {
  const ms = (state.profileId === pid && state.profileMatches)
    ? state.profileMatches // storico completo, gia' cronologico
    : state.matches
        .filter((m) => m.team_a.includes(pid) || m.team_b.includes(pid))
        .slice().reverse(); // finestra recente in attesa del caricamento
  const curve = [];
  for (const m of ms) if (m.pre && m.pre[pid] != null) curve.push(m.pre[pid]);
  const p = byId(pid);
  if (p) curve.push(p.elo);
  const vs = {}, mate = {};
  let bestWin = null, bestStreak = 0, cur = 0;
  for (const m of ms) {
    const inA = m.team_a.includes(pid);
    const won = m.winners.includes(pid);
    const opps = inA ? m.team_b : m.team_a;
    const mates = (inA ? m.team_a : m.team_b).filter((x) => x !== pid);
    for (const o of opps) { (vs[o] ??= { w: 0, l: 0 }); won ? vs[o].w++ : vs[o].l++; }
    for (const mt of mates) { (mate[mt] ??= { w: 0, l: 0 }); won ? mate[mt].w++ : mate[mt].l++; }
    if (won) { cur++; bestStreak = Math.max(bestStreak, cur); } else cur = 0;
    if (won && m.score_a != null) {
      const diff = Math.abs(m.score_a - m.score_b);
      if (!bestWin || diff > bestWin.diff) bestWin = { diff, m };
    }
  }
  const pick = (obj, key, min) => {
    let best = null;
    for (const id of Object.keys(obj)) {
      const r = obj[id];
      if (r.w + r.l < min) continue;
      const v = key(r);
      if (!best || v > best.v) best = { id, r, v };
    }
    return best;
  };
  const nem = pick(vs, (r) => r.l * 2 - r.w, 2);
  const vit = pick(vs, (r) => r.w * 2 - r.l, 2);
  return {
    ms, curve, vs, mate,
    nemesi: nem && nem.r.l >= 2 ? nem : null,
    vittima: vit && vit.r.w >= 2 ? vit : null,
    oro: pick(mate, (r) => r.w / (r.w + r.l), 2),
    bestWin, bestStreak,
  };
}

function badgesOf(pid, d) {
  const out = [];
  const cappotti = d.ms.filter((m) => m.winners.includes(pid) && m.score_a != null &&
    Math.min(m.score_a, m.score_b) === 0 && Math.max(m.score_a, m.score_b) >= 8).length;
  if (cappotti) out.push({ icon: "🧹", label: `Cappotto ×${cappotti}` });
  const giganti = d.ms.filter((m) => {
    if (!m.winners.includes(pid) || !m.pre) return false;
    const inA = m.team_a.includes(pid);
    const avg = (ids) => ids.reduce((s, id) => s + (m.pre[id] ?? 1000), 0) / ids.length;
    return avg(inA ? m.team_b : m.team_a) - avg(inA ? m.team_a : m.team_b) >= 120;
  }).length;
  if (giganti) out.push({ icon: "⚔️", label: `Ammazzagiganti ×${giganti}` });
  if (d.bestStreak >= 5) out.push({ icon: "🔥", label: `Striscia da ${d.bestStreak}V` });
  let titoli = 0, cucchiai = 0;
  for (const sid of Object.keys(state.results)) {
    const res = state.results[sid];
    const mine = res.find((r) => r.player_id === pid);
    if (!mine) continue;
    if (mine.rank === 1) titoli++;
    if (mine.rank === res.length && res.length > 1) cucchiai++;
  }
  if (titoli) out.push({ icon: "🥇", label: `Regular season vinte ×${titoli}` });
  const corone = state.tournaments.filter((t) =>
    t.status === "done" && (t.format ?? "elim") === "finale4" &&
    finaleChampion(t).id === pid).length;
  if (corone) out.push({ icon: "👑", label: `Campione di stagione ×${corone}` });
  if (cucchiai) out.push({ icon: "🥄", label: `Cucchiaio di legno ×${cucchiai}` });
  const tornei = state.tournaments.filter((t) => {
    if (t.status !== "done") return false;
    const winIdx = tournamentWinnerIdx(t);
    const team = winIdx == null ? null : t.teams[winIdx];
    return team && (team.p1 === pid || team.p2 === pid);
  }).length;
  if (tornei) out.push({ icon: "🏆", label: `Tornei vinti ×${tornei}` });
  return out;
}

function sparklineSVG(curve) {
  if (curve.length < 2) return "";
  const W = 480, H = 90, PAD = 6;
  const min = Math.min(...curve), max = Math.max(...curve);
  const span = Math.max(max - min, 10);
  const x = (i) => PAD + (i / (curve.length - 1)) * (W - 2 * PAD);
  const y = (v) => H - PAD - ((v - min) / span) * (H - 2 * PAD);
  const pts = curve.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <polyline points="${pts}" fill="none" stroke="#E8B341" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
  <div class="meta" style="display:flex;justify-content:space-between"><span>min ${min}</span><span>max ${max}</span></div>`;
}

function renderProfile(pid) {
  const p = byId(pid);
  if (!p) return `<div class="empty">Giocatore non trovato.</div>`;
  const d = profileData(pid);
  const tot = p.wins + p.losses;
  const pct = tot ? Math.round((p.wins / tot) * 100) : 0;
  const badges = badgesOf(pid, d);
  const chips = badges.length
    ? badges.map((b) => `<span class="chip">${b.icon} ${esc(b.label)}</span>`).join("")
    : `<span class="meta">Ancora nessun trofeo. C'è tempo.</span>`;
  const line = (label, val) => `<p><span style="opacity:0.7">${label}:</span> ${val}</p>`;
  let stats = "";
  if (d.nemesi) stats += line("Nemesi", `<b>${esc(nameOf(d.nemesi.id))}</b> (${d.nemesi.r.l}S–${d.nemesi.r.w}V contro)`);
  if (d.vittima) stats += line("Vittima preferita", `<b>${esc(nameOf(d.vittima.id))}</b> (${d.vittima.r.w}V–${d.vittima.r.l}S contro)`);
  if (d.oro) {
    const wr = Math.round((d.oro.r.w / (d.oro.r.w + d.oro.r.l)) * 100);
    stats += line("Compagno d'oro", `<b>${esc(nameOf(d.oro.id))}</b> (${wr}% di vittorie insieme)`);
  }
  if (d.bestWin) stats += line("Miglior vittoria", `<b>${Math.max(d.bestWin.m.score_a, d.bestWin.m.score_b)}–${Math.min(d.bestWin.m.score_a, d.bestWin.m.score_b)}</b> il ${fmtDate(d.bestWin.m.created_at, false)}`);
  if (d.bestStreak >= 2) stats += line("Miglior striscia", `<b>${d.bestStreak} vittorie</b> di fila`);
  if (!stats) stats = `<p class="meta">Servono un po' di partite per le statistiche.</p>`;

  let h2hHTML = "";
  if (state.h2hId && byId(state.h2hId)) {
    const v = d.vs[state.h2hId], mte = d.mate[state.h2hId];
    const parts = [];
    if (v) parts.push(`Contro: <b>${v.w}V–${v.l}S</b>`);
    if (mte) parts.push(`Insieme: <b>${mte.w}V–${mte.l}S</b>`);
    h2hHTML = parts.length
      ? `<p style="margin-top:10px">${parts.join(" · ")}</p>`
      : `<p class="meta" style="margin-top:10px">Mai incrociati.</p>`;
  }

  return `
    <button class="undo" id="profile-back">← Torna alla classifica</button>
    <div class="info-card">
      <h3>${esc(p.name).toUpperCase()}</h3>
      <p style="font-family:var(--font-display);font-size:30px;margin:4px 0">${p.elo}</p>
      <p class="meta">${ROLE_LABEL[roleOf(p)]} · stagione: ${p.wins}V – ${p.losses}S${tot ? ` (${pct}%)` : ""} · ${d.ms.length} partite ${state.profileMatches ? "in totale" : "recenti"}</p>
      ${state.profileMatches ? "" : `<p class="meta">carico lo storico completo…</p>`}
    </div>
    ${d.curve.length >= 2 ? `<div class="info-card"><h3>ANDAMENTO ELO</h3>${sparklineSVG(d.curve)}</div>` : ""}
    <div class="info-card"><h3>BACHECA</h3>${chips}</div>
    <div class="info-card"><h3>STATISTICHE</h3>${stats}</div>
    <div class="info-card"><h3>TESTA A TESTA</h3>
      <select data-h2h="1" style="width:100%;padding:9px 8px;border:none;border-radius:7px;background:var(--cream);color:#1c1c1c;font-size:14px">
        <option value="">— scegli un giocatore —</option>
        ${[...state.players].sort(byName).filter((x) => x.id !== pid).map((x) =>
          `<option value="${x.id}" ${state.h2hId === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}
      </select>
      ${h2hHTML}
    </div>
    <div class="section-label" style="margin-top:22px">LE SUE PARTITE</div>
    ${[...d.ms].reverse().slice(0, 20).map((m) =>
      matchRowHTML(m, { showSeason: state.seasons.length > 1 })).join("")
      || `<div class="empty">Nessuna partita recente.</div>`}
    ${d.ms.length > 20 ? `<div class="foot-note">Mostrate le ultime 20 di ${d.ms.length} partite.</div>` : ""}`;
}

function render() {
  if (TV) state.tab = "classifica";
  renderNav();
  const app = document.getElementById("app");
  const { players, matches, pending, tab } = state;
  const season = activeSeason();

  // ---------- CLASSIFICA ----------
  if (tab === "classifica") {
    if (state.profileId) {
      app.innerHTML = renderProfile(state.profileId);
      return;
    }
    if (players.length === 0) {
      app.innerHTML = `<div class="empty">Nessun giocatore in rosa. Aggiungi i primi nella scheda Giocatori.</div>`;
      return;
    }
    const sorted = [...players].sort((a, b) => b.elo - a.elo);
    const quals = new Map(sorted.map((p) => [p.id, qualification(p)]));
    const ranked = sorted.filter((p) => quals.get(p.id).ok);
    const unranked = sorted.filter((p) => !quals.get(p.id).ok);

    const rowHTML = (p, i, q) => {
      const tot = p.wins + p.losses;
      const pct = tot ? Math.round((p.wins / tot) * 100) : 0;
      const form = formOf(p.id, season?.id ?? null);
      const dots = form.map((w) => `<span class="dot ${w ? "w" : "l"}"></span>`).join("");
      const streak = streakOf(form);
      const lastTs = lastPlayedOf(p.id);
      const inactiveDays = lastTs ? Math.floor((Date.now() - lastTs) / 86400000) : null;
      const inactive = (p.wins + p.losses) > 0 && (lastTs == null || inactiveDays >= INACTIVE_DAYS);
      const missing = q
        ? `<div class="meta">${q.games}/${QUAL.games} partite · ${q.opps}/${QUAL.opps} avversari · ${q.mates}/${QUAL.mates} compagni</div>`
        : "";
      return `<div class="row ${i === 0 ? "first" : ""}" data-profile="${p.id}" style="cursor:pointer${q ? ";opacity:0.7" : ""}">
        <div class="rank ${i === 0 ? "gold" : ""}">${q ? "–" : i + 1}</div>
        <div style="flex:1">
          <div class="player-name">${esc(p.name)}</div>
          <div class="meta">${p.wins}V – ${p.losses}S${tot ? ` · ${pct}%` : ""}${streak ? " · " + streak : ""}${inactive ? ` · 💤 inattivo${inactiveDays != null ? ` da ${inactiveDays}g` : ""}` : ""}</div>
          ${missing}
          ${form.length ? `<div style="margin-top:4px">${dots}</div>` : ""}
        </div>
        <div class="elo">${q ? "~" : ""}${p.elo}</div>
      </div>`;
    };

    const signupTs = state.tournaments.filter((x) => x.status === "signup");
    const signupNote = signupTs.length
      ? `<div class="signup-note" data-tab="tornei">📋 ${signupTs.length === 1
          ? `Iscrizioni aperte per "${esc(signupTs[0].name)}"`
          : `${signupTs.length} tornei con iscrizioni aperte`} · tocca per iscriverti</div>`
      : "";
    const finaleNote = `<div class="info-card" style="margin-bottom:12px">
      <h3>COME SI DIVENTA CAMPIONE</h3>
      <p class="meta">La classifica ELO serve a qualificarsi: a fine stagione i <b>primi 4</b> giocano la finale a coppie rotanti, 3 partite con tutte le combinazioni di coppie. Il titolo di <b>campione di stagione</b> si decide con le vittorie nelle 3 partite; a parità conta la differenza reti, poi uno spareggio 1v1.</p>
    </div>`;
    let out = signupNote + finaleNote + ranked.map((p, i) => rowHTML(p, i, null)).join("");
    out += volataHTML(ranked);
    if (!ranked.length)
      out += `<div class="empty">Nessuno si è ancora qualificato: servono ${QUAL.games} partite, ${QUAL.opps} avversari e ${QUAL.mates} compagni diversi.</div>`;
    if (unranked.length) {
      out += `<div class="section-label" style="margin-top:18px">NON CLASSIFICATI</div>
        <div class="meta" style="margin-bottom:8px">ELO provvisorio: per la classifica servono ${QUAL.games} partite, ${QUAL.opps} avversari e ${QUAL.mates} compagni diversi nella stagione.</div>`;
      out += unranked.map((p) => rowHTML(p, -1, quals.get(p.id))).join("");
    }

    out += seasonChartHTML(ranked);

    app.innerHTML = out;
    return;
  }

  // ---------- PARTITA ----------
  if (tab === "partita") {
    if (!season) {
      app.innerHTML = `<div class="empty">Nessuna stagione attiva: ${isAdmin() ? "creane una dalla scheda Stagioni." : "chiedi a un admin di aprirne una."}</div>`;
      return;
    }
    if (players.length < 2) {
      app.innerHTML = `<div class="empty">Servono almeno 2 giocatori in rosa.</div>`;
      return;
    }
    const size = state.mode === "1v1" ? 1 : 2;
    const selected = [...state.teamA.slice(0, size), ...state.teamB.slice(0, size)].filter(Boolean);
    const playersOk =
      selected.length === size * 2 && new Set(selected).size === size * 2;
    const valid = playersOk &&
      (state.noScore ? !!state.winnerSide : state.scoreA !== state.scoreB);

    const teamCard = (team, cls, label, score, side) => {
      const taken = new Set([...state.teamA, ...state.teamB].filter(Boolean));
      const selects = Array.from({ length: size }).map((_, i) => {
        const opts = [...players].sort(byName).map((p) => {
          const dis = taken.has(p.id) && team[i] !== p.id ? "disabled" : "";
          const sel = team[i] === p.id ? "selected" : "";
          return `<option value="${p.id}" ${dis} ${sel}>${esc(p.name)} (${p.elo})</option>`;
        }).join("");
        return `<select data-team="${cls}" data-slot="${i}">
          <option value="">— giocatore —</option>${opts}
        </select>`;
      }).join("");
      const resultCtrl = state.noScore
        ? `<button class="win-btn ${state.winnerSide === side ? "active" : ""}" data-winner="${side}">
            ${state.winnerSide === side ? "🏆 VITTORIA" : "Vittoria"}
          </button>`
        : `<div class="score-grid">
            ${Array.from({ length: 11 }, (_, n) =>
              `<button data-score="${side}" data-val="${n}" class="${score === n ? "sel" : ""}">${n}</button>`).join("")}
            <input type="number" inputmode="numeric" min="0" placeholder="10+"
              data-scorefree="${side}" class="${score > 10 ? "sel" : ""}"
              value="${score > 10 ? score : ""}">
          </div>`;
      return `<div class="team-card ${cls}">
        <div class="team-label">${label}</div>
        ${selects}
        ${resultCtrl}
      </div>`;
    };

    const suggNow = currentSuggestion();
    const isSugg = !!suggNow;
    const boostVal = suggNow?.boost ?? 1;
    let forecast = "";
    if (playersOk) {
      const fIdsA = state.teamA.slice(0, size);
      const fIdsB = state.teamB.slice(0, size);
      const pA = Math.round(expectedScore(teamRating(fIdsA), teamRating(fIdsB)) * 100);
      let deltaLine = "";
      const outcomeKnown = state.noScore ? !!state.winnerSide : state.scoreA !== state.scoreB;
      if (outcomeKnown) {
        const { deltas } = computeMatch(
          fIdsA, fIdsB,
          state.noScore ? null : state.scoreA,
          state.noScore ? null : state.scoreB,
          state.noScore ? state.winnerSide : null,
          null, boostVal
        );
        deltaLine = `<div class="meta" style="margin-top:4px">Se va così: ` +
          [...fIdsA, ...fIdsB].map((id) =>
            `${esc(nameOf(id))} ${deltas[id] >= 0 ? "+" : ""}${deltas[id]}`).join(" · ") +
          `</div>`;
      }
      forecast = `<div class="forecast">
        <span style="color:var(--red-light);font-weight:700">Rossi ${pA}%</span>
        <span style="opacity:0.5"> · </span>
        <span style="color:var(--blue-light);font-weight:700">Blu ${100 - pA}%</span>
        ${isSugg ? `<div style="margin-top:6px"><span class="boost-badge">⭐ CONSIGLIATA · DELTA ×${boostVal}</span></div>` : ""}
        ${deltaLine}
      </div>`;
    }

    let hint;
    if (state.noScore) {
      hint = "Tocca Vittoria sulla squadra che ha vinto.";
    } else if (state.scoreA === state.scoreB && playersOk) {
      hint = "Il pareggio non esiste al balilla: si gioca la palla decisiva.";
    } else if (isAdmin()) {
      hint = "Il divario di gol pesa sul delta: un 10-0 vale molto più di un 10-9.";
    } else {
      hint = "La partita verrà conteggiata dopo la conferma di un admin.";
    }

    const presentSet = new Set(state.present);
    const chips = [...players].sort(byName).map((p) =>
      `<button class="chip ${presentSet.has(p.id) ? "chip-on" : ""}" data-present="${p.id}">${esc(p.name)}</button>`
    ).join("");
    let lineupHTML = "";
    if (state.present.length >= 4) {
      const tableCard = (best, label, boost) => {
        if (!best) return "";
        const pA = Math.round(expectedScore(
          teamRating(best.A.map((p) => p.id)),
          teamRating(best.B.map((p) => p.id))
        ) * 100);
        const hasBonus = boost > 1;
        const noBonusNote = !hasBonus ? " · nessun incrocio nuovo: niente bonus" : "";
        const thresholdNote = "";
        return `<div class="row" style="border:1px solid var(--gold)">
          <div style="flex:1">
            ${label ? `<div class="meta" style="margin-bottom:2px;letter-spacing:0.1em">${label}</div>` : ""}
            <div class="player-name" style="font-size:14px">${esc(best.A[0].name)} + ${esc(best.A[1].name)} <span style="opacity:0.6">vs</span> ${esc(best.B[0].name)} + ${esc(best.B[1].name)}</div>
            <div class="meta">${pA}% – ${100 - pA}%${noBonusNote}${thresholdNote}</div>
            ${hasBonus ? `<div style="margin-top:4px"><span class="boost-badge">⭐ VALE ×${boost}</span></div>` : ""}
          </div>
          <button class="use-btn" data-suggest="${best.A[0].id}|${best.A[1].id}|${best.B[0].id}|${best.B[1].id}" data-boostval="${boost}">Usa</button>
        </div>`;
      };
      const bonusOf = (best) =>
        best && (best.newFaced > 0 || best.newTeams > 0) ? LINEUP_BOOST : 1;

      const t1 = bestLineup(state.present);
      if (state.present.length >= 8 && t1) {
        const used = new Set([...t1.A, ...t1.B].map((p) => p.id));
        const rest = state.present.filter((id) => !used.has(id));
        const t2 = bestLineup(rest);
        lineupHTML = tableCard(t1, "TAVOLO 1", LINEUP_BOOST) + tableCard(t2, "TAVOLO 2", bonusOf(t2));
      } else if (t1) {
        lineupHTML = tableCard(t1, "", bonusOf(t1));
      }
    } else if (state.present.length > 0) {
      lineupHTML = `<div class="meta" style="margin-bottom:8px">Seleziona almeno 4 presenti.</div>`;
    }
    const whoHTML = `<div class="section-label" style="margin-top:26px">CHI C'È OGGI</div>
      <div class="meta" style="margin-bottom:8px">Seleziona i presenti: l'app propone i tavoli migliori per equilibrio e mescolamento. Da 8 presenti, due tavoli con persone distinte.</div>
      <div style="margin-bottom:8px">${chips}</div>
      ${lineupHTML}
      <div class="meta" style="margin-top:8px">ℹ️ I ruoli non vietano nulla e non toccano l'ELO: contano solo qui, come rompi-pareggi tra tavoli quasi equivalenti. A parità di tutto il resto si preferiscono le coppie che si incastrano (attaccante+difensore), con un filo di vantaggio per gli ibridi che si adattano a chiunque. Due attaccanti o due difensori insieme valgono uguale e possono comunque essere proposti.</div>`;

    // sfide dirette
    let sfideHTML = "";
    if (state.challengesOk) {
      const openCh = [], settledCh = [];
      for (const c of state.challenges) {
        const sides = challengeSides(c);
        if ([...sides.from, ...sides.to].some((id) => !byId(id))) continue;
        const st = challengeStatus(c);
        (st.done ? settledCh : openCh).push({ c, st });
      }
      const chOpts = `<option value="">— giocatore —</option>` + [...players].sort(byName).map((p) =>
        `<option value="${p.id}">${esc(p.name)}</option>`).join("");
      const chRow = ({ c, st }) => {
        const sides = challengeSides(c);
        const del = isAdmin() ? `<button class="del-btn" data-delchallenge="${c.id}">✕</button>` : "";
        const res = st.done && st.m
          ? `<div class="meta">saldata: ${st.m.team_a.map(nameOf).map(esc).join("+")} ${st.m.score_a ?? "V"}–${st.m.score_b ?? "S"} ${st.m.team_b.map(nameOf).map(esc).join("+")}</div>`
          : `<div class="meta">lanciata il ${fmtDate(c.created_at, false)} · si salda alla prima partita con le due sponde al completo, una contro l'altra</div>`;
        const verbo = sides.from.length > 1 ? "sfidano" : "sfida";
        return `<div class="row" style="${st.done ? "opacity:0.6" : ""}">
          <div style="flex:1">
            <div class="player-name" style="font-size:14px">${st.done ? "✅" : "🗡"} ${sides.from.map(nameOf).map(esc).join(" + ")} ${verbo} ${sides.to.map(nameOf).map(esc).join(" + ")}</div>
            ${res}
          </div>
          ${del}
        </div>`;
      };
      const chForm = state.ch2
        ? `<div class="pair-row">
            <select id="ch-from">${chOpts}</select>
            <select id="ch-from2">${chOpts}</select>
          </div>
          <div class="meta" style="text-align:center;margin:2px 0">sfidano</div>
          <div class="pair-row">
            <select id="ch-to">${chOpts}</select>
            <select id="ch-to2">${chOpts}</select>
            <button class="use-btn" data-newchallenge="1">Lancia</button>
          </div>`
        : `<div class="pair-row">
            <select id="ch-from">${chOpts}</select>
            <select id="ch-to">${chOpts}</select>
            <button class="use-btn" data-newchallenge="1">Lancia</button>
          </div>`;
      sfideHTML = `<div class="section-label" style="margin-top:26px">SFIDE DIRETTE</div>
        <div class="meta" style="margin-bottom:8px">Lancia una sfida, in singolo o tra coppie fisse: resta in sospeso finché le due sponde non si affrontano al completo. Un conto aperto, sotto gli occhi di tutti.</div>
        <div class="mode-row">
          <button data-ch2="0" class="${!state.ch2 ? "active" : ""}" style="font-size:12px">1 vs 1</button>
          <button data-ch2="1" class="${state.ch2 ? "active" : ""}" style="font-size:12px">2 vs 2</button>
        </div>
        ${chForm}
        ${openCh.map(chRow).join("") || `<div class="meta" style="margin-bottom:6px">Nessuna sfida in sospeso.</div>`}
        ${settledCh.length ? `<div class="meta" style="margin:8px 0 4px;letter-spacing:0.1em">SALDATE DI RECENTE</div>` + settledCh.slice(0, 5).map(chRow).join("") : ""}`;
    }

    app.innerHTML = `
      <div class="mode-row">
