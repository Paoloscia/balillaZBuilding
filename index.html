        <button data-mode="1v1" class="${state.mode === "1v1" ? "active" : ""}">1v1</button>
        <button data-mode="2v2" class="${state.mode === "2v2" ? "active" : ""}">2v2</button>
      </div>
      <div class="mode-row" style="margin-top:-10px">
        <button data-scoremode="score" class="${!state.noScore ? "active" : ""}" style="font-size:12px">Con punteggio</button>
        <button data-scoremode="noscore" class="${state.noScore ? "active" : ""}" style="font-size:12px">Solo chi ha vinto</button>
      </div>
      ${state.noScore ? `<div class="toast err" style="margin-top:-4px">Attenzione: senza punteggio la partita vale ×0.5, la metà di una vittoria di misura</div>` : ""}
      <div class="teams">
        ${teamCard(state.teamA, "red", "ROSSI", state.scoreA, "A")}
        <div class="vs">VS</div>
        ${teamCard(state.teamB, "blue", "BLU", state.scoreB, "B")}
      </div>
      ${forecast}
      <div class="hint">${hint}</div>
      <button class="cta${isSugg ? " cta-boost" : ""}" id="save-match" ${valid && !state.busy ? "" : "disabled"}>
        ${isAdmin() ? "Registra partita" : "Invia partita"}${isSugg ? " · ⭐ ×" + boostVal : ""}
      </button>
      ${whoHTML}
      ${sfideHTML}`;
    return;
  }

  // ---------- STORICO ----------
  if (tab === "storico") {
    const filterRow = state.seasons.length > 1
      ? `<div class="view-row">
          <button data-histseason="all" class="${state.historySeason === "all" ? "active" : ""}">Tutte</button>
          ${state.seasons.filter((s) => s.active || s.ended_at).map((s) =>
            `<button data-histseason="${s.id}" class="${state.historySeason === s.id ? "active" : ""}">${esc(s.name)}${s.active ? "" : " 🔒"}</button>`
          ).join("")}
        </div>`
      : "";

    const playerRow = state.players.length
      ? `<div class="view-row">
          <select data-histplayer="1" style="padding:7px 10px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--cream);font-size:12px">
            <option value="all" style="color:#1c1c1c">Tutti i giocatori</option>
            ${[...state.players].sort(byName).map((p) =>
              `<option value="${p.id}" style="color:#1c1c1c" ${state.historyPlayer === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
          </select>
        </div>`
      : "";
    const inFilter = (m) =>
      (state.historySeason === "all" || m.season_id === state.historySeason) &&
      (state.historyPlayer === "all" || m.team_a.includes(state.historyPlayer) || m.team_b.includes(state.historyPlayer));
    const pend = pending.filter(inFilter);
    const conf = matches.filter(inFilter);
    const showSeason = state.historySeason === "all" && state.seasons.length > 1;

    if (!pend.length && !conf.length) {
      app.innerHTML = `${filterRow}${playerRow}<div class="empty">Nessuna partita qui.</div>`;
      return;
    }
    let html = filterRow + playerRow;
    if (pend.length) {
      html += `<div class="section-label">DA CONFERMARE (${pend.length})</div>`;
      html += pend.map((m) => matchRowHTML(m, { pending: true, actions: isAdmin(), showSeason })).join("");
    }
    if (conf.length) {
      html += `<div class="section-label">PARTITE (${conf.length})</div>`;
      if (isAdmin() && state.matches.length)
        html += `<button class="undo" id="undo">Annulla ultima partita</button>`;
      html += conf.slice(0, state.historyLimit).map((m) => matchRowHTML(m, { showSeason })).join("");
      if (conf.length > state.historyLimit)
        html += `<button class="undo" data-histmore="1" style="margin-top:6px">Mostra altre ${Math.min(50, conf.length - state.historyLimit)} partite</button>`;
    }
    app.innerHTML = html;
    return;
  }

  // ---------- TORNEI ----------
  if (tab === "tornei") {
    let html = "";

    if (isAdmin()) {
      if (!season) {
        html += `<div class="empty">Serve una stagione attiva per creare un torneo.</div>`;
      } else {
        const usedIds = new Set(state.tPairs.flat().filter(Boolean));
        const pairRows = state.tPairs.map((pair, pi) => {
          const sel = (slot) => {
            const opts = [...players].sort(byName).map((p) => {
              const dis = usedIds.has(p.id) && pair[slot] !== p.id ? "disabled" : "";
              const s = pair[slot] === p.id ? "selected" : "";
              return `<option value="${p.id}" ${dis} ${s}>${esc(p.name)} (${p.elo})</option>`;
            }).join("");
            return `<select data-tpair="${pi}" data-tslot="${slot}">
              <option value="">— giocatore —</option>${opts}</select>`;
          };
          const del = state.tPairs.length > 2
            ? `<button class="del-btn" data-tremovepair="${pi}">✕</button>` : "";
          return `<div class="pair-row">${sel(0)}${sel(1)}${del}</div>`;
        }).join("");

        const autoSet = new Set(state.tAutoIds);
        const autoChips = `<div>` + [...players].sort(byName).map((p) =>
          `<button class="chip ${autoSet.has(p.id) ? "chip-on" : ""}" data-tautosel="${p.id}">${esc(p.name)} (${p.elo})</button>`).join("") +
          `</div><div class="meta">${state.tAutoIds.length} selezionati${state.tAutoIds.length >= 4 && state.tAutoIds.length % 2 === 0 ? ` · ${state.tAutoIds.length / 2} coppie` : ""}</div>`;

        html += `
          <div class="auth-box" style="margin-top:0;margin-bottom:18px">
            <div class="meta" style="margin-bottom:4px">Nuovo torneo a coppie: eliminazione, doppia eliminazione (4/8/16 coppie), girone all'italiana o girone con finale tra le prime due.</div>
            <div class="mode-row" style="margin-bottom:0">
              <button data-tformat="elim" class="${state.tFormat === "elim" ? "active" : ""}" style="font-size:11px">Eliminazione</button>
              <button data-tformat="doppia" class="${state.tFormat === "doppia" ? "active" : ""}" style="font-size:11px">Doppia elim.</button>
            </div>
            <div class="mode-row" style="margin-bottom:0">
              <button data-tformat="girone" class="${state.tFormat === "girone" ? "active" : ""}" style="font-size:11px">Girone</button>
              <button data-tformat="gironefinale" class="${state.tFormat === "gironefinale" ? "active" : ""}" style="font-size:11px">Girone + finale</button>
            </div>
            <div class="mode-row" style="margin-bottom:0">
              <button data-trated="1" class="${state.tRated ? "active" : ""}" style="font-size:12px">Vale per l'ELO</button>
              <button data-trated="0" class="${!state.tRated ? "active" : ""}" style="font-size:12px">Solo per la gloria</button>
            </div>
            <div class="mode-row" style="margin-bottom:0">
              <button data-tsignup="0" class="${!state.tSignup ? "active" : ""}" style="font-size:12px">Coppie complete</button>
              <button data-tsignup="1" class="${state.tSignup ? "active" : ""}" style="font-size:12px">Iscrizioni aperte</button>
            </div>
            ${state.tSignup ? "" : `<div class="mode-row" style="margin-bottom:0">
              <button data-tauto="0" class="${!state.tAuto ? "active" : ""}" style="font-size:12px">Coppie scelte</button>
              <button data-tauto="1" class="${state.tAuto ? "active" : ""}" style="font-size:12px">Coppie automatiche</button>
            </div>`}
            ${state.tSignup ? `<div class="meta">Puoi lasciare posti vuoti: li occuperà chi vuole partecipare, poi avvierai tu il torneo.</div>` : ""}
            ${state.tAuto && !state.tSignup ? `<div class="meta">Seleziona i giocatori (numero pari, almeno 4): l'app forma coppie bilanciate accoppiando il più forte col più debole.</div>` : ""}
            <input id="t-name" placeholder="Nome torneo" maxlength="40" value="${esc(state.tName)}">
            ${state.tAuto && !state.tSignup ? autoChips : pairRows}
            ${state.tAuto && !state.tSignup ? "" : `<button class="undo" id="t-addpair" style="margin-bottom:0">+ Aggiungi coppia</button>`}
            <button class="cta" id="create-tournament" style="font-size:14px;padding:11px 0">Crea torneo</button>
          </div>`;
      }
    }

    if (!state.tournaments.length) {
      html += `<div class="empty">Nessun torneo${isAdmin() ? "" : ", per ora"}.</div>`;
      app.innerHTML = html;
      return;
    }


    const notF4 = (t) => (t.format ?? "elim") !== "finale4"; // la finale vive nel tab Stagioni
    const signupT = state.tournaments.filter((t) => t.status === "signup" && notF4(t));
    const openT = state.tournaments.filter((t) => t.status === "open" && notF4(t));
    const doneT = state.tournaments.filter((t) => t.status === "done" && notF4(t));

    if (signupT.length) html += `<div class="section-label">ISCRIZIONI APERTE</div>`;
    for (const t of signupT) {
      const inT = t.teams.flatMap((x) => [x.p1, x.p2]).filter(Boolean);
      const filled = inT.length, total = t.teams.length * 2;
      const opts = [...players].sort(byName)
        .filter((p) => !inT.includes(p.id))
        .map((p) => `<option value="${p.id}">${esc(p.name)} (${p.elo})</option>`).join("");
      const teamRows = t.teams.map((team, ti) => {
        const slotHTML = (key, slot) => {
          if (isAdmin()) {
            const cur = team[key];
            const adminOpts = [...players].sort(byName)
              .filter((p) => !inT.includes(p.id) || p.id === cur)
              .map((p) => `<option value="${p.id}" ${p.id === cur ? "selected" : ""}>${esc(p.name)} (${p.elo})</option>`).join("");
            return `<select data-adminslot="${t.id}|${ti}|${slot}" style="width:100%;margin-top:2px;padding:7px 8px;border:none;border-radius:7px;background:var(--cream);color:#1c1c1c;font-size:13px">
              <option value="">— posto libero —</option>${adminOpts}
            </select>`;
          }
          return team[key]
            ? `<div class="b-team">${esc(nameOf(team[key]))}<span class="b-score" style="font-size:12px;opacity:0.6">✓ confermato</span></div>`
            : `<div class="b-record" style="margin-top:2px">
                <select id="su-${t.id}-${ti}-${slot}" style="flex:1;padding:7px 8px;border:none;border-radius:7px;background:var(--cream);color:#1c1c1c;font-size:13px;min-width:0">
                  <option value="">— posto libero —</option>${opts}
                </select>
                <button data-claim="${t.id}|${ti}|${slot}">Conferma</button>
              </div>`;
        };
        const delPair = isAdmin() && t.teams.length > 2
          ? `<button class="del-btn" data-delpair="${t.id}|${ti}" style="float:right;padding:3px 7px;font-size:12px">✕</button>` : "";
        return `<div class="b-match">
          <div class="meta" style="margin-bottom:2px">COPPIA ${ti + 1}${delPair}</div>
          ${slotHTML("p1", 0)}${slotHTML("p2", 1)}
        </div>`;
      }).join("");
      const addPairBtn = isAdmin()
        ? `<button class="undo" data-addpair="${t.id}" style="margin:6px 0 0">+ Aggiungi coppia</button>` : "";
      const startBtn = isAdmin()
        ? `<button class="cta" data-starttournament="${t.id}" style="font-size:14px;padding:11px 0;margin-top:8px" ${filled === total ? "" : "disabled"}>
            ${filled === total ? "Avvia torneo" : `Avvia torneo (${filled}/${total} posti)`}
          </button>` : "";
      html += `<div class="info-card">
        <h3>${esc(t.name).toUpperCase()}${isAdmin() ? `<button class="del-btn" data-deltournament="${t.id}" title="Elimina" style="float:right">✕</button>` : ""}</h3>
        <p class="meta" style="margin-bottom:6px">${esc(seasonName(t.season_id))} · ${t.teams.length} coppie · ${filled}/${total} posti · ${FMT_LABEL[t.format ?? "elim"]}${t.rated === false ? " · non vale per l'ELO" : ""}</p>
        <p class="meta" style="margin-bottom:8px">Scegli un posto libero e conferma: l'iscrizione non si può più cambiare${isAdmin() ? " (tu da admin puoi modificare tutto)" : ""}.</p>
        ${teamRows}
        ${addPairBtn}
        ${startBtn}
      </div>`;
    }

    if (openT.length) html += `<div class="section-label">IN CORSO</div>`;
    for (const t of openT) {
      const canRecord = isAdmin() && seasonById(t.season_id)?.active;
      const fmt = t.format ?? "elim";

      const matchHTML = (m, sec, r, i) => {
        const teamRow = (idx) => {
          const won = m.winner != null && m.winner === idx;
          const tbd = idx == null;
          const score = m.score
            ? `<span class="b-score">${idx === m.a ? m.score[0] : m.score[1]}</span>` : "";
          return `<div class="b-team ${won ? "winner" : ""} ${tbd ? "tbd" : ""}">
            ${won ? "🏆 " : ""}${esc(teamLabel(t, idx))}${score}
          </div>`;
        };
        const recordUI = canRecord && m.a != null && m.b != null && m.winner == null
          ? `<div class="b-record">
              <input class="ts-input" type="number" min="0" id="ts-${t.id}-${sec}-${r}-${i}-a" placeholder="R">
              <span style="opacity:0.6">–</span>
              <input class="ts-input" type="number" min="0" id="ts-${t.id}-${sec}-${r}-${i}-b" placeholder="B">
              <button data-trecord="${t.id}|${sec}|${r}|${i}">OK</button>
            </div>` : "";
        return `<div class="b-match">${teamRow(m.a)}${teamRow(m.b)}${recordUI}</div>`;
      };

      let bracketHTML = "";
      if (fmt === "girone") {
        bracketHTML = gironeHTML(t, canRecord);
      } else if (fmt === "gironefinale") {
        bracketHTML = gironeHTML(t, canRecord);
        const fin = t.bracket[1]?.[0];
        if (fin) {
          bracketHTML += `<div class="section-label">FINALE</div>`;
          bracketHTML += fin.a == null
            ? `<div class="b-match"><div class="b-team tbd">le prime due del girone, a girone finito</div></div>`
            : matchHTML(fin, "m", 1, 0);
        }
      } else if (fmt === "doppia") {
        const br = t.bracket;
        br.w.forEach((round, r) => {
          bracketHTML += `<div class="b-round"><div class="section-label">VINCENTI · ${roundName(r, br.w.length)}</div>`;
          round.forEach((m, i) => { bracketHTML += matchHTML(m, "w", r, i); });
          bracketHTML += `</div>`;
        });
        br.l.forEach((round, r) => {
          bracketHTML += `<div class="b-round"><div class="section-label">RIPESCAGGIO ${r + 1}</div>`;
          round.forEach((m, i) => { bracketHTML += matchHTML(m, "l", r, i); });
          bracketHTML += `</div>`;
        });
        bracketHTML += `<div class="b-round"><div class="section-label">FINALISSIMA</div>${matchHTML(br.gf[0], "gf", 0, 0)}</div>`;
      } else {
        const rounds = t.bracket;
        const total = rounds.length;
        rounds.forEach((round, r) => {
          bracketHTML += `<div class="b-round"><div class="section-label">${roundName(r, total)}</div>`;
          round.forEach((m, i) => { bracketHTML += matchHTML(m, "m", r, i); });
          bracketHTML += `</div>`;
        });
      }

      html += `<div class="info-card">
        <h3>${esc(t.name).toUpperCase()}${isAdmin() ? `<button class="del-btn" data-deltournament="${t.id}" title="Elimina" style="float:right">✕</button>` : ""}</h3>
        <p class="meta" style="margin-bottom:10px">${esc(seasonName(t.season_id))} · ${fmtDate(t.created_at, false)} · ${t.teams.length} coppie · ${FMT_LABEL[fmt]}${t.rated === false ? " · non vale per l'ELO" : ""}</p>
        ${bracketHTML}
      </div>`;
    }

    if (doneT.length) {
      html += `<div class="section-label" style="margin-top:22px">ALBO TORNEI</div>`;
      for (const t of doneT) {
        const fmt = t.format ?? "elim";
        const winIdx = tournamentWinnerIdx(t);
        let detail;
        const finaleDetail = (fin, label) => {
          const loserIdx = fin.winner === fin.a ? fin.b : fin.a;
          const fs = fin.score
            ? (fin.winner === fin.a ? `${fin.score[0]}–${fin.score[1]}` : `${fin.score[1]}–${fin.score[0]}`)
            : "";
          return `${label}: battuta ${esc(teamLabel(t, loserIdx))}${fs ? " " + fs : ""}`;
        };
        if (fmt === "girone") {
          const st = gironeStandings(t);
          detail = st[1] ? `Girone all'italiana · secondi: ${esc(teamLabel(t, st[1].i))} (${st[1].w}V)` : "Girone all'italiana";
        } else if (fmt === "gironefinale") {
          detail = finaleDetail(t.bracket[1][0], "Girone + finale");
        } else if (fmt === "doppia") {
          detail = finaleDetail(t.bracket.gf[0], "Doppia eliminazione · finalissima");
        } else {
          detail = finaleDetail(t.bracket[t.bracket.length - 1][0], "Finale");
        }
        html += `<div class="info-card">
          <h3>${esc(t.name).toUpperCase()}${isAdmin() ? `<button class="del-btn" data-deltournament="${t.id}" title="Elimina" style="float:right">✕</button>` : ""}</h3>
          <p class="meta" style="margin-bottom:8px">${esc(seasonName(t.season_id))} · ${fmtDate(t.created_at, false)} · ${t.teams.length} coppie${t.rated === false ? " · non valeva per l'ELO" : ""}</p>
          <div class="podium-row">
            <span class="medal">🏆</span>
            <span class="player-name" style="font-size:15px">${esc(teamLabel(t, winIdx))}</span>
          </div>
          <p class="meta" style="margin-top:6px">${detail}</p>
        </div>`;
      }
    }
    app.innerHTML = html;
    return;
  }

  // ---------- STAGIONI ----------
  if (tab === "stagioni") {
    let html = "";

    if (isAdmin()) {
      html += `
        <div class="auth-box" style="margin-top:0;margin-bottom:18px">
          <div class="meta" style="margin-bottom:4px">${season ? "Pianifica la prossima stagione: partirà alla chiusura di quella in corso." : "Crea una stagione: partirà subito."}</div>
          <input id="new-season-name" placeholder="Nome stagione" maxlength="40">
          <div class="meta" style="margin-bottom:-2px">Fine prevista (facoltativa):</div>
          <input id="new-season-end" type="date">
          <button class="cta" id="create-season" style="font-size:14px;padding:11px 0">${season ? "Pianifica stagione" : "Crea e avvia stagione"}</button>
        </div>`;
    }

    if (season) {
      const ranked = [...players].sort((a, b) => b.elo - a.elo);
      const leader = ranked[0];
      const pendCount = pending.filter((m) => m.season_id === season.id).length;
      const dl = deadlineInfo(season);
      html += `<div class="section-label">IN CORSO</div>
        <div class="info-card">
          <h3>${esc(season.name).toUpperCase()}</h3>
          <p class="meta" style="margin-bottom:8px">dal ${fmtDate(season.created_at, false)}${pendCount ? ` · ${pendCount} partite in attesa` : ""}</p>
          ${dl ? `<p style="margin-bottom:8px;font-weight:600;color:${dl.overdue ? "var(--red-light)" : dl.urgent ? "var(--gold)" : "var(--cream)"}">${dl.text}</p>` : ""}
          ${isAdmin() ? `<div class="meta" style="margin-bottom:4px">Fine prevista:</div>
          <input type="date" data-seasonend="${season.id}" value="${season.ends_at ? season.ends_at.slice(0, 10) : ""}"
            style="padding:9px 12px;border:none;border-radius:8px;font-size:14px;background:var(--cream);color:#1c1c1c;margin-bottom:6px">` : ""}
          ${leader ? `<p>In testa: <b>${esc(leader.name)}</b> (${leader.elo})</p>` : "<p>Nessun giocatore.</p>"}
          ${isAdmin() ? `<button class="close-btn" id="close-season">Chiudi stagione</button>
          <button class="close-btn" data-renameseason="${season.id}" style="margin-left:6px">✏️ Rinomina</button>
          <button class="close-btn" id="recalc-season" style="margin-left:6px">↻ Ricalcola ELO</button>` : ""}
        </div>`;
    } else {
      html += `<div class="empty">Nessuna stagione in corso.</div>`;
    }

    const planned = plannedSeasons()
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    if (planned.length) {
      html += `<div class="section-label">PROSSIME STAGIONI, IN ORDINE</div>`;
      html += planned.map((s, i) =>
        `<div class="row ${i === 0 ? "first" : ""}">
          <div class="rank ${i === 0 ? "gold" : ""}" style="font-size:16px">${i + 1}ª</div>
          <div style="flex:1;min-width:0">
            <div class="player-name">${esc(s.name)}</div>
            <div class="meta">${i === 0 ? "parte alla chiusura della stagione in corso" : `parte dopo "${esc(planned[i - 1].name)}"`}${s.ends_at ? ` · fine prevista ${fmtDate(s.ends_at, false)}` : ""}</div>
            ${isAdmin() ? `<input type="date" data-seasonend="${s.id}" value="${s.ends_at ? s.ends_at.slice(0, 10) : ""}"
              style="margin-top:6px;padding:7px 10px;border:none;border-radius:7px;font-size:13px;background:var(--cream);color:#1c1c1c">` : ""}
          </div>
          ${isAdmin() ? `<button class="edit-btn" data-renameseason="${s.id}" title="Rinomina">✏️</button>
          <button class="del-btn" data-delseason="${s.id}">✕</button>` : ""}
        </div>`).join("");
    }

    const past = closedSeasons();
    if (past.length) {
      const latestClosed = [...past].sort((a, b) => new Date(b.ended_at) - new Date(a.ended_at))[0];
      html += `<div class="section-label" style="margin-top:22px">ALBO D'ORO</div>`;
      html += past.map((s) => {
        const res = state.results[s.id] ?? [];

        // finale a 4: campione, partite, spareggio, oppure lancio (solo admin, ultima stagione chiusa)
        const fin = state.tournaments.find((t) => (t.format ?? "elim") === "finale4" && t.season_id === s.id);
        let finaleHTML = "";
        if (fin) {
          const br = fin.bracket;
          const pname = (pi) => esc(nameOf(br.players[pi]));
          const ch = finaleChampion(fin);
          const head = ch.status === "done"
            ? `<p style="font-size:16px;margin-bottom:6px">👑 Campione di stagione: <b>${esc(nameOf(ch.id))}</b> (${ch.wins}V, diff ${ch.diff >= 0 ? "+" : ""}${ch.diff})</p>`
            : ch.status === "tiebreak"
              ? `<p class="meta" style="margin-bottom:6px">🏁 Parità perfetta: spareggio 1v1 tra <b>${esc(nameOf(ch.ids[0]))}</b> e <b>${esc(nameOf(ch.ids[1]))}</b></p>`
              : `<p class="meta" style="margin-bottom:6px">🏁 Finale a 4 in corso: campione chi vince più partite; a parità differenza reti, poi spareggio 1v1. Fuori ELO.</p>`;
          const rows = br.matches.map((m, i) => {
            const rec = isAdmin() && !m.score
              ? `<div class="b-record">
                  <input class="ts-input" type="number" min="0" id="ts-${fin.id}-f-0-${i}-a" placeholder="0">
                  <span style="opacity:0.6">–</span>
                  <input class="ts-input" type="number" min="0" id="ts-${fin.id}-f-0-${i}-b" placeholder="0">
                  <button data-trecord="${fin.id}|f|0|${i}">OK</button>
                </div>` : "";
            return `<div class="b-match"><div class="b-team">${m.a.map(pname).join(" + ")} <b>${m.score ? `${m.score[0]}–${m.score[1]}` : "vs"}</b> ${m.b.map(pname).join(" + ")}</div>${rec}</div>`;
          }).join("");
          let tbHTML = "";
          if (br.tiebreak) {
            const tb = br.tiebreak;
            const rec = isAdmin() && !tb.score
              ? `<div class="b-record">
                  <input class="ts-input" type="number" min="0" id="ts-${fin.id}-fs-0-0-a" placeholder="0">
                  <span style="opacity:0.6">–</span>
                  <input class="ts-input" type="number" min="0" id="ts-${fin.id}-fs-0-0-b" placeholder="0">
                  <button data-trecord="${fin.id}|fs|0|0">OK</button>
                </div>` : "";
            tbHTML = `<div class="b-match"><div class="b-team">Spareggio: ${esc(nameOf(tb.a))} <b>${tb.score ? `${tb.score[0]}–${tb.score[1]}` : "vs"}</b> ${esc(nameOf(tb.b))}</div>${rec}</div>`;
          }
          const fst = finaleStats(fin);
          const table = fst.played
            ? fst.order.map((p, i) => `<div class="podium-row">
                <span class="medal">${i === 0 && ch.status === "done" ? "👑" : `${i + 1}.`}</span>
                <span class="player-name" style="font-size:14px">${esc(nameOf(p.id))}</span>
                <span class="meta" style="margin-top:0">diff ${p.diff >= 0 ? "+" : ""}${p.diff} · ${p.goals} gol</span>
                <span class="elo-small">${p.wins}V</span>
              </div>`).join("")
            : "";
          finaleHTML = `<div style="margin-bottom:12px">
            ${head}${rows}${tbHTML}${table}
            ${isAdmin() && fin.status === "open" ? `<button class="close-btn" data-deltournament="${fin.id}" style="margin-top:6px">✕ Annulla finale</button>` : ""}
          </div>`;
        } else if (isAdmin() && s.id === latestClosed?.id && res.filter((r) => byId(r.player_id)).length >= 4) {
          const excl = new Set(state.f4Excl);
          const finalists = res.filter((r) => !excl.has(r.player_id) && byId(r.player_id)).slice(0, 4);
          const finalistIds = new Set(finalists.map((r) => r.player_id));
          const chips = res.slice(0, 8).map((r) => {
            const assente = excl.has(r.player_id) || !byId(r.player_id);
            return `<button class="chip ${finalistIds.has(r.player_id) ? "chip-on" : ""}" data-f4excl="${r.player_id}"
              style="${assente ? "text-decoration:line-through;opacity:0.55" : ""}">${r.rank}. ${esc(r.name)}</button>`;
          }).join("");
          finaleHTML = `<div style="margin-bottom:12px">
            <p class="meta" style="margin-bottom:6px">🏁 <b>Finale a 4 da giocare</b>: 3 partite a coppie rotanti, campione chi vince più partite (poi differenza reti, poi spareggio 1v1). Fuori ELO, si gioca anche a stagione nuova già in corso. Tocca un giocatore per segnarlo assente: subentrano i successivi in classifica.</p>
            <div>${chips}</div>
            <p class="meta" style="margin:6px 0">Finalisti: <b>${finalists.map((r) => esc(r.name)).join(", ")}</b></p>
            ${finalists.length === 4 ? `<button class="cta" data-createfinale="${s.id}" style="font-size:14px;padding:10px 0">Lancia la finale a 4</button>` : `<p class="meta">Servono 4 giocatori disponibili.</p>`}
          </div>`;
        }
        const medals = ["🥇", "🥈", "🥉"];
        const podium = res.slice(0, 3).map((r, i) =>
          `<div class="podium-row">
            <span class="medal">${medals[i]}</span>
            <span class="player-name" style="font-size:15px">${esc(r.name)}</span>
            <span class="meta" style="margin-top:0">${r.wins}V–${r.losses}S</span>
            <span class="elo-small">${r.elo}</span>
          </div>`
        ).join("");
        const others = res.length > 3 ? `<div class="meta" style="margin-top:6px">e altri ${res.length - 3} giocatori</div>` : "";
        const aw = s.awards ?? {};
        const awLines = [
          aw.winrate ? `🎯 Miglior win rate: <b>${esc(aw.winrate.name)}</b> (${aw.winrate.pct}%, ${aw.winrate.w}V–${aw.winrate.l}S)` : "",
          aw.streak ? `🔥 Striscia migliore: <b>${esc(aw.streak.name)}</b> (${aw.streak.n}V)` : "",
          aw.games ? `🎮 Più partite: <b>${esc(aw.games.name)}</b> (${aw.games.n})` : "",
          aw.climber ? `📈 Scalata della stagione: <b>${esc(aw.climber.name)}</b> (+${aw.climber.delta})` : "",
          aw.pair ? `🤝 Coppia d'oro: <b>${esc(aw.pair.names)}</b> (${aw.pair.w}V–${aw.pair.l}S)` : "",
        ].filter(Boolean).map((l) => `<p class="meta" style="margin-top:4px">${l}</p>`).join("");
        const dates = `${fmtDate(s.created_at, false)} → ${s.ended_at ? fmtDate(s.ended_at, false) : "?"}`;
        return `<div class="info-card">
          <h3>${esc(s.name).toUpperCase()} ${isAdmin() ? `<button class="edit-btn" data-renameseason="${s.id}" title="Rinomina" style="float:right">✏️</button>` : ""}</h3>
          <p class="meta" style="margin-bottom:10px">${dates}</p>
          ${finaleHTML}
          <div class="section-label" style="margin:0 0 6px">REGULAR SEASON</div>
          ${podium || `<p class="meta">Nessun risultato archiviato.</p>`}
          ${others}
          ${awLines ? `<div style="margin-top:8px">${awLines}</div>` : ""}
        </div>`;
      }).join("");
    }
    app.innerHTML = html;
    return;
  }

  // ---------- ELO ----------
  if (tab === "elo") {
    app.innerHTML = `
      <div class="info-card">
        <h3>LE BASI</h3>
        <p>Tutti partono da <b>1000 punti</b>. Dopo ogni partita il vincitore prende punti e il perdente li perde: quello che guadagna una squadra è esattamente quello che perde l'altra. Il rating non misura quante partite hai vinto, ma <b>quanto sei forte rispetto agli altri</b>.</p>
        <p>Le partite proposte dai giocatori entrano in classifica solo dopo la <b>conferma di un admin</b>, e i punti si calcolano con i rating al momento della conferma. Le partite dei tornei sono partite a tutti gli effetti e muovono l'ELO come le altre, a meno che l'admin non abbia creato il torneo come <b>"solo per la gloria"</b>: in quel caso il tabellone vive per conto suo e i rating non si toccano.</p>
      </div>

      <div class="info-card">
        <h3>QUANTO VALE UNA VITTORIA</h3>
        <p>Dipende da tre cose.</p>
        <p><b>1. Chi hai battuto.</b> Prima della partita il sistema calcola la probabilità di vittoria dal divario di rating:</p>
        <div class="formula">attesa = 1 / (1 + 10^((eloAvv − eloTuo) / 400))</div>
        <p>Battere un avversario molto più forte vale tanto, battere l'ultimo in classifica vale poco. Perdere da favorito costa caro, perdere da sfavorito costa quasi niente.</p>
        <p><b>2. Il punteggio.</b> Il delta viene moltiplicato per un fattore che cresce col divario di gol:</p>
        <div class="formula">mov = ln(diffGol + 1) × 2.2 / (diffElo × 0.001 + 2.2)</div>
        <p>Un 10-9 vale circa <b>0.7×</b> il valore base, un 10-0 circa <b>2.4×</b>. La seconda parte della formula smorza i cappotti del favorito e amplifica quelli dello sfavorito, così i più forti non gonfiano il rating massacrando gli ultimi.</p>
        <p>Se il punteggio non ve lo ricordate, si può registrare solo chi ha vinto: la partita vale <b>0.5×</b>, meno di una vittoria di misura, perché senza il punteggio il sistema ha meno informazione ed è prudente.</p>
        <p><b>3. Il tuo compagno</b> (solo 2v2, vedi sotto).</p>
        <p>Al delta finale si applicano poi bonus e malus: vedi la tabella qui sotto.</p>
      </div>

      <div class="info-card">
        <h3>BONUS E MALUS: TUTTI I MOLTIPLICATORI</h3>
        <p>Oltre al punteggio, il delta di ogni partita viene moltiplicato da questi fattori:</p>
        <table class="example-table">
          <tr><td>⭐ Tavolo consigliato da "Chi c'è oggi"</td><td class="pos">×1.25</td></tr>
          <tr><td>Partita senza punteggio (solo chi ha vinto)</td><td class="neg">×0.5</td></tr>
          <tr><td>Dalla 3ª partita dello stesso giorno tra le stesse squadre</td><td class="neg">×0.5</td></tr>
        </table>
        <p style="margin-top:8px">I <b>tavoli di "Chi c'è oggi"</b> sono le formazioni che l'app compone tra i presenti selezionati: coppie mescolate, squadre equilibrate, precedenza a chi ha giocato meno e ruoli usati <b>solo come rompi-pareggi</b>: a parità di tutto il resto si preferiscono le coppie che si incastrano, con un filo di vantaggio per l'ibrido che si adatta a chiunque. <b>Nessuna coppia è vietata</b>, nemmeno due attaccanti o due difensori insieme, che valgono uguale. Priorità agli <b>scontri diretti mai giocati tra chi ha un ELO vicino</b>: sono le partite che rompono i pareggi in classifica, con un occhio di riguardo per il vertice ma senza dimenticare il fondo.</p>
        <p>I bonus ⭐ valgono solo giocando la <b>formazione esatta</b> accettata con "Usa": cambi anche un solo giocatore e il bonus decade. Da 8 presenti in su l'app propone <b>due tavoli con persone distinte</b>: il <b>Tavolo 1</b>, la partita con più senso tra i presenti, vale <b>sempre ×1.25</b>; il Tavolo 2 solo se porta incroci o coppie mai viste. Sotto gli 8 presenti, il tavolo singolo prende il bonus solo se porta qualcosa di nuovo.</p>
        <p>I fattori si <b>moltiplicano tra loro</b>: un tavolo consigliato vinto 10-0 vale 2.4 × 1.25 = <b>3 volte</b> una vittoria base, mentre la quinta rivincita della serata contro la stessa coppia, per giunta senza punteggio, vale 0.5 × 0.5 = <b>un quarto</b>. Il perché è sempre lo stesso: il sistema premia le partite che gli dicono qualcosa di nuovo e sconta quelle che ripetono informazione già nota.</p>
      </div>

      <div class="info-card">
        <h3>IL 2v2, IL COMPAGNO E LA COPPIA SBILANCIATA</h3>
        <p>Il rating di squadra parte dalla <b>media</b> dei due giocatori, ma una coppia sbilanciata vale meno della sua media: al balilla l'anello debole pesa più di quanto il forte possa compensare. Quindi:</p>
        <div class="formula">ratingSquadra = media − 0.25 × |elo1 − elo2|</div>
        <p>Una coppia 1300+700 non vale 1000 ma <b>850</b>: parte sfavorita contro due da 1000. Questo protegge il giocatore forte con un compagno molto scarso: se perdete, la sconfitta era già messa in conto e i punti persi sono pochi. Se vincete, valgono di più.</p>
        <p>Il bottino viene poi diviso in base ai rating individuali: se vinci, <b>il più debole della coppia prende la fetta più grande</b> (ha sovraperformato). Se perdete, <b>il più forte perde di più</b>, ma su un totale già ridotto dallo sbilanciamento.</p>
      </div>

      <div class="info-card">
        <h3>ESEMPIO CONCRETO</h3>
        <p>Marco (1100) e Luca (900) battono 10-3 una coppia da 1000 e 1000. La media sarebbe pari, ma con la correzione la coppia vale 950 e parte sfavorita (43%). Vittoria larga da sfavoriti: montepremi di circa 78 punti.</p>
        <table class="example-table">
          <tr><td>Luca (900, il più debole)</td><td class="pos">+43</td></tr>
          <tr><td>Marco (1100, il più forte)</td><td class="pos">+35</td></tr>
          <tr><td>Avversario 1 (1000)</td><td class="neg">−39</td></tr>
          <tr><td>Avversario 2 (1000)</td><td class="neg">−39</td></tr>
        </table>
        <p style="margin-top:8px">Stessa partita finita 10-9: montepremi di circa 26 punti. E se Marco e Luca avessero perso, avrebbero pagato poco: partivano sfavoriti.</p>
      </div>

      <div class="info-card">
        <h3>LE STAGIONI</h3>
        <p>Quando l'admin chiude una stagione, la classifica finale viene <b>archiviata nell'albo d'oro</b> e si riparte <b>a scaglioni</b>: chi ha chiuso in alto conserva un vantaggio compresso, così il sistema ricorda chi è più forte e non gli regala punti facili contro chi è ripartito da meno.</p>
        <div class="formula">1250+ → 1150 · 1150+ → 1100 · 1050+ → 1050<br>950+ → 1000 · 850+ → 950 · 750+ → 900 · sotto → 850</div>
        <p>Le stagioni si possono <b>pianificare in anticipo</b>: alla chiusura di quella in corso, parte automaticamente la prossima in coda. Ogni stagione è un campionato a sé: vincerla conta più del rating assoluto.</p>
      </div>

      <div class="info-card">
        <h3>CHI ENTRA IN CLASSIFICA</h3>
        <p>Per comparire in classifica servono, nella stagione: <b>10 partite</b>, <b>6 avversari diversi</b> e <b>3 compagni diversi</b>. Chi non ci arriva è tra i "non classificati" con un ELO provvisorio: poche partite, o sempre contro le stesse persone, producono un rating non confrontabile con gli altri.</p>
      </div>

      <div class="info-card">
        <h3>IN PRATICA</h3>
        <p>Vuoi salire in fretta? Sfida chi sta sopra di te, gioca in coppia col più scarso e vinci largo. Vuoi difendere il primo posto? Non ti conviene nasconderti: contro i deboli hai poco da guadagnare e tanto da perdere.</p>
      </div>`;
    return;
  }

  // ---------- NUMERI (record di sempre) ----------
  if (tab === "numeri") {
    const recap = buildDayRecap().html;
    const n = state.numeri;
    if (!n) {
      app.innerHTML = `${recap}<div class="loading">Sto rileggendo tutte le partite di sempre…</div>`;
      return;
    }
    const rows = [];
    // tutti i cappotti: totale + chi li rifila e chi li subisce
    if (n.cappTot > 0) {
      const topList = (obj, verbo) => Object.entries(obj)
        .sort((a, b) => b[1] - a[1]).slice(0, 3)
        .map(([id, c]) => `${esc(nameOf(id))} (${c})`).join(", ");
      const rifilati = topList(n.capp);
      const subiti = topList(n.cappSub);
      rows.push(["🧹 Tutti i cappotti", `<b>${n.cappTot}</b> cappotti di sempre.${rifilati ? `<br>Rifilati: ${rifilati}` : ""}${subiti ? `<br>Subiti: ${subiti}` : ""}`]);
    }
    if (n.streak && n.streak.n >= 3) rows.push(["🔥 Striscia più lunga di sempre", `<b>${esc(nameOf(n.streak.id))}</b> · ${n.streak.n} vittorie di fila`]);
    // tornei vinti (da state.tournaments, tutti i formati)
    const tWins = {};
    for (const t of state.tournaments) {
      if (t.status !== "done") continue;
      const winIdx = tournamentWinnerIdx(t);
      const team = winIdx == null ? null : t.teams[winIdx];
      if (!team) continue;
      for (const id of [team.p1, team.p2]) if (byId(id)) tWins[id] = (tWins[id] ?? 0) + 1;
    }
    const tMax = Math.max(0, ...Object.values(tWins));
    if (tMax > 0) {
      const kings = Object.entries(tWins).filter(([, c]) => c === tMax)
        .map(([id]) => esc(nameOf(id))).join(", ");
      rows.push(["🏆 Più tornei vinti", `<b>${kings}</b> · ${tMax} ${tMax === 1 ? "torneo" : "tornei"}`]);
    }
    if (n.wrBest) rows.push(["📈 Winrate più alto (100+ partite)", `<b>${esc(nameOf(n.wrBest.id))}</b> · ${Math.round(n.wrBest.pct * 100)}% (${n.wrBest.w}V–${n.wrBest.g - n.wrBest.w}S)`]);
    if (n.rival) rows.push(["⚔️ Rivalità più giocata", `<b>${esc(nameOf(n.rival.ids[0]))}</b> vs <b>${esc(nameOf(n.rival.ids[1]))}</b> · ${n.rival.n} incroci`]);
    if (n.mate) rows.push(["🤝 Coppia più rodata", `<b>${esc(nameOf(n.mate.ids[0]))} + ${esc(nameOf(n.mate.ids[1]))}</b> · ${n.mate.n} partite insieme`]);
    if (n.day) rows.push(["📅 Giorno più intenso", `${new Date(n.day.day).toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" })} · ${n.day.n} partite`]);
    // migliori coppie di sempre (winrate, min 3 insieme)
    let pairsHTML = "";
    if (n.pairsBest?.length) {
      pairsHTML = `<div class="section-label" style="margin-top:18px">MIGLIORI COPPIE</div>
        <div class="meta" style="margin-bottom:6px">Tutte le coppie con almeno ${PAIR_QUAL.games} partite insieme contro ${PAIR_QUAL.opps} coppie avversarie diverse, ordinate per percentuale di vittorie.</div>`;
      pairsHTML += n.pairsBest.map((p, i) => {
        const pct = Math.round((p.w / (p.w + p.l)) * 100);
        return `<div class="row">
          <div class="rank" style="font-size:16px">${i + 1}</div>
          <div style="flex:1">
            <div class="player-name" style="font-size:14px">${p.ids.map((id) => esc(nameOf(id))).join(" + ")}</div>
            <div class="meta">${p.w}V–${p.l}S · ${pct}%</div>
          </div>
        </div>`;
      }).join("");
    }
    app.innerHTML = `
      ${recap}
      <div class="info-card">
        <h3>I NUMERI DI SEMPRE</h3>
        <p class="meta">${n.tot} partite giocate · ${n.totGol} gol segnati. Record calcolati su tutto lo storico, tutte le stagioni.</p>
        <button class="close-btn" data-numerireload="1">↻ Aggiorna</button>
      </div>
      ${rows.map(([h, b]) => `<div class="info-card"><h3>${h}</h3><p style="font-size:14px;line-height:1.5">${b}</p></div>`).join("")}
      ${pairsHTML}
      ${rows.length || pairsHTML ? "" : `<div class="empty">Ancora poche partite per i record.</div>`}`;
    return;
  }

  // ---------- GIOCATORI ----------
  if (tab === "rosa") {
    const rows = [...players].sort(byName).map((p) => {
      const role = roleOf(p);
      const roleUI = isAdmin()
        ? `<select class="role-select" data-roleplayer="${p.id}">
            ${["difensore", "attaccante", "ibrido"].map((r) =>
              `<option value="${r}" ${r === role ? "selected" : ""}>${ROLE_LABEL[r]}</option>`).join("")}
          </select>`
        : `<span class="meta" style="margin-top:0;white-space:nowrap">${ROLE_LABEL[role]}</span>`;
      const tot = state.totals[p.id] ?? { wins: 0, losses: 0 };
      return `<div class="row">
        <div style="flex:1;min-width:0">
          <div class="player-name">${esc(p.name)}</div>
          <div class="meta">ELO ${p.elo} · totale: ${tot.wins}V–${tot.losses}S (${tot.wins + tot.losses} partite)</div>
        </div>
        ${roleUI}
        ${isAdmin() ? `<button class="edit-btn" data-rename="${p.id}" title="Rinomina">✏️</button>` : ""}
      </div>`;
    }).join("");

    const addForm = isAdmin()
      ? `<div class="add-row">
          <input id="new-name" placeholder="Nome giocatore" maxlength="30">
          <button id="add-player">Aggiungi</button>
        </div>`
      : `<div class="add-row">
          <input id="req-name" placeholder="Proponi un giocatore" maxlength="30">
          <button id="request-player">Proponi</button>
        </div>`;

    const requestsHTML = state.requests.length
      ? `<div class="section-label">RICHIESTE DI AGGIUNTA (${state.requests.length})</div>` +
        state.requests.map((r) =>
          `<div class="match-row pending">
            <div style="flex:1">
              <div class="player-name">${esc(r.name)}</div>
              <div class="meta">proposto il ${fmtDate(r.created_at)}</div>
              ${isAdmin() ? `<div class="confirm-actions">
                <button class="btn-confirm" data-approvereq="${r.id}">Conferma</button>
                <button class="btn-reject" data-rejectreq="${r.id}">Rifiuta</button>
              </div>` : ""}
            </div>
          </div>`).join("") +
        `<div style="height:10px"></div>`
      : "";

    const authBox = isAdmin()
      ? `<div class="auth-box">
          <div class="meta" style="margin-bottom:8px">Admin: ${esc(state.session.user.email)}</div>
          <button class="undo" id="backup">Scarica backup dati (JSON)</button>
          <button class="undo" id="logout" style="margin-bottom:0">Esci</button>
        </div>`
      : `<div class="auth-box">
          <div class="meta" style="margin-bottom:8px">Accesso admin</div>
          <input id="login-email" type="email" placeholder="Email" autocomplete="username">
          <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
          <button class="cta" id="login" style="font-size:14px;padding:11px 0">Accedi</button>
        </div>`;

    app.innerHTML = `
      ${addForm}
      ${requestsHTML}
      ${rows || `<div class="empty">Nessun giocatore in rosa.</div>`}
      ${authBox}
      <div class="foot-note">Chiunque può vedere tutto e proporre partite; solo gli admin confermano, gestiscono rosa, stagioni e tornei.</div>`;
  }
}

// ---------- Realtime ----------
let rtTimer;
function subscribeRealtime() {
  sb.channel("db-changes")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(rtTimer);
      rtTimer = setTimeout(async () => {
        if (state.busy) return;
        await loadAll();
        render();
      }, 500);
    })
    .subscribe();
}

// ---------- Eventi ----------
async function withBusy(fn) {
  if (state.busy) return;
  state.busy = true;
  setLoading(true);
  render();
  try {
    await fn();
    await loadAll();
  } finally {
    state.busy = false;
    setLoading(false);
    render();
  }
}

document.addEventListener("click", async (e) => {
  if (TV) return;
  const t = e.target;

  if (t.dataset.tab) {
    state.tab = t.dataset.tab;
    state.profileId = null;
    state.editMatch = null;
    state.historyLimit = 50;
    setLoading(true);
    await loadAll();
    setLoading(false);
    render();
    if (state.tab === "numeri" && !state.numeri) loadNumeri();
    return;
  }
  if (t.id === "profile-back") {
    state.profileId = null;
    render();
    return;
  }
  const profEl = e.target.closest?.("[data-profile]");
  if (profEl && !e.target.closest("button")) {
    const pid = profEl.dataset.profile;
    state.profileId = pid;
    state.h2hId = null;
    state.profileMatches = null;
    render();
    (async () => {
      setLoading(true);
      try {
        const { data, error } = await sb.from("matches").select("*").eq("status", "confirmed")
          .or(`team_a.cs.{${pid}},team_b.cs.{${pid}}`)
          .order("confirmed_at", { ascending: true });
        if (!error && data && state.profileId === pid) {
          state.profileMatches = data;
          render();
        }
      } finally {
        setLoading(false);
      }
    })();
    return;
  }
  if (t.dataset.tformat) {
    state.tFormat = t.dataset.tformat;
    render();
    return;
  }
  if (t.dataset.trated) {
    state.tRated = t.dataset.trated === "1";
    render();
    return;
  }
  if (t.dataset.tsignup) {
    state.tSignup = t.dataset.tsignup === "1";
    if (state.tSignup) state.tAuto = false;
    render();
    return;
  }
  if (t.dataset.f4excl) {
    const id = t.dataset.f4excl;
    const k = state.f4Excl.indexOf(id);
    if (k >= 0) state.f4Excl.splice(k, 1);
    else state.f4Excl.push(id);
    render();
    return;
  }
  if (t.dataset.createfinale) {
    if (!confirm("Lanciare la finale a 4 con i finalisti indicati?")) return;
    return withBusy(() => createFinale(t.dataset.createfinale));
  }
  if (t.dataset.tauto) {
    state.tAuto = t.dataset.tauto === "1";
    if (state.tAuto) state.tSignup = false;
    render();
    return;
  }
  if (t.dataset.tautosel) {
    const id = t.dataset.tautosel;
    const k = state.tAutoIds.indexOf(id);
    if (k >= 0) state.tAutoIds.splice(k, 1);
    else state.tAutoIds.push(id);
    render();
    return;
  }
  if (t.dataset.histseason) {
    state.historySeason = t.dataset.histseason;
    state.historyLimit = 50;
    render();
    return;
  }
  if (t.dataset.histmore) {
    state.historyLimit += 50;
    render();
    return;
  }
  if (t.dataset.copyrecap) {
    const { text } = buildDayRecap();
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text).then(
        () => toast("Riepilogo copiato, incollalo nel gruppo"),
        () => toast("Copia non riuscita", false));
    } else {
      toast("Copia non supportata su questo browser", false);
    }
    return;
  }
  if (t.dataset.numerireload) {
    state.numeri = null;
    render();
    loadNumeri();
    return;
  }
  if (t.dataset.ch2 != null) {
    state.ch2 = t.dataset.ch2 === "1";
    render();
    return;
  }
  if (t.dataset.newchallenge) {
    const val = (id) => document.getElementById(id)?.value || null;
    const row = state.ch2
      ? { from_id: val("ch-from"), from2_id: val("ch-from2"), to_id: val("ch-to"), to2_id: val("ch-to2") }
      : { from_id: val("ch-from"), to_id: val("ch-to") };
    const ids = Object.values(row).filter(Boolean);
    const richiesti = state.ch2 ? 4 : 2;
    if (ids.length < richiesti) { toast("Completa tutte le sponde della sfida", false); return; }
    if (new Set(ids).size !== ids.length) { toast("Un giocatore è su entrambe le sponde o ripetuto", false); return; }
    return withBusy(async () => {
      const { error } = await sb.from("challenges").insert(row);
      if (error) { toast("Errore nel lancio della sfida (hai eseguito supabase-sfide.sql aggiornato?)", false); return; }
      toast("Sfida lanciata!");
    });
  }
  if (t.dataset.delchallenge) {
    if (!confirm("Eliminare questa sfida?")) return;
    return withBusy(async () => {
      const { error } = await sb.from("challenges").delete().eq("id", t.dataset.delchallenge);
      if (error) toast("Errore nell'eliminazione", false);
      else toast("Sfida eliminata");
    });
  }
  if (t.dataset.mode) {
    state.mode = t.dataset.mode;
    state.teamA = ["", ""];
    state.teamB = ["", ""];
    render();
    return;
  }
  if (t.dataset.scoremode) {
    state.noScore = t.dataset.scoremode === "noscore";
    state.winnerSide = null;
    render();
    return;
  }
  if (t.dataset.winner) {
    state.winnerSide = t.dataset.winner;
    render();
    return;
  }
  if (t.dataset.present) {
    const id = t.dataset.present;
    const idx = state.present.indexOf(id);
    if (idx >= 0) state.present.splice(idx, 1); else state.present.push(id);
    render();
    return;
  }
  if (t.dataset.score) {
    const key = t.dataset.score === "A" ? "scoreA" : "scoreB";
    state[key] = Number(t.dataset.val);
    render();
    return;
  }
  if (t.dataset.suggest) {
    const [a1, a2, b1, b2] = t.dataset.suggest.split("|");
    state.mode = "2v2";
    state.noScore = false;
    state.winnerSide = null;
    state.teamA = [a1, a2];
    state.teamB = [b1, b2];
    const bv = parseFloat(t.dataset.boostval ?? "1");
    if (bv > 1) {
      state.suggestedList = state.suggestedList.filter((s) =>
        !((teamSetEq(s.a, [a1, a2]) && teamSetEq(s.b, [b1, b2])) ||
          (teamSetEq(s.a, [b1, b2]) && teamSetEq(s.b, [a1, a2]))));
      state.suggestedList.push({ a: [a1, a2], b: [b1, b2], boost: bv });
    }
    state.scoreA = 0;
    state.scoreB = 0;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (t.dataset.editmatch) {
    const m = findMatch(t.dataset.editmatch);
    if (!m) return;
    const noScore = m.score_a == null || m.score_b == null;
    state.editMatch = {
      id: m.id,
      a: [...m.team_a], b: [...m.team_b],
      noScore,
      sa: noScore ? "" : m.score_a,
      sb: noScore ? "" : m.score_b,
      ws: m.winner_side ?? null,
    };
    render();
    return;
  }
  if (t.dataset.canceledit) {
    state.editMatch = null;
    render();
    return;
  }
  if (t.dataset.editscoremode) {
    const em = state.editMatch;
    if (!em) return;
    // salva i valori digitati prima del re-render
    const ia = document.getElementById(`edit-sa-${em.id}`);
    const ib = document.getElementById(`edit-sb-${em.id}`);
    if (ia) em.sa = ia.value;
    if (ib) em.sb = ib.value;
    em.noScore = t.dataset.editscoremode === "noscore";
    render();
    return;
  }
  if (t.dataset.editwinner) {
    const em = state.editMatch;
    if (!em) return;
    em.ws = t.dataset.editwinner;
    render();
    return;
  }
  if (t.dataset.delmatch) {
    const m = findMatch(t.dataset.delmatch);
    if (!m) return;
    const msg = m.status === "confirmed"
      ? "Eliminare questa partita?\nTutta la stagione verrà ricalcolata partita per partita: i delta e i rating cambieranno di conseguenza."
      : "Eliminare questa partita in attesa?";
    if (!confirm(msg)) return;
    return withBusy(deleteMatchEdit);
  }
  if (t.dataset.saveedit) {
    const em = state.editMatch;
    const m = findMatch(t.dataset.saveedit);
    if (!m || !em) return;
    // salva i valori digitati prima del re-render di withBusy
    const ia = document.getElementById(`edit-sa-${em.id}`);
    const ib = document.getElementById(`edit-sb-${em.id}`);
    if (ia) em.sa = ia.value;
    if (ib) em.sb = ib.value;
    const msg = m.status === "confirmed"
      ? "Salvare le correzioni?\nTutta la stagione verrà ricalcolata partita per partita: i delta e i rating cambieranno di conseguenza."
      : "Salvare le correzioni per questa partita in attesa?";
    if (!confirm(msg)) return;
    return withBusy(saveMatchEdit);
  }
  if (t.id === "save-match") return withBusy(recordMatch);
  if (t.dataset.confirm) return withBusy(() => confirmMatch(t.dataset.confirm));
  if (t.dataset.reject) {
    if (!confirm("Rifiutare questa partita? Verrà eliminata.")) return;
    return withBusy(() => rejectMatch(t.dataset.reject));
  }
  if (t.id === "undo") {
    if (!confirm("Annullare l'ultima partita confermata?")) return;
    return withBusy(undoLast);
  }
  if (t.id === "create-season") {
    const name = document.getElementById("new-season-name").value.trim();
    if (!name) { toast("Dai un nome alla stagione", false); return; }
    const endRaw = document.getElementById("new-season-end")?.value;
    const endsAt = endRaw ? new Date(endRaw + "T23:59:59").toISOString() : null;
    return withBusy(() => createSeason(name, endsAt));
  }
  if (t.id === "recalc-season") {
    if (!confirm("Ricalcolare tutta la stagione?\nTutte le partite confermate vengono rigiocate in ordine cronologico e i rating riscritti. Può richiedere qualche secondo.")) return;
    return withBusy(recalcSeason);
  }
  if (t.id === "backup") {
    setLoading(true);
    downloadBackup().finally(() => setLoading(false));
    return;
  }
  if (t.id === "close-season") {
    const s = activeSeason();
    if (!s) return;
    const next = plannedSeasons().sort((a, b) => new Date(a.created_at) - new Date(b.created_at))[0];
    const pendCount = state.pending.filter((m) => m.season_id === s.id).length;
    const warn = pendCount ? `\n\nAttenzione: ${pendCount} partite in attesa resteranno non conteggiate.` : "";
    const after = next ? `Partirà subito "${next.name}".` : "Non partirà nessuna stagione finché non ne crei una.";
    if (!confirm(`Chiudere "${s.name}"?\nLa classifica va nell'albo d'oro e si riparte a scaglioni in base al rating finale.\n${after}${warn}`)) return;
    return withBusy(closeSeason);
  }
  if (t.dataset.renameseason) {
    const s = seasonById(t.dataset.renameseason);
    if (!s) return;
    const newName = prompt(`Nuovo nome per "${s.name}":`, s.name);
    if (newName == null) return;
    const clean = newName.trim().slice(0, 40);
    if (!clean || clean === s.name) return;
    return withBusy(() => renameSeason(s.id, clean));
  }
  if (t.dataset.delseason) {
    const s = seasonById(t.dataset.delseason);
    if (!s || s.active || s.ended_at) return;
    if (!confirm(`Eliminare la stagione pianificata "${s.name}"?`)) return;
    return withBusy(() => deletePlannedSeason(s.id));
  }
  if (t.id === "t-addpair") {
    state.tPairs.push(["", ""]);
    render();
    return;
  }
  if (t.dataset.tremovepair != null) {
    state.tPairs.splice(Number(t.dataset.tremovepair), 1);
    render();
    return;
  }
  if (t.id === "create-tournament") {
    return withBusy(createTournament);
  }
  if (t.dataset.claim) {
    const [tid, ti, slot] = t.dataset.claim.split("|");
    const sel = document.getElementById(`su-${tid}-${ti}-${slot}`);
    const pid = sel?.value;
    if (!pid) { toast("Scegli un giocatore per il posto", false); return; }
    if (!confirm(`Confermare ${nameOf(pid)} in questo posto? Non si potrà più cambiare.`)) return;
    return withBusy(() => claimSlot(tid, Number(ti), Number(slot), pid));
  }
  if (t.dataset.addpair) {
    return withBusy(() => addSignupPair(t.dataset.addpair));
  }
  if (t.dataset.delpair) {
    const [tid, ti] = t.dataset.delpair.split("|");
    const tor = state.tournaments.find((x) => x.id === tid);
    const pair = tor?.teams[Number(ti)];
    if (!pair) return;
    const who = [pair.p1, pair.p2].filter(Boolean).map(nameOf).join(" + ");
    if (!confirm(who ? `Rimuovere la coppia con ${who}?` : "Rimuovere questa coppia vuota?")) return;
    return withBusy(() => removeSignupPair(tid, Number(ti)));
  }
  if (t.dataset.starttournament) {
    const tor = state.tournaments.find((x) => x.id === t.dataset.starttournament);
    if (!tor) return;
    if (!confirm(`Avviare "${tor.name}"? Le coppie diventano teste di serie e le iscrizioni si chiudono.`)) return;
    return withBusy(() => startTournament(tor));
  }
  if (t.dataset.deltournament) {
    const tor = state.tournaments.find((x) => x.id === t.dataset.deltournament);
    if (!tor) return;
    if (!confirm(`Eliminare il torneo "${tor.name}"?\nLe partite già giocate restano nello storico e l'ELO non cambia: sparisce solo il tabellone.`)) return;
    return withBusy(() => deleteTournament(tor.id));
  }
  if (t.dataset.trecord) {
    const [tid, sec, r, i] = t.dataset.trecord.split("|");
    const sa = parseInt(document.getElementById(`ts-${tid}-${sec}-${r}-${i}-a`)?.value, 10);
    const sbv = parseInt(document.getElementById(`ts-${tid}-${sec}-${r}-${i}-b`)?.value, 10);
    if (Number.isNaN(sa) || Number.isNaN(sbv)) { toast("Inserisci entrambi i punteggi", false); return; }
    return withBusy(() => recordTournamentMatch(tid, sec, Number(r), Number(i), sa, sbv));
  }
  if (t.dataset.rename) {
    const p = byId(t.dataset.rename);
    if (!p) return;
    const newName = prompt(`Nuovo nome per "${p.name}":`, p.name);
    if (newName == null) return;
    const clean = newName.trim().slice(0, 30);
    if (!clean || clean === p.name) return;
    return withBusy(() => renamePlayer(p.id, clean));
  }
  if (t.id === "add-player") {
    const name = document.getElementById("new-name").value.trim();
    if (!name) return;
    return withBusy(() => addPlayer(name));
  }
  if (t.id === "request-player") {
    const name = document.getElementById("req-name").value.trim();
    if (!name) return;
    return withBusy(() => requestPlayer(name));
  }
  if (t.dataset.approvereq) {
    const r = state.requests.find((x) => x.id === t.dataset.approvereq);
    if (!r) return;
    return withBusy(() => approveRequest(r));
  }
  if (t.dataset.rejectreq) {
    if (!confirm("Rifiutare questa richiesta?")) return;
    return withBusy(() => rejectRequest(t.dataset.rejectreq));
  }
  if (t.id === "login") {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-pass").value;
    if (!email || !password) return;
    setLoading(true);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) { toast("Credenziali non valide", false); return; }
    toast("Accesso effettuato");
    return;
  }
  if (t.id === "logout") {
    await sb.auth.signOut();
    toast("Sei uscito");
    return;
  }
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.team) {
    const team = t.dataset.team === "red" ? state.teamA : state.teamB;
    team[Number(t.dataset.slot)] = t.value;
    render();
    return;
  }
  if (t.dataset.tpair != null) {
    state.tPairs[Number(t.dataset.tpair)][Number(t.dataset.tslot)] = t.value;
    render();
    return;
  }
  if (t.dataset.roleplayer) {
    withBusy(() => setRole(t.dataset.roleplayer, t.value));
    return;
  }
  if (t.dataset.editteam) {
    const em = state.editMatch;
    if (!em) return;
    em[t.dataset.editteam][Number(t.dataset.editslot)] = t.value;
    render();
    return;
  }
  if (t.dataset.histplayer) {
    state.historyPlayer = t.value;
    state.historyLimit = 50;
    render();
    return;
  }
  if (t.dataset.h2h) {
    state.h2hId = t.value || null;
    render();
    return;
  }
  if (t.dataset.adminslot) {
    const [tid, ti, slot] = t.dataset.adminslot.split("|");
    withBusy(() => setSignupSlot(tid, Number(ti), Number(slot), t.value || null));
    return;
  }
  if (t.dataset.scorefree) {
    const key = t.dataset.scorefree === "A" ? "scoreA" : "scoreB";
    const v = parseInt(t.value, 10);
    if (!Number.isNaN(v) && v >= 0) state[key] = v;
    render();
    return;
  }
  if (t.dataset.seasonend) {
    const iso = t.value ? new Date(t.value + "T23:59:59").toISOString() : null;
    withBusy(async () => {
      const { error } = await sb.from("seasons").update({ ends_at: iso }).eq("id", t.dataset.seasonend);
      if (error) toast("Errore nel salvataggio della data", false);
      else toast(iso ? "Data di fine impostata" : "Data di fine rimossa");
    });
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "t-name") state.tName = e.target.value;
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "new-name") document.getElementById("add-player")?.click();
  if (e.target.id === "req-name") document.getElementById("request-player")?.click();
  if (e.target.id === "login-email" || e.target.id === "login-pass") document.getElementById("login")?.click();
  if (e.target.id === "new-season-name") document.getElementById("create-season")?.click();
});

// ---------- Avvio ----------
const { data: sessionData } = await sb.auth.getSession();
state.session = sessionData.session;
sb.auth.onAuthStateChange((_event, session) => {
  state.session = session;
  render();
});

if (TV) document.body.classList.add("tv");
await loadAll();
render();
subscribeRealtime();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
